<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ── Content-Security-Policy ─────────────────────────────────────────────────
     GitHub Pages는 응답 헤더를 설정할 수 없어 meta로 선언한다.
     ⚠️ meta 형태에서는 `frame-ancestors`가 **무시된다** — 즉 클릭재킹(iframe 감싸기)은
        이 선언으로 막지 못한다(미해결). 헤더를 붙일 수 있는 호스팅으로 옮기거나
        JS frame-busting을 넣기 전까지 남는 위험이다.
     ⚠️ 'unsafe-inline'(script-src)은 이 앱이 단일 파일 인라인 스크립트라 뺄 수 없다.
        따라서 CSP는 XSS "실행"을 막지 못한다 — 실행 자체를 막는 것은 esc()/sigD()이고,
        여기서 얻는 것은 **유출 경로 차단**(connect-src로 개인키·명단을 외부로 못 보냄),
        object-src/base-uri 봉쇄다.
     ⚠️ connect-src를 좁힌 대가: (beta.45에서 입력칸은 없앴지만) meta.relayServer가 기본값 외 도메인이면
        연결이 차단된다(기본 서버만 허용). 자체 서버 운용이 필요해지면 이 목록을 함께 넓힐 것. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; connect-src 'self' https://prepaid-relay.sulsul-plus.workers.dev; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>선입금대장</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--line:#e1e5ea;--text:#1b2838;--muted:#5f6d7e;--primary:#1a5276;--primary-soft:#e6f0f8;--primary-dark:#12405f;--primary-glow:rgba(26,82,118,.12);--danger:#c0392b;--danger-soft:#fef0ee;--warn:#c05621;--warn-soft:#fef6ee;--success:#0e7a46;--success-soft:#edf8f2;--surface-warm:#fff7ea;--balance-grad:linear-gradient(135deg,#174579,#1e6e94);--accent-bar:linear-gradient(180deg,var(--primary),#2874a6);--shadow:0 1px 4px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.03);--shadow-md:0 4px 12px rgba(15,23,42,.08);--shadow-lg:0 12px 32px rgba(15,23,42,.12);--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}body{min-height:100vh}button,input,select{font:inherit}button{border:none;cursor:pointer;border-radius:12px;min-height:52px;transition:transform .1s,opacity .12s}button:active{transform:scale(.97);opacity:.82}input,select{width:100%;min-height:52px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .2s}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-glow);outline:none}

/* ─── 레이아웃 ─── */
.app{max-width:900px;margin:0 auto;padding:16px 16px 90px}
.top{position:sticky;top:0;z-index:10;background:rgba(240,242,245,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 0 12px;border-bottom:1px solid rgba(225,229,234,.5)}
.title{display:flex;gap:10px;align-items:start;justify-content:space-between}
.title h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px;background:linear-gradient(135deg,var(--primary),#2874a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{margin-top:3px;color:var(--muted);font-size:12px;letter-spacing:.2px}
.tool{display:flex;gap:6px;flex-wrap:wrap}
.tool button{min-height:38px;padding:0 13px;font-size:13px;font-weight:700;border-radius:10px}
/* 홈 상단 [장부 저장] — 상시 노출(월간 배너 대체). 저장 시점(monthlyBackupDue)이면 강조색 + ⚠️ 배지가 붙는다. */
/* [손님 셀프 조회] — 1탭으로 손님 화면(잠금)으로 넘어가는 버튼. 홈에서 가장 자주 쓰는 버튼이라 눈에 띄게 둔다. */
.tool .handoff{background:var(--primary);border-color:var(--primary);color:#fff}
/* 홈 필터 2행 — 1행은 검색창 전폭(폰에서도 300px+), 2행은 소속 필터 + 음성 검색 */
.home-filters{display:grid;gap:8px;margin-top:10px}
.home-filters .filter-row{display:flex;gap:8px}
.home-filters .filter-row>input,.home-filters .filter-row>select{flex:1 1 auto;min-width:0}
.home-filters .filter-row>button{flex:0 0 auto}

/* ─── 버튼 ─── */
.btn{background:#fff;border:1.5px solid var(--line);color:var(--text)}
.btn-primary{background:linear-gradient(135deg,var(--primary),#1e6fa1);color:#fff;border:none;box-shadow:0 2px 6px rgba(26,82,118,.2)}
.btn-secondary{background:var(--primary-soft);color:var(--primary);border:1.5px solid #ccdce8}
.btn-danger{background:var(--danger);color:#fff;border:none}
.btn-warn{background:var(--warn-soft);color:var(--warn);border:1.5px solid #e8c9a0}

/* ─── 카드 ─── */
/* grid-template-columns:minmax(0,1fr) — 그리드 항목의 최소 크기를 0으로 낮춰 긴 내용(카드·표·모달)이 폰 화면 밖으로 밀려나지 않게 한다(가로 스크롤·설정 탭 잘림·모달 버튼 미노출 동시 해결). 태블릿 렌더링은 동일. */
.stack{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid rgba(225,229,234,.7);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.banner{border-left:4px solid}
.banner-x{position:absolute;top:6px;right:6px;width:32px;min-width:32px;height:32px;min-height:32px;padding:0;border:none;background:transparent;color:var(--muted);font-size:15px;line-height:1;cursor:pointer}
.banner.warn{background:var(--surface-warm);border-left-color:var(--warn)}
.banner.error{background:var(--danger-soft);border-left-color:var(--danger)}
.settings-card{display:grid;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:2px}
/* word-break:keep-all — 한글 단어가 글자 단위로 끊기지 않게(문구 자체는 불변, 줄바꿈 위치만 개선). */
.section-title{font-size:20px;font-weight:800;line-height:1.25;color:var(--text);position:relative;padding-left:12px;word-break:keep-all}
.section-title::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:4px;border-radius:999px;background:var(--accent-bar)}
.section-kicker{font-size:12px;color:var(--muted);font-weight:700;line-height:1.5}
/* ─── 설정 아코디언(beta.27) ───
   설정 화면이 폰에서 7화면을 넘겼다. 자주 쓰는 카드(직원 선금대장 등록·직원 목록 관리)만 펼친 채 두고
   나머지는 접는다. 접힌 카드도 **제목과 한 줄 요약은 항상 보인다** — 무엇이 들어 있는지 모르는 접힘은
   기능을 숨긴 것과 같다(사장님이 [장부 안전 저장]을 영영 못 찾는 길). */
/* display를 두 클래스로 못 박는 이유: 아래 @media(max-width:520px)가 .section-head를 grid로 바꾼다.
   접힘 머리글은 오른쪽 끝의 화살표가 제목과 같은 줄에 있어야 "누르면 열린다"로 읽히므로 flex를 유지한다. */
.section-head.fold-head{display:flex;cursor:pointer;border-radius:10px;padding:4px 2px;margin:-4px -2px;align-items:center;min-height:48px;transition:background .15s}
/* 설정 위계(beta.30): 섹션 헤더(주항목) 20px > 접힘 카드 제목(하위 항목) 17px — 15% 작게 해 소속 관계가 눈에 읽히게 */
.fold-head .section-title{font-size:17px}
.fold-head:active{background:var(--primary-soft)}
.fold-arrow{flex:0 0 auto;font-size:13px;color:var(--muted);line-height:1}
.section-actions{display:grid;gap:8px}
.action-btn{display:flex;gap:10px;align-items:flex-start;text-align:left;justify-content:flex-start;padding:13px 14px;min-height:58px}
.action-btn .action-icon{width:24px;flex:0 0 24px;text-align:center;font-size:17px;line-height:1.25}
.action-btn strong{display:block;font-size:15.5px;line-height:1.35}
.action-btn span{display:block;margin-top:2px;font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.45}
/* 진한 배경(파랑·빨강) 버튼 위에서는 설명·아이콘의 회색(var(--muted))이 거의 안 보인다 → 흰색 계열로 바꾼다. */
.action-btn.btn-primary span,.action-btn.btn-danger span,.action-btn.btn-primary .action-icon,.action-btn.btn-danger .action-icon{color:rgba(255,255,255,.9)}
/* 액션 버튼 안의 배지(신청 건수·⚠️ 아직 안 함)가 상속 폭/색에 눌려 깨지지 않게 한다. */
.action-btn .badge-count{display:inline-block;color:#fff;width:auto}
/* 새 명단 0건일 때의 '쉬는' 상태 — 흐리게만 하고 탭은 막지 않는다(탭하면 서버를 새로 확인). */
.action-btn.btn-idle{opacity:.55;filter:grayscale(.3)}
.inline-form{display:flex;gap:8px;align-items:center}
.inline-form input{min-width:0}
.inline-form button{flex:0 0 auto;min-width:84px}
.quick-add-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.quick-add-form input{flex:1 1 120px;min-width:100px}
.quick-add-form button{flex:0 0 auto;min-width:72px}
/* 소속 추천 칩 줄 — 입력 한 줄 아래에 통째로 깔린다(입력들의 한 줄 배치는 그대로 둔다).
   폰에서 datalist는 자동으로 열리지 않으므로, 등록된 공공기관명은 이렇게 **눈에 보여야** 쓸 수 있다. */
.quick-add-form .quick-add-orgpicks{flex:1 1 100%;display:flex;align-items:flex-start;gap:8px;margin-top:2px}
.quick-add-pickhint{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--muted);padding-top:7px;white-space:nowrap}
.quick-add-form .org-picks{margin-top:0;flex:1 1 auto}
.phone-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.phone-consent{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);min-height:32px;padding:0 6px}
.phone-consent input{width:auto;min-height:auto;margin:0;accent-color:var(--primary)}
.phone-consent.disabled{opacity:.5}
.agency-current{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#fafbfd;border:1px solid var(--line);border-radius:10px}
.agency-current-name{font-size:17px;font-weight:800;color:var(--primary);line-height:1.3}
.dept-tags{line-height:2;max-height:140px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.danger-note{font-size:11px;color:var(--danger);line-height:1.5}
@media (max-width:520px){.section-head{display:grid}.inline-form{display:grid}.inline-form button{width:100%}.agency-current{align-items:flex-start}.action-btn{padding:12px}}

/* ─── 부서 그룹 ─── */
.group{display:grid;gap:8px}
/* 그룹 헤더는 탭하면 펼쳐지는 아코디언 — 폰 손가락 기준 48px 이상을 보장한다. */
.group-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 2px 8px;min-height:48px;border-bottom:1.5px solid #eef1f4;cursor:pointer;border-radius:8px;transition:background .15s}
.group-head:active{background:var(--primary-soft)}
.group-headline{display:flex;align-items:center;gap:8px;min-width:0}
.group-toggle{font-size:11px;color:var(--muted);width:16px;flex:0 0 16px;text-align:center}
.group-title{font-size:18px;font-weight:800;letter-spacing:-.2px;color:var(--primary)}
.group-meta{color:var(--muted);font-size:12px;font-weight:600}
/* 회사 그룹 안의 부서 소제목(하위 카테고리) */
.group-sub{font-size:13px;font-weight:800;color:var(--muted);padding:8px 2px 2px;letter-spacing:-.2px}

/* ─── 직원 카드 ─── */
.employee{display:grid;gap:10px}
.employee-main{cursor:pointer;border-radius:10px;padding:4px;margin:-4px;transition:background .15s}
/* 직원 카드 본문 폭 — 기존 인라인(flex:1;min-width:0)과 동일. CSS로 옮겨야 폰 2행 규칙(아래 미디어쿼리)이 인라인에 막히지 않는다. */
.card.employee .employee-main{flex:1;min-width:0}
.employee-main:active{background:var(--primary-soft)}
.name{font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.2px}
.dept,.meta,.note{color:var(--muted);font-size:12px;line-height:1.5}
.bal{margin-top:0;font-size:24px;font-weight:800;color:var(--primary);letter-spacing:-.5px}
.bal.zero{color:#a0aab4}
.bal.negative{color:var(--danger)}
/* 검색 결과가 딱 1명이면 그룹 헤더 없이 그 한 명만 크게 — 손님 앞에서 타인 정보가 함께 보이지 않는다. */
.card.employee.solo{padding:20px 18px;border:2px solid #ccdce8;box-shadow:var(--shadow-md)}
.card.employee.solo .emp-avatar{flex:0 0 56px;width:56px;height:56px;font-size:26px;border-radius:14px}
.card.employee.solo .name{font-size:26px!important;letter-spacing:-.4px}
.card.employee.solo .dept{font-size:14px!important}
.card.employee.solo .bal{font-size:34px!important}
.card.employee.solo [data-a="use"]{min-height:60px!important;padding:0 26px!important;font-size:18px;font-weight:800}
/* 🧾 버튼은 아이콘만으로는 무엇인지 알 수 없다(현장에서 "이게 뭐냐"는 질문이 가장 잦았다)
   → 아이콘 아래에 작은 글자 라벨을 세로로 붙인다. 가로로 붙이면 폰 2행 레이아웃에서 [사용] 버튼을 밀어낸다. */
.card.employee [data-a="receipt"]{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.05}
.rcpt-label{display:block;font-size:10px;font-weight:800;letter-spacing:-.4px;color:var(--muted)}
.card.employee.solo [data-a="receipt"]{min-height:52px!important}
/* 직원 아바타 배지(장식) */
.emp-avatar{flex:0 0 42px;width:42px;height:42px;border-radius:10px;background:var(--primary-soft);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;line-height:1;letter-spacing:-.3px}
/* 홈 상태 pill(표시 전용) */
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1.35}
.pill-offline{background:#eef1f4;color:var(--muted)}
.pill-relay{background:var(--primary-soft);color:var(--primary)}
/* 📩 새 명단 신청 칩은 "누르는 것"이므로 손가락 크기(52px)와 읽히는 글씨(15px)를 보장한다. */
.pill-alert{background:var(--warn-soft);color:#9c4413;border:1.5px solid #e8c9a0;font-weight:800;min-height:52px;padding:12px 18px;font-size:15px;border-radius:999px}
.pill-alert:active{opacity:.85}
.badge-count{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;vertical-align:middle}
.notice-money{font-size:11.5px;line-height:1.6;color:var(--warn);background:var(--warn-soft);border:1px solid #e8c9a0;border-radius:10px;padding:8px 10px}
/* 홈 퀵액션(보조 버튼) */
.quick-actions{display:flex;gap:8px}
.quick-action{flex:1;min-height:48px;background:#fff;border:1.5px solid var(--line);color:var(--primary);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.quick-action:active{background:var(--primary-soft)}

/* ─── 요약/액션 ─── */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:100px;font-size:16px;font-weight:700}
.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;font-weight:700;padding:14px 16px;background:var(--balance-grad);color:#fff;border:none;border-radius:12px;margin-top:4px;box-shadow:0 6px 18px rgba(23,69,121,.22)}
.summary>div:first-child{opacity:.9}
.summary .v{color:#fff;font-size:22px;letter-spacing:-.3px;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:32px 16px;line-height:1.7;font-size:15px}

/* ─── 거래 이력 ─── */
.list{display:grid;gap:8px}
.txn{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid #f0f2f5}
.txn:last-child{border-bottom:none}
/* 거래 취소 버튼은 위험 동작이므로 넓이·색으로 분명히 구분한다(라벨은 "이 사용 기록 취소"). */
.txn>[data-a="void"]{justify-self:start;min-width:132px;color:var(--danger);border-color:#e8bdb7}
.txn-top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.txn-title{font-size:15px;font-weight:700;line-height:1.4}
.amt{font-size:20px;font-weight:800;white-space:nowrap;letter-spacing:-.3px}
.amt.in{color:var(--success)}
.amt.out{color:var(--danger)}
.amt.adjust{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{padding:3px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:11px}
.thumb{width:80px;height:44px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;transition:border-color .15s}
.thumb:active{border-color:var(--primary)}

/* ─── 직원 관리 행 ─── */
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eef1f4}
.row:last-child{border-bottom:0}
.row .left{flex:1;min-width:0}
.row .right{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.small{min-height:44px;padding:0 10px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:700;border-radius:8px}
/* .small이 .btn-primary 뒤에 와서 배경(흰색)을 덮어 "흰 글씨/흰 배경"이 되는 것을 막는다(같은 특이도 → 나중 규칙 승리). */
.btn-primary.small{background:linear-gradient(135deg,var(--primary),#1e6fa1);border:none;color:#fff}
.hidden-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;background:#eef1f4;color:var(--muted);font-size:11px;font-weight:700;margin-left:4px}

/* ─── 하단 탭 ─── */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;display:flex;background:rgba(255,255,255,.96);border-top:1px solid rgba(225,229,234,.8);box-shadow:0 -2px 8px rgba(15,23,42,.04);z-index:20;padding-bottom:env(safe-area-inset-bottom,0);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav button{flex:1;min-height:58px;border-radius:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:color .15s}
.nav button:active{transform:none;opacity:1}
.nav button.active{color:var(--primary)}
.nav button svg{width:22px;height:22px;stroke-width:2;fill:none;stroke:currentColor}

/* ─── 모달 ─── */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{width:min(100%,640px);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);padding:20px}
.modal h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.modal h2::after{content:"";display:block;width:34px;height:3px;margin-top:8px;border-radius:999px;background:var(--accent-bar)}
.modal[style*="text-align:center"] h2::after{margin-left:auto;margin-right:auto}
.help{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.form{display:grid;gap:12px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{font-size:16px;font-weight:700;background:var(--primary-soft);color:var(--primary);border:1.5px solid #ccdce8}
.receipt{display:grid;gap:6px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fafbfd;margin-bottom:12px}
.receipt-row{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.signature{width:100%;height:180px;display:block;background:#fff;touch-action:none}
/* 서명판. position:relative는 장식이 아니라 계약이다 — 빈 캔버스 안내(.sig-hint)를 **캔버스 위에 겹치는 오버레이**로
   띄우기 위한 기준 상자다. 안내를 캔버스에 그리면(fillText) 그 픽셀이 그대로 toDataURL에 들어가 서명 이미지에
   "여기에 손가락으로 서명해 주세요"가 박힌다 — 원장에 남는 그림이 오염된다. 그래서 안내는 DOM 형제 노드다. */
.sig-box{position:relative;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
/* 빈 캔버스 안내 — 캔버스 백킹 스토어에는 한 픽셀도 닿지 않는다(오버레이).
   pointer-events:none이 두 번째 계약이다: 안내 위를 눌러도 이벤트는 그대로 캔버스로 통과해야 한다
   (여기서 이벤트가 막히면 손님이 안내 글자 위에서 서명을 시작할 때 첫 획이 통째로 사라진다). */
.sig-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#b3bec9;font-size:15px;font-weight:700;letter-spacing:-.3px;text-align:center;padding:0 14px;word-break:keep-all;line-height:1.5}
/* 획이 하나라도 그려지면 사라진다 — 클래스는 initSignPad가 붙였다 뗀다(재렌더 없이). */
.sig-box.signed .sig-hint{display:none}
.namecard{aspect-ratio:1.58/1;min-height:200px;border-radius:18px;background:var(--balance-grad);color:#fff;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-lg);overflow:hidden}
.namecard-shop{font-size:16px;font-weight:800;letter-spacing:-.3px;opacity:.96}
.namecard-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:6px 0}
.namecard-who{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.3;word-break:keep-all}
.receipt-bal{font-size:42px;font-weight:900;letter-spacing:-1.2px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.receipt-bal.neg{color:#ffc2b8}
.receipt-negnote{font-size:14px;font-weight:800;margin-top:6px;color:#ffd7cf}
.receipt-warn{font-size:14px;font-weight:700;line-height:1.55;text-align:center;color:#fff;background:rgba(192,57,43,.6);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:12px 14px}
.namecard-foot{display:flex;flex-direction:column;gap:3px}
.namecard-date{font-size:12px;font-weight:700;opacity:.92}
.namecard-note{font-size:11px;font-weight:600;opacity:.85;letter-spacing:-.2px;word-break:keep-all}
/* 증표 안내 한 줄 — 명함(카드) **바깥**이다. 카드 안에 넣으면 손님에게 보여주는 그 그림이 지저분해지고,
   사진으로 남긴 증표에도 앱 사용법이 함께 찍힌다. 닫기 버튼 근처에 작은 글씨로만 둔다. */
.receipt-tip{margin-top:12px;font-size:12.5px;line-height:1.6;color:var(--muted);text-align:center;word-break:keep-all}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal-actions button{flex:1;font-size:16px;font-weight:700}

/* ─── 토스트/로딩 ─── */
/* 토스트는 화면 위(주소창·상태 pill)와 겹치지 않게 하단 내비 위로 띄운다. */
.toast{position:fixed;left:50%;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 20px;border-radius:14px;background:rgba(27,40,56,.9);color:#fff;box-shadow:var(--shadow-lg);z-index:60;text-align:center;line-height:1.4;font-size:14px;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.65);z-index:70;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.busy>div{background:#fff;padding:24px 36px;border-radius:18px;box-shadow:var(--shadow-lg);font-size:16px;font-weight:700;text-align:center}

/* ─── CSV 미리보기 ─── */
.csv-preview{max-height:280px;overflow-y:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px}
.csv-table{width:100%;border-collapse:collapse;font-size:12px}
.csv-table th{background:var(--primary);color:#fff;padding:8px 10px;text-align:left;position:sticky;top:0;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.csv-table td{padding:7px 10px;border-bottom:1px solid #eef1f4}
.csv-table tr.err{background:var(--danger-soft)}
.csv-table tr.err td{color:var(--danger)}

/* ─── 부서 태그/선택 ─── */
.dept-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:600;margin:3px}
.dept-tag button{background:none;border:none;color:var(--danger);font-size:15px;min-height:auto;padding:0 2px;cursor:pointer;border-radius:0}
.dept-picks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;max-height:130px;overflow-y:auto}
.dept-pick{padding:5px 11px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.dept-pick.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.dept-pick:active{transform:scale(.95)}
.agency-tools{display:grid;gap:8px;margin-top:8px}
.agency-actions{display:flex;gap:8px;flex-wrap:wrap}
.agency-actions button{min-height:38px;font-size:12px;font-weight:700;flex:1}
.dept-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:6px;max-height:220px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fafbfd}
.dept-check{display:flex;gap:6px;align-items:center;min-height:44px;padding:5px 7px;border-radius:8px;background:#fff;font-size:13px;font-weight:700;color:var(--text);border:1px solid #eef1f4}
/* 체크박스는 손가락으로 정확히 누를 수 있는 크기로(기본 13px → 22px). */
.dept-check input{width:22px;height:22px;min-height:auto;margin:0;accent-color:var(--primary)}

/* ─── 직원 관리 아코디언 ─── */
.mgr-group{border-bottom:1px solid #eef1f4}
.mgr-group:last-child{border-bottom:none}
.mgr-head{display:flex;align-items:center;gap:8px;padding:11px 4px;cursor:pointer;font-weight:700;border-radius:8px;transition:background .15s}
.mgr-head:active{background:var(--bg)}
.mgr-toggle{font-size:10px;color:var(--muted);width:16px;text-align:center;flex-shrink:0}
.mgr-dept{font-size:14px;flex:1}
.mgr-count{font-size:12px;color:var(--muted);font-weight:600}
.mgr-body{padding:0 0 4px 20px}
/* 직원 목록 관리 카드 상단 요약(홈 하단에서 이 자리로 옮긴 "활성 직원 N명 · 잔액 합계") */
.mgr-summary{margin-top:0;font-size:14px;padding:12px 14px;box-shadow:0 4px 12px rgba(23,69,121,.16)}
.mgr-summary .v{font-size:19px}

/* ─── PIN 화면 ─── */
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(160deg,#f0f2f5 0%,#e6eaf0 100%)}
.pin-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#2874a6);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 4px 12px rgba(26,82,118,.25)}
.pin-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2}
.pin-title{font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text);letter-spacing:-.3px}
.pin-sub{font-size:13px;color:var(--muted);margin-bottom:28px;text-align:center;line-height:1.5}
/* "사장님 확인"(손님 인계) 화면의 대상 표시 — 긴 부서명·긴 이름에서도 화면 밖으로 나가지 않게 폭을 묶는다 */
.pin-ho{display:block;max-width:300px;margin:0 auto;font-size:15px;color:var(--text);word-break:keep-all;overflow-wrap:anywhere}
.pin-ho b{font-size:18px;font-weight:800}
.pin-ho-label{display:inline-block;margin-top:2px;font-size:12px;color:var(--muted)}
.pin-dots{display:flex;gap:14px;margin-bottom:32px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #c8ced6;background:#fff;transition:all .2s}
.pin-dot.filled{background:var(--primary);border-color:var(--primary);transform:scale(1.15)}
.pin-dot.error{background:var(--danger);border-color:var(--danger);animation:shake .3s}
.pin-pad{display:grid;grid-template-columns:repeat(3,68px);gap:10px;justify-content:center}
.pin-key{width:68px;height:68px;border-radius:50%;background:#fff;border:1px solid #dce0e6;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;min-height:auto;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .1s}
.pin-key:active{background:var(--primary-soft);border-color:var(--primary);transform:scale(.93)}
.pin-key.fn{background:transparent;border:none;font-size:14px;color:var(--muted);font-weight:600;box-shadow:none}
.pin-key.fn:active{background:var(--bg);transform:scale(.95)}
.pin-msg{margin-top:18px;font-size:13px;color:var(--danger);text-align:center;min-height:20px;font-weight:600}
.pin-reset{margin-top:20px;text-align:center}
.pin-reset button{min-height:auto;padding:8px 16px;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px}
.pin-delay{margin-top:16px;text-align:center;font-size:13px;font-weight:700;color:var(--danger);line-height:1.6;max-width:320px}
.pin-key[disabled]{opacity:.4}
/* ─── 잠금 화면 = 손님 화면 ─── */
/* 손님이 직접 만지는 유일한 화면이다. 여기서는 어떤 원장 쓰기도 일어나지 않는다(요청만 만들 수 있다). */
.cust-screen{display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;padding:22px 16px 28px;background:linear-gradient(160deg,#f0f2f5 0%,#e6eaf0 100%)}
.cust-head{text-align:center;margin-bottom:16px;width:100%;max-width:420px}
.cust-shop{font-size:15px;font-weight:800;color:var(--primary);letter-spacing:-.3px;word-break:keep-all}
.cust-title{font-size:24px;font-weight:900;letter-spacing:-.6px;margin-top:4px;color:var(--text);word-break:keep-all}
.cust-body{width:100%;max-width:420px;flex:1}
.cust-search{position:relative;display:flex;align-items:center}
.cust-search input{min-height:60px;font-size:19px;font-weight:700;padding:0 46px 0 16px;border-radius:14px;border:2px solid var(--primary);background:#fff;width:100%}
.cust-clear{position:absolute;right:6px;width:40px;min-width:40px;height:44px;min-height:44px;padding:0;border:none;background:none;color:var(--muted);font-size:18px}
.cust-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;word-break:keep-all}
.cust-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.cust-row{display:block;width:100%;text-align:left;min-height:64px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cust-row-label{font-size:12px;font-weight:700;color:var(--muted);line-height:1.4;word-break:keep-all}
.cust-row-name{font-size:21px;font-weight:800;letter-spacing:-.4px;color:var(--text);line-height:1.3;word-break:keep-all}
.cust-row.dup{background:#f7f8fa;border-style:dashed}
.cust-row.dup .cust-row-name{color:var(--muted)}
.cust-card{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:20px 18px;box-shadow:var(--shadow-lg);text-align:center}
.cust-ask{font-size:16px;font-weight:700;color:var(--muted);margin-bottom:12px}
.cust-label{font-size:14px;font-weight:700;color:var(--muted);line-height:1.5;word-break:keep-all}
.cust-name{font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:4px;line-height:1.25;word-break:keep-all}
.cust-bal{font-size:40px;font-weight:900;letter-spacing:-1.2px;color:var(--primary);margin:16px 0 4px;line-height:1.1}
.cust-warn{margin:16px 0;padding:12px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:15px;font-weight:700;line-height:1.6;word-break:keep-all}
.cust-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.cust-actions button{min-height:56px;font-size:17px;font-weight:800;border-radius:14px}
/* 요청 작성(금액·서명) — 손님이 직접 만지는 화면이라 숫자는 크게, 버튼은 넉넉하게.
   beta.44: 금액 안내는 '잔액 N원이 남아있어요' 한 줄뿐이다. 예전의 작은 회색 보조문(14px)이 아니라
   **이 화면에서 가장 큰 글자**다 — 손님이 읽어야 하는 유일한 숫자가 여기 있기 때문이다. */
.cust-req-bal{margin-top:14px;font-size:28px;font-weight:900;letter-spacing:-.7px;color:var(--primary);line-height:1.3;word-break:keep-all}
/* 오류 한 줄의 자리는 **항상** 잡혀 있다 — 뜨든 안 뜨든 아래 배치가 움직이지 않는다(min-height ≥ 한 줄).
   14px × line-height 1.5 = 21px이므로 22px. 이 값이 한 줄보다 작으면 오류가 뜰 때 화면이 밀린다(beta.24의 L4). */
.cust-req-err{min-height:22px;margin-top:8px;font-size:14px;font-weight:800;color:var(--danger);line-height:1.5;word-break:keep-all}
.cust-req-quick{margin-top:6px}
.cust-req-quick button{min-height:56px;font-size:17px}
.cust-req-field{margin-top:12px;text-align:left}
.cust-req-field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.cust-req-field input{min-height:60px;font-size:22px;font-weight:800;text-align:center;border-radius:14px;border:2px solid var(--primary);background:#fff;width:100%;padding:0 12px}
/* 통합 요청 화면(beta.22)의 서명 구획 제목 — 금액 칸과 캔버스 사이의 경계선 역할을 한다.
   beta.44: 문구가 "서명하고 다음에 무엇을 누르는지"까지 말한다(어르신 손님이 서명만 하고 멈추던 자리).
   두 줄짜리 안내라 line-height를 고정해 폰 세로 예산을 예측 가능하게 둔다. */
.cust-sign-title{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:17px;font-weight:800;line-height:1.35;color:var(--text);word-break:keep-all}
.cust-sig{margin-top:10px}
/* 통합 화면은 세로로 길다 — 카드가 뷰포트를 넘으면 화면 자체가 세로로 스크롤된다(가로는 절대 넘지 않는다). */
.cust-screen{overflow-x:hidden}
/* "사장님 확인" 화면의 요청 내용 — 금액이 화면에서 가장 크다(사장님이 눈으로 검증하는 대상). */
.pin-req{margin:-14px 0 20px;padding:10px 14px;border-radius:14px;background:#fff;border:1.5px solid var(--line);max-width:300px;width:100%;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pin-req-label{font-size:12px;font-weight:800;color:var(--muted)}
.pin-req-amt{font-size:34px;font-weight:900;letter-spacing:-1.2px;color:var(--primary);line-height:1.15;margin-top:2px;word-break:keep-all}
.pin-req-sign{margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.pin-req-sign img{display:block;width:100%;height:56px;object-fit:contain}
.pin-req-note{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.5;word-break:keep-all}
/* 사용 모달: 손님이 미리 한 서명 썸네일 */
.sig-pre img{display:block;width:100%;height:120px;object-fit:contain;background:#fff}
.receipt-row.req strong{line-height:1.2}
.cust-tx-title{margin-top:18px;padding-top:14px;border-top:1.5px solid #eef1f4;font-size:13px;font-weight:800;color:var(--muted);text-align:left}
.cust-txs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cust-tx{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;background:#fafbfd;border:1px solid var(--line)}
.cust-tx.voided{opacity:.55}
.cust-tx-label{font-size:14px;font-weight:800}
.cust-tx-date{font-size:11px;color:var(--muted);font-weight:600}
.cust-tx-right{text-align:right;flex-shrink:0}
.cust-tx-amt{font-size:16px;font-weight:800;white-space:nowrap}
.cust-tx-amt.out{color:var(--danger)}
.cust-tx-amt.in{color:var(--primary)}
.cust-chip{display:inline-block;font-size:10px;font-weight:700;color:var(--muted);background:#eef1f4;border-radius:6px;padding:2px 6px;margin-left:4px}
.cust-chip.void{background:var(--danger-soft);color:var(--danger)}
.cust-foot{margin-top:22px;text-align:center}
.cust-foot button{min-height:auto;padding:8px 16px;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px}
/* ─── beta.24: 요청 작성 화면의 보조 링크 두 개 ─────────────────────────────
   [최근 사용 내역 보기] = 선택적 상세 화면(잔액·최근 5건)으로. 조회만 하러 온 손님의 길.
   [금액을 모르겠어요 / 사장님 부르기] = A단계 인계. 잔액 초과·단체 식사처럼 손님이 금액을 정할 수
   없는 자리의 탈출구다 — 이 링크가 없으면 그 손님은 요청 화면에서 막힌다.
   ⚠️ '작은 링크'라도 손가락 표적은 48px 이상이다(어르신 손님). 그래서 두 줄짜리 버튼 2개를 한 줄에 둔다. */
.cust-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cust-links button{min-height:48px;padding:6px 8px;border-radius:12px;border:1.5px solid var(--line);background:#f5f8fc;color:var(--primary);font-size:13px;font-weight:700;line-height:1.35;word-break:keep-all}
/* 상세 화면의 한 줄 안내 — "돌아가면 서명만 다시" (왕복 보존 계약을 손님에게 말로 알리는 자리).
   ⚠️ beta.25에서 **한 줄로 압축**했다 — beta.24의 두 줄짜리 문구가 상세 화면에 세로 72px를 더해
   버튼 줄을 통째로 접힘 아래로 밀어냈다(360×640 실측). 안내는 남기되 줄 수를 늘리지 않는다. */
.cust-draft-note{margin-top:10px;font-size:13px;color:var(--text);background:#fff8e6;border:1px solid #f0e0b0;border-radius:10px;padding:7px 10px;line-height:1.4;word-break:keep-all}
/* ─── beta.25: 상세(최근 내역) 화면도 "폰 세로 한 화면"에 담는다 ────────────────────
   beta.24 실측(거래 5건, 360×640·390×664): [사용 요청 계속하기]·[사장님 부르기]·[처음으로] 셋 다
   초기 뷰포트 밖(682~866px)이었다. 412×732에서도 둘이 밖이었다. 초안(금액)을 들고 잠깐 내역을
   보러 온 손님에게 **작성 화면으로 돌아갈 유일한 길이 보이지 않는다** — 어르신 손님은 그 자리에서 멈춘다.
   → 화면 높이를 뷰포트로 못 박고, 늘어나는 것은 **최근 내역 목록 하나뿐**으로 만든다(목록 내부 스크롤).
     5건이 다 보이지 않아도 된다(스크롤로 닿는다). 버튼 줄은 어떤 뷰포트에서도 반드시 화면 안이다.
   ⚠️ 여기도 전부 CSS다 — 정보를 지우거나 DOM을 재배치하지 않는다. */
.cust-screen.cust-detail{height:100vh;height:100svh;min-height:0;overflow-y:auto}
.cust-detail .cust-body{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.cust-detail .cust-card{display:flex;flex-direction:column;min-height:0}
/* 목록만 줄어든다(min-height는 "적어도 한 줄은 보인다"의 보장선). 나머지 조각은 절대 찌그러지지 않는다. */
.cust-detail .cust-txs{flex:1 1 auto;min-height:52px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cust-detail .cust-tx{flex-shrink:0}
.cust-detail .cust-label,.cust-detail .cust-name,.cust-detail .cust-bal,.cust-detail .cust-warn,.cust-detail .cust-photo-tip,.cust-detail .cust-tx-title,.cust-detail .cust-draft-note,.cust-detail .cust-actions{flex-shrink:0}
/* 사진 안내 한 줄 — 잔액 바로 아래. 이 화면은 세로 예산이 빠듯하므로(버튼 3개가 초기 뷰포트 안에 있어야 한다)
   높이를 먹는 쪽은 오직 .cust-txs(스크롤 영역)여야 한다. 그래서 이 줄은 flex-shrink:0 + **한 줄** 고정이다. */
.cust-photo-tip{font-size:12px;line-height:1.5;color:var(--muted);margin:2px 0 0;word-break:keep-all}
/* ─── beta.23: 손님 통합 요청 화면을 "폰 세로 한 화면"에 담는다 ────────────────────
   beta.22에서 금액 화면과 서명 화면을 하나로 합치면서 카드가 세로 1070px까지 자랐다.
   실측(iPhone 13, 가시 높이 664px): 서명판은 180px 중 107px만 보이고 [사장님 확인 받기]는
   화면 밖 174px 아래, [지우고 다시]·[뒤로]는 그보다 더 아래였다. 어르신 손님은 "아래로 밀어
   버튼을 찾는" 조작을 하지 않는다 — 그 자리에서 멈춘다(현장에서 곧바로 막히는 결함이다).
   → 폰(≤767px)에서만 세로를 압축한다. **정보는 하나도 지우지 않는다**:
     이름·소속, 잔액 한 줄, 빠른 금액·입력칸, 서명판, 버튼 3개가 전부 그대로 있고
     크기·여백만 줄어든다. 태블릿(≥768px)은 반대로 서명판을 더 크게 준다(전용 태블릿 비치가 권장 구성).
   ⚠️ 여기는 전부 CSS다 — 캔버스 노드를 만들거나 갈아치우지 않는다(3중 보호 계약 불변). */
.cust-who{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:2px 8px}
.cust-who .cust-name{margin-top:0}
/* 서명판 높이는 뷰포트 세로에 비례한다 — 세로가 짧은 기기에서 캔버스가 화면을 독차지하지 않게.
   최소 120px는 보장한다(그 아래로는 손가락으로 이름을 쓸 수 없다). 회전하면 값이 바뀌므로
   백킹 스토어 재설정이 반드시 따라와야 한다(initSignPad의 resize — 획을 보존한 채 다시 그린다). */
/* svh(작은 뷰포트 높이)를 쓰는 이유: dvh는 주소창이 접혔다 펴질 때마다 값이 변한다 → 손님이 서명하는
   도중에 캔버스 높이가 바뀌어 그림이 다시 그려진다(보존은 되지만 눈앞에서 출렁인다).
   svh는 "주소창이 다 보이는 최악의 경우" 높이라 스크롤 중에도 변하지 않고, 그 최악의 경우에도 화면에 들어온다.
   첫 줄 150px는 svh를 모르는 옛 브라우저용 대비값이다(둘째 선언 전체가 무시된다). */
/* beta.25: 20svh → 18svh. 세로가 짧은 폰에서 오류 줄이 떴을 때의 여유를 벌기 위한 값이다
   (360×640에서 128→120px). 최소 보장선 120px은 그대로다 — 그 아래로는 손가락 서명이 성립하지 않는다. */
.cust-sig .signature{height:150px;height:clamp(120px,18svh,170px)}
@media(min-width:768px){.cust-sig .signature{height:210px}}
/* 버튼 3개 — [사장님 확인 받기]는 한 줄 전체(가장 큰 표적), 보조 2개는 나란히.
   beta.24에서 이 배치를 **모든 폭**으로 넓혔다: 태블릿에서도 세로 3단 쌓기는 보조 링크 한 줄이 들어갈
   자리를 통째로 잡아먹어 [금액을 모르겠어요]가 첫 화면 밖으로 밀려났다(768×1024 실측). */
.cust-req-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cust-req-actions button:first-child{grid-column:1/-1}
@media(max-width:767px){
.cust-screen{padding:10px 14px 16px}
.cust-screen.cust-compose .cust-head{margin-bottom:4px}
.cust-screen.cust-compose .cust-title{display:none}
.cust-screen.cust-compose .cust-card{padding:10px}
.cust-compose .cust-who{gap:0 8px}
.cust-compose .cust-who .cust-label{font-size:13px;line-height:1.4}
.cust-compose .cust-who .cust-name{font-size:22px;letter-spacing:-.5px}
/* 잔액 한 줄·입력 글자는 크게 남긴다 — 손님이 읽어야 하는 숫자와 자기가 넣은 숫자, 둘뿐이다.
   되찾은 세로는 전부 '여백'에서만 걷었다(L4). */
.cust-compose .cust-req-bal{margin-top:4px;font-size:24px;letter-spacing:-.5px}
/* ── beta.25(L4): 오류 줄 자리를 **미리 확보**한다 — 레이아웃 이동 0 ──────────────
   beta.24에서는 오류가 뜰 때만 줄이 생겨(한 줄 23px) 화면 전체가 아래로 밀렸다. 그 결과
   "잔액보다 많아요"가 뜨는 순간 여유가 15px까지(둘 다 뜨면 -7px, 즉 접힘 아래) 떨어졌다 —
   손님이 오류를 읽는 바로 그 순간에 [사장님 확인 받기]가 손가락 밑에서 움직이거나 사라진다.
   → 두 오류 줄(#custAmtErr·#custSignErr) 모두 항상 한 줄 높이를 차지한다. 뜨든 안 뜨든 배치가 같다.
   그 원가(약 46px)는 아래 여백들을 고루 깎아 되돌려 받았다(정보는 하나도 지우지 않는다). */
.cust-compose .cust-req-err{min-height:19px;margin-top:2px;font-size:13px;line-height:1.4}
.cust-compose .cust-req-quick{margin-top:4px}
.cust-compose .cust-req-quick button{min-height:48px;font-size:16px}
.cust-compose .cust-req-field{margin-top:6px}
/* 라벨은 "시각적으로만" 숨긴다 — 폰에서는 잔액 한 줄과 입력칸 사이가 빠듯해 글자가 서로 겹친다.
   DOM에서 지우지는 않는다(for/aria 연결 유지 → 스크린리더에는 그대로 읽힌다). */
.cust-compose .cust-req-field label{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.cust-compose .cust-req-field input{min-height:52px;font-size:24px}
.cust-compose .cust-sign-title{margin-top:2px;padding-top:3px;font-size:15px}
.cust-compose .cust-sig{margin-top:1px}
.cust-req-actions{gap:6px;margin-top:6px}
.cust-req-actions button{min-height:48px;font-size:16px}
/* ── beta.24에서 되찾은 세로(보조 링크 한 줄 = 48+6px의 원가) ─────────────────
   버튼 높이 52→48(8px), 서명 구획 여백(4px), 카드·머리 여백(4px)에서 나눠 걷었고,
   beta.44에서 금액 네 조각이 한 줄로 합쳐지며 약 20px을 더 돌려받았다(서명 안내 두 줄의 원가). */
.cust-compose .cust-links{margin-top:6px}
.cust-compose .cust-links button{font-size:12px;padding:5px 6px}
/* ── beta.25: 상세(최근 내역) 화면의 폰 압축 — 버튼 줄을 화면 안으로 되돌린 나머지 절반 ── */
.cust-screen.cust-detail .cust-head{margin-bottom:4px}
.cust-screen.cust-detail .cust-title{display:none}
.cust-screen.cust-detail .cust-card{padding:12px}
.cust-detail .cust-label{font-size:13px;line-height:1.4}
.cust-detail .cust-name{font-size:24px}
.cust-detail .cust-bal{font-size:34px;margin:8px 0 2px}
.cust-detail .cust-tx-title{margin-top:10px;padding-top:8px}
.cust-detail .cust-txs{margin-top:6px}
.cust-detail .cust-draft-note{margin-top:8px;padding:6px 9px;font-size:12px}
.cust-detail .cust-actions{margin-top:10px;gap:6px}
.cust-detail .cust-actions button{min-height:48px;font-size:16px}
.cust-detail .cust-foot{margin-top:10px}
}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
/* 폰: 빠른 금액은 3개를 한 줄에(세로로 길게 늘어져 스크롤되는 것 방지).
   모달 버튼은 column-reverse — 마지막에 오는 [저장]이 맨 위(엄지 근처)로 온다. 순서만 바뀌고 DOM/문구는 불변.
   beta.44: 사용 등록 모달의 DOM 순서가 [… 취소 · 서명 다시 받기 · 저장]이라 화면에서는 저장 → 서명 다시 받기 → 취소다. */
@media(max-width:640px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}.actions button,.modal-actions button{min-width:100%}.modal-actions{flex-direction:column-reverse}.summary,.txn-top,.receipt-row,.row,.group-head{display:grid}.group-head{min-height:56px;gap:2px}.tool{width:100%}.tool button{flex:1}.tool .handoff{flex:1 1 100%;min-height:44px}}
/* ─── 폰(≤640px) 직원 카드 2행 구성 ───
   1행: 아바타 + 이름/부서(줄바꿈 허용 — 이름은 절대 자르지 않는다)
   2행: 잔액(전액 표기 — 금전 원장이므로 축약 금지) + 증표 + 사용 버튼
   !important는 empCard()의 인라인 style(white-space:nowrap / font-size)을 이기기 위한 CSS-only 경로다. */
@media(max-width:640px){
  .card.employee{flex-wrap:wrap;row-gap:10px}
  .card.employee .employee-main{flex:1 1 calc(100% - 54px);order:1;min-width:0}
  .card.employee .name{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;word-break:keep-all;overflow-wrap:anywhere}
  .card.employee .dept{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;word-break:keep-all;overflow-wrap:anywhere}
  .card.employee .emp-avatar{order:0}
  .card.employee .bal{order:2;flex:1 1 auto;font-size:22px!important}
  .card.employee [data-a="receipt"]{order:3}
  .card.employee [data-a="use"]{order:4;min-height:48px}
}

/* ─── 초기 설정 ─── */
.setup{max-width:900px;margin:0 auto;padding:24px 16px 40px}
.setup-head{text-align:center;margin-bottom:24px}
.setup-head h1{font-size:22px;font-weight:800;margin:0 0 4px;background:linear-gradient(135deg,var(--primary),#2874a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;word-break:keep-all}
.setup-head p{color:var(--muted);font-size:13px;margin:0;line-height:1.6}
.setup-step{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;margin-bottom:12px}
.setup-selected{border:2px solid var(--primary);background:var(--primary-soft);border-radius:12px;padding:14px}
/* ─── 첫 실행 환영 화면(0단계, beta.27) ───
   단계 번호(1/3·2/3·3/3)에는 **포함하지 않는다** — 번호를 4단계로 늘리면 "할 일이 더 늘었다"로 읽힌다.
   이 화면은 세는 단계가 아니라 인사다. */
.setup-welcome{max-width:460px;margin:0 auto;text-align:center}
.setup-welcome-logo{font-size:46px;line-height:1;margin-bottom:10px}
.setup-welcome-lines{display:grid;gap:8px;font-size:15px;line-height:1.65;color:var(--text);word-break:keep-all;text-align:left}
.setup-welcome-safe{margin-top:14px;border:1.5px solid #e8c9a0;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:700;line-height:1.65;word-break:keep-all;text-align:left}
.setup-welcome-free{margin-top:12px;font-size:13px;font-weight:800;color:var(--success)}
</style>

<div id="app"></div>
<input id="restoreFile" type="file" accept="application/json,.json" hidden>
<input id="csvFile" type="file" accept=".csv,.txt" hidden>
<input id="directTransferFile" type="file" accept="application/json,.json" hidden>
<script>
(()=>{
'use strict';
const APP='선입금대장',APP_VERSION='1.0.0-beta.46',DB='prepaid-ledger-db',VER=3,LOCAL='prepaid-ledger-local',now=()=>Date.now(),qs=i=>document.getElementById(i);
// 네이버 지도 검색 딥링크(참고·안내용) — 상호+주소 앞 3토큰(시도·시군구·도로명)으로 검색을 좁힌다.
// 스킴·호스트 고정 + encodeURIComponent 값 인코딩이라 상호에 어떤 문자가 와도 링크 주입이 안 된다.

function bufToB64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function b64ToBuf(b64){const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function randBytes(n){const u=new Uint8Array(n);crypto.getRandomValues(u);return u}
async function deriveAesKey(passphrase,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(passphrase)),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aesEncryptStr(plaintext,passphrase){const salt=randBytes(16),iv=randBytes(12),key=await deriveAesKey(passphrase,salt),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(String(plaintext)));return JSON.stringify({v:1,salt:bufToB64(salt),iv:bufToB64(iv),ct:bufToB64(ct)})}
async function aesDecryptStr(bundleStr,passphrase){const o=JSON.parse(bundleStr),salt=new Uint8Array(b64ToBuf(o.salt)),iv=new Uint8Array(b64ToBuf(o.iv)),key=await deriveAesKey(passphrase,salt),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,b64ToBuf(o.ct));return new TextDecoder().decode(pt)}
// ── 화면 잠금 PIN 저장 (PBKDF2-HMAC-SHA256) ──────────────────────────────────
// 예전 형식: pinHash = SHA-256(pin), 솔트 없음. 4자리 PIN 10,000개의 SHA-256은 미리 계산해 두면
//   표 조회 한 번이라 기기를 손에 넣은 사람에게는 사실상 평문이었다. 이제 기기별 랜덤 솔트 +
//   60만 회 반복으로 저장한다(솔트가 있으므로 무지개표·기기 간 대조가 통하지 않는다).
// ⚠️ 정직한 한계: 4자리 PIN은 후보가 1만 개뿐이라, 저장소를 통째로 훔친 오프라인 공격자에게는
//   반복 횟수를 늘려도 몇 초~몇 분 수준이다. PIN은 **화면 잠금**이지 암호화가 아니다
//   (장부 본문은 이 값으로 암호화되지 않는다). 이 사실을 설정 화면 문구로도 밝힌다.
const PIN_KDF_ITER=600000;
// 저장 형식은 **자기서술적**이다: `pbkdf2$<반복수>$<솔트b64>$<해시hex>`.
//   알고리즘·솔트를 별도 meta 키로 두면, 어느 한쪽만 남거나 덮어써졌을 때(백업 복원·시드 주입)
//   "새 형식 표식은 있는데 솔트는 옛것"인 상태가 생겨 정상 PIN이 영영 안 맞는다. 한 문자열에 담는다.
//   64자리 hex만 있는 값은 구 형식(무솔트 SHA-256)으로 읽는다.
function pinIsLegacy(v){return /^[0-9a-f]{64}$/.test(str(v))}
async function derivePinHash(pin,saltB64,iter){
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pin)),'PBKDF2',false,['deriveBits']);
const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(b64ToBuf(saltB64)),iterations:num(iter)||PIN_KDF_ITER,hash:'SHA-256'},base,256);
return hexOf(bits)}
async function savePinHash(pin){const salt=bufToB64(randBytes(16));
const pinHash='pbkdf2$'+PIN_KDF_ITER+'$'+salt+'$'+await derivePinHash(pin,salt,PIN_KDF_ITER);
state.data.meta.pinHash=pinHash;await repo.apply({meta:{pinHash}});return pinHash}
// 입력 PIN 검증. 구 형식은 검증에 성공한 그 순간에만 원문을 알 수 있으므로 바로 새 형식으로 재저장한다
//   (사용자는 아무것도 하지 않는다 — 다음 잠금 해제부터 솔트가 붙는다).
async function verifyPin(pin){const stored=str(state.data.meta.pinHash);if(!stored)return false;
if(pinIsLegacy(stored)){if(!timingSafeEq(await hash(pin),stored))return false;
try{await savePinHash(pin)}catch(e){console.error('pin rehash',e)}return true}
const p=stored.split('$');
if(p.length!==4||p[0]!=='pbkdf2')return false;
try{return timingSafeEq(await derivePinHash(pin,p[2],p[1]),p[3])}catch(e){console.error('pin verify',e);return false}}
async function genKeyPair(){return crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt'])}
async function wrapPrivateKey(priv,passphrase){const pkcs8=bufToB64(await crypto.subtle.exportKey('pkcs8',priv));return aesEncryptStr(pkcs8,passphrase)}
// extractable=false 가 기본이다 — 이렇게 임포트한 키는 exportKey로 다시 꺼낼 수 없어,
//   XSS가 개인키 **바이트**를 훔쳐 서버로 보내는 길이 막힌다(복호화 자체는 그대로 된다).
//   진짜로 바이트가 필요한 곳은 '내 열쇠 백업' 만들기/불러오기 둘뿐이라 거기서만 true를 넘긴다.
async function unwrapPrivateKey(bundleStr,passphrase,extractable){const pkcs8=await aesDecryptStr(bundleStr,passphrase);return crypto.subtle.importKey('pkcs8',b64ToBuf(pkcs8),{name:'RSA-OAEP',hash:'SHA-256'},!!extractable,['decrypt'])}
// ── 우리 가게 '열쇠 지문' ─────────────────────────────────────────────────────
// 공개키 SPKI 원문의 SHA-256 앞 4바이트를 대문자 8자로 읽고 4자씩 끊는다(ABCD-EF12).
// 쓰임: 공공기관 담당자가 전화로 물어보고 화면의 값과 맞춰 본다 → 다른 사람이 우리 가게 이름으로
//   먼저 등록해 버리는 '선점'을 사람이 확인하는 절차. 앱만으로는 막을 수 없는 종류의 공격이라,
//   서버가 아니라 **전화 한 통**을 확인 수단으로 쓴다.
async function keyFingerprint(pubB64){if(!str(pubB64)||!cryptoOk())return '';
try{const h=await crypto.subtle.digest('SHA-256',b64ToBuf(pubB64));const hex=hexOf(h).slice(0,8).toUpperCase();return hex.slice(0,4)+'-'+hex.slice(4,8)}catch(e){console.error('key fingerprint',e);return ''}}
let __fpFor='';
async function refreshKeyFingerprint(){const pk=str(state.data.meta.pubKey);
if(!pk){__fpFor='';state.keyFingerprint='';return}
if(__fpFor===pk)return;
const fp=await keyFingerprint(pk);__fpFor=pk;state.keyFingerprint=fp;
if(state.loaded&&!renderIsDisruptive())render()}
async function ensureKeyPair(){if(!cryptoOk())return;const m=state.data.meta;let secret=m.deviceSecret;if(!secret)secret=bufToB64(randBytes(32));if(m.pubKey&&m.privKeyWrapped&&m.deviceSecret){refreshKeyFingerprint();return}const kp=await genKeyPair(),pubKey=bufToB64(await crypto.subtle.exportKey('spki',kp.publicKey)),privKeyWrapped=await wrapPrivateKey(kp.privateKey,secret),keyCreatedAt=now();await repo.apply({meta:{deviceSecret:secret,pubKey,privKeyWrapped,keyCreatedAt}});m.deviceSecret=secret;m.pubKey=pubKey;m.privKeyWrapped=privKeyWrapped;m.keyCreatedAt=keyCreatedAt;refreshKeyFingerprint()}
async function getPrivateKey(extractable){const m=state.data.meta;if(!m.privKeyWrapped||!m.deviceSecret)return null;try{return await unwrapPrivateKey(m.privKeyWrapped,m.deviceSecret,!!extractable)}catch(e){console.error('privkey unwrap',e);return null}}
// ── deviceSecret(개인키 언랩 키 + 전화번호 복호 키)을 PIN으로 감싸지 않는 이유 (2026-08 검토) ──
// 검토했고, **하지 않기로** 했다. 근거:
//  ① 이 앱의 PIN은 4자리다(후보 1만 개). PBKDF2 60만 회를 얹어도 저장소를 통째로 가져간 공격자에게는
//     전수탐색이 GPU 기준 수 초다 — 즉 "감쌌다"는 표시만 남고 실제 방어력은 거의 늘지 않는다.
//  ② 대신 잃는 것이 크다. PIN 분실 복구(백업 파일로 복구 → 새 PIN 설정) 경로에서 옛 PIN을 모르면
//     deviceSecret을 풀 수 없으므로 **가게 열쇠와 저장된 전화번호가 함께 영구 소실**된다.
//     지금은 그 경로에서도 열쇠·전화번호가 살아남는다(META_DEVICE_KEYS 보존).
//  ③ 손님 화면(잠금 상태)에서도 앱은 계속 돌아야 하는데, 키를 메모리에만 두면 자동 잠금 → 백그라운드
//     복귀 때마다 PIN을 다시 받아야 한다(하루 수십 번 쓰는 가게 폰에서 현실적이지 않다).
// 그래서 실제로 값이 있는 조치만 넣었다: 잠금 중에는 개인키를 쓰는 경로를 전면 금지하고(relayBackupSilent·
//   maybeMonthlyAutoBackup), 개인키는 extractable:false로 임포트하며, 설정 화면에서 "PIN은 화면 잠금이지
//   장부 암호화가 아니다"라고 정직하게 밝힌다. 기기 자체의 방어는 OS 잠금(지문·패턴)에 맡긴다.
// 다음 라운드 후보: WebAuthn PRF가 있는 기기에서만 그 확장으로 KEK를 파생해 결속(폴백 없이, 옵트인).
async function getPhone(emp){if(!emp||!emp.phone||!state.data.meta.deviceSecret)return '';try{return await aesDecryptStr(emp.phone,state.data.meta.deviceSecret)}catch(e){console.error('phone decrypt',e);return ''}}
async function setPhone(empId,phoneRaw){const emp=state.data.employees.find(v=>v.id===empId);if(!emp)return;if(!state.data.meta.deviceSecret)await ensureKeyPair();const enc=phoneRaw?await aesEncryptStr(phoneRaw,state.data.meta.deviceSecret):'';const next={...emp,phone:enc,phoneConsent:!!phoneRaw,updatedAt:now()};await repo.apply({employees:[next]});upsertEmp(next)}
async function setPhoneConsent(empId,consent){const emp=state.data.employees.find(v=>v.id===empId);if(!emp||!emp.phone)return;const next={...emp,phoneConsent:!!consent,updatedAt:now()};await repo.apply({employees:[next]});upsertEmp(next)}
function formatPhone(v){const s=str(v).replace(/[^0-9]/g,'');if(s.length===11)return s.slice(0,3)+'-'+s.slice(3,7)+'-'+s.slice(7);if(s.length===10)return s.slice(0,3)+'-'+s.slice(3,6)+'-'+s.slice(6);return s}
// 개인키 암호화 백업 (스펙 STEP 12) — 사용자 passphrase로 래핑, 기기 분실 대비 별도 파일
async function exportKeyBackup(){if(!cryptoOk()){toast('이 브라우저는 열쇠 백업을 지원하지 않습니다.');return}const priv=await getPrivateKey(true);if(!priv||!state.data.meta.pubKey){toast('등록된 열쇠가 없습니다.');return}const pass=window.prompt('내 열쇠 백업 암호를 입력하세요 (분실 시 복구 불가).\n이 암호는 어디에도 저장되지 않습니다.','');if(pass===null)return;if(str(pass).length<8){toast('암호는 8자 이상이어야 합니다.');return}setBusy('내 열쇠 백업을 만드는 중입니다.');try{const pkBackup=await wrapPrivateKey(priv,pass),body={type:'prepaid-key-backup',v:1,appVersion:APP_VERSION,exportedAt:now(),pubKey:state.data.meta.pubKey,pkBackup};downloadFile(JSON.stringify(body,null,2),`선입금대장_내열쇠백업_${dateStamp()}.json`,'application/json');const myKeyBackedUpAt=now();state.data.meta.myKeyBackedUpAt=myKeyBackedUpAt;try{await repo.apply({meta:{myKeyBackedUpAt}})}catch(e2){console.error('key-backup flag save:',e2)}clearBusy();toast('내 열쇠 백업 파일을 저장했습니다.')}catch(e){console.error(e);clearBusy();toast('내 열쇠 백업 오류')}}
// 장부 백업(JSON) 다운로드에는 개인키가 포함되지 않는다(backupCore가 제외). 기관 연동용 키가 있는데 아직
// '내 열쇠 백업'을 한 번도 받지 않았다면, 장부 백업만 믿고 있다가 기기 분실 시 신청을 못 받는 상황을 막기 위해 안내한다.
function maybeWarnKeyMissing(){if(state.data.meta.pubKey&&!state.data.meta.myKeyBackedUpAt){window.alert("저장한 파일에는 '가게 열쇠'가 들어있지 않아요.\n자동 등록(공공기관 명단 받기)을 쓰신다면 설정 > 자동 등록의 [내 열쇠 백업]도 한 번 따로 보관해 주세요.")}}
async function importKeyBackup(parsed){if(!parsed||parsed.type!=='prepaid-key-backup'||!parsed.pkBackup){throw new Error('내 열쇠 백업 형식이 아닙니다.')}const pass=window.prompt('내 열쇠 백업 암호를 입력하세요.','');if(pass===null)return false;const priv=await unwrapPrivateKey(parsed.pkBackup,pass,true);let secret=state.data.meta.deviceSecret;if(!secret){secret=bufToB64(randBytes(32))}const privKeyWrapped=await wrapPrivateKey(priv,secret),pubKey=str(parsed.pubKey)||state.data.meta.pubKey,keyCreatedAt=now();await repo.apply({meta:{deviceSecret:secret,pubKey,privKeyWrapped,keyCreatedAt}});Object.assign(state.data.meta,{deviceSecret:secret,pubKey,privKeyWrapped,keyCreatedAt});refreshKeyFingerprint();return true}
// SMS 안내 (스펙 §수정4) — 직원별 전화번호+동의가 모두 있을 때만, 차감 저장 직후 기기 문자앱을 sms: URI로 자동 오픈 시도한다.

function smsAppSupport(){const ua=(navigator.userAgent||'');return{ios:/iPad|iPhone|iPod/.test(ua),android:/Android/.test(ua)}}
async function maybeSendSms(emp,amount,after){
const fresh=state.data.employees.find(v=>v.id===emp.id)||emp;

const{ios,android}=smsAppSupport();
if(!ios&&!android){toast('이 기기에서는 문자 앱을 자동으로 열 수 없어 문자 안내를 생략했습니다.');return}

// ── 금액 대조(reconcile) ──────────────────────────────────────────────────────
// 예전 대조식은 (선금등록·충전+조정+취소) === (사용 + 잔액합)이었다. 그런데 '잔액합'은 바로 그 거래 목록을
//   같은 규칙으로 다시 더한 값이다 — 좌변과 우변이 같은 계산의 이항일 뿐인 **항등식**이라
//   언제나 참이었다(유형 변조·꼬리 삭제·가짜 충전 삽입 어느 것도 잡지 못함, recon.mjs로 실증).
// 이제 대조 상대는 거래가 **스스로 적어 둔 전후 잔액**이다. 두 가지를 전건 검사한다.
//   ① beforeBalance + 금액 === afterBalance      (그 거래 안에서 앞뒤가 맞는가)
//   ② beforeBalance === 직전 거래의 afterBalance (직원별 잔액 흐름이 이어지는가)
//   ③ 마지막 afterBalance === 처음부터 다시 더한 값 (저장값 vs 재계산값 — 서로 다른 두 경로)
function reconcileEmployee(id){const txs=sortTxAsc(state.data.transactions.filter(t=>str(t.employeeId)===str(id)));
const issues=[];let prevAfter=0,computed=0;
for(const t of txs){
if(num(t.beforeBalance)!==prevAfter)issues.push(`${dt(t.createdAt)} 거래의 시작 잔액이 직전 잔액과 다릅니다.`);
if(applyTx(num(t.beforeBalance),t)!==num(t.afterBalance))issues.push(`${dt(t.createdAt)} 거래의 금액과 전후 잔액이 맞지 않습니다.`);
computed=applyTx(computed,t);prevAfter=num(t.afterBalance)}
const stored=txs.length?num(txs[txs.length-1].afterBalance):0;
if(stored!==computed)issues.push('마지막에 적힌 잔액과 다시 더한 잔액이 다릅니다.');
return{ok:issues.length===0,issues,stored,computed,count:txs.length}}
function reconcileLedger(){const issues=[];let storedSum=0,computedSum=0;
const empIds=new Set(state.data.employees.map(e=>str(e.id)));
state.data.employees.forEach(e=>{const r=reconcileEmployee(e.id);storedSum+=r.stored;computedSum+=r.computed;
r.issues.slice(0,2).forEach(m=>issues.push(`${e.name}: ${m}`))});
const orphans=state.data.transactions.filter(t=>!empIds.has(str(t.employeeId)));
if(orphans.length)issues.push(`존재하지 않는 직원에 달린 거래 ${orphans.length}건`);
return{ok:issues.length===0,issues:issues.slice(0,8),storedSum,computedSum}}
async function runIntegrityCheck(){setBusy('무결성을 검증하는 중입니다.');try{const chain=await verifyChain();const txs=state.data.transactions;const sum=types=>txs.filter(t=>types.includes(t.type)).reduce((s,t)=>s+num(t.amount),0);const deposits=sum(['open','topup']),adjustments=sum(['adjust']),uses=sum(['use']),voids=sum(['void']);const rec=reconcileLedger();const balanceSum=rec.storedSum;const reconcile=rec.ok;state.verifyResult={chain,deposits,adjustments,uses,voids,balanceSum,computedSum:rec.computedSum,reconcile,reconcileIssues:rec.issues,at:now()};clearBusy();render();toast(chain.ok&&reconcile?'무결성 검증 통과':'무결성 경고 — 결과를 확인하세요.')}catch(e){console.error(e);clearBusy();toast('검증 중 오류')}}

// ── 중계 서버 연동 (스펙 §3.3 승인, 2차) — server/PROTOCOL.md 와 일치 ──

// 원칙(사용자 확정): 중복의 최종 판별자는 앱이 아니라 **사장님이 실제로 받은 결제**다 — "결제 1건 ↔ 명단 1건".
//   그래서 같은 명단이 다시 오면 앱은 막지 않고, "언제 이미 올렸는지"를 보여주며 결제를 한 번 더
//   확인하게 한다(팀·개인별로 같은 내용의 결제가 진짜 두 번 있을 수 있다 — 하드 차단은 오답).
//   예전 직접 전달의 무조건 차단은 "다음 달 동일 명단(같은 이름·금액)"까지 막던 결함이기도 했다.
//   기록은 시각을 함께 남기고({h,at}), 구 키(receivedBatchHashes)도 병행 유지한다(다운그레이드 호환).
function receivedBatchLog(){const v=state.data.meta.receivedBatchLog;return Array.isArray(v)?v:[]}
// 이 명단을 이미 올린 시각. 0=처음 보는 명단, 1=이전 버전에서 올림(시각 기록 없음), 그 외=epoch ms.
function receivedBatchAt(bh){if(!bh)return 0;const row=receivedBatchLog().find(x=>x&&x.h===bh);if(row)return num(row.at)||1;return directTransferBatchHashes().includes(bh)?1:0}
async function markBatchReceived(bh){if(!bh)return;const list=receivedBatchLog().filter(x=>x&&x.h!==bh);const next=[...list,{h:bh,at:now()}].slice(-300);state.data.meta.receivedBatchLog=next;await repo.apply({meta:{receivedBatchLog:next}});await markDirectTransferBatch(bh)}
// 명단에 실려 온 결제자·입금자명(담당자 웹 CSV '입금자명' 열, items[].payer — 선택 필드) 목록.
//   카드결제면 비어 있는 것이 정상이다(전표에 개인 이름이 남지 않는 경우가 많다).
function batchPayers(items){return [...new Set((items||[]).map(it=>str(it&&it.payer)).filter(Boolean))]}
// 결제구분(담당자 웹 CSV '결제구분' 선택 열, items[].payMethod — 선택 필드). 값은 '카드'·'계좌이체'.
//   batch_hash canonical(name|dept|amount)에는 들어가지 않는다 — 없어도(구버전 명단) 안전해야 한다.
//   한 명단 안에서 값이 섞여 있거나 비어 있으면 ''(=둘 다 병기)로 본다.
function batchPayMethod(items){const set=new Set((items||[]).map(it=>str(it&&it.payMethod)));if(set.size!==1)return '';const v=[...set][0];return (v==='카드'||v==='계좌이체')?v:''}
// 명단이 전송된 시각(사장님이 그 날짜 매출전표·통장 내역에서 결제 건을 찾을 수 있게 한다).
//   서버 계약상 있을 수도, 없을 수도 있는 값이라 후보 키를 넓게 받고 초 단위도 ms로 맞춘다. 없으면 0.
function batchSentAt(){for(const src of arguments){if(!src||typeof src!=='object')continue;for(const k of ['sent_at','created_at','submitted_at','createdAt','exported_at','exportedAt']){const n=num(src[k]);if(n>0)return n<1e11?n*1000:n}}return 0}
// 인증 도메인(서버가 담당자 이메일 OTP 토큰에서만 읽어 기록하는 값 — /api/inbox summary.agency_domain).
//   기관명은 담당자가 자유 입력하는 자칭 값이라 사칭이 가능하다. null=구버전 토큰·직접 전달 = "확인 불가".
function domainLine(domain){const d=str(domain);return `인증 도메인: ${d||'확인 불가(직접 전달 등)'}`}
// 승인·직접 전달 공용 검토 확인창 본문. 사장님이 결제 내역과 대조할 것(금액·기관·결제자)을 맨 위 3줄에,
//   그 아래 인증 도메인·전송 시각, 이름 단위 반영 내역(충전은 잔액 변화까지), 중복 경고, 확정 문장 순으로 놓는다.
// 표현은 중립("결제(카드·계좌이체)")으로 통일한다 — 담당자는 명단 하나로 여러 가게에 보내지만 돈은
//   가게마다 따로 결제하며, 그 수단은 카드가 대부분이다. "통장 입금"만을 확인 수단으로 요구하면
//   카드 정산금(합산·수수료 차감·며칠 뒤 입금) 때문에 사장님이 승인 근거를 영원히 못 찾는다.
function batchReviewText(o){
const L=[];
const pm=str(o.payMethod);
L.push(`받으실 금액 ${money(o.total)} · ${o.count}명`);
L.push(`기관·부서: ${o.label}${o.ym?` (${o.ym})`:''}${o.direct?' · 직접 전달':''}`);
const payerHint=pm==='카드'?'(카드결제)':pm==='계좌이체'?'(계좌이체)':'(계좌이체 시)';
L.push(`결제자·입금자명: ${o.payers.length?o.payers.slice(0,3).join(', ')+(o.payers.length>3?` 외 ${o.payers.length-3}명`:''):'(명단에 없음 — 카드결제면 비어 있을 수 있어요)'} ${payerHint}`);
L.push(domainLine(o.domain));
L.push('기관명은 담당자가 직접 적는 값이라, 인증된 이메일 도메인과 함께 보고 판단하세요.');
L.push(`명단 전송 시각: ${o.sentAt?dt(o.sentAt):'확인 불가'}`);
if(pm)L.push(`결제 방식: ${pm==='카드'?'카드결제':'계좌이체'} (명단에 표기됨)`);
const tops=o.plan.filter(p=>p.exist),news=o.plan.filter(p=>!p.exist);
if(tops.length){L.push('');L.push(`이미 있는 직원 충전 ${tops.length}명 — 잔액에 더해져요`);tops.slice(0,8).forEach(p=>L.push(`· ${p.rec.name}: ${money(p.before)} → ${money(p.before+p.amt)}`));if(tops.length>8)L.push(`· 외 ${tops.length-8}명`)}
if(news.length){L.push('');L.push(`새 직원 등록 ${news.length}명`);news.slice(0,8).forEach(p=>L.push(`· ${p.rec.name}: ${money(p.amt)}`));if(news.length>8)L.push(`· 외 ${news.length-8}명`)}
if(o.dupAt){L.push('');L.push(`⚠️ 이 명단은 ${o.dupAt>1?dt(o.dupAt):'이전'}에 이미 장부에 올린 명단과 이름·금액까지 완전히 같아요.`);L.push('같은 결제 건을 두 번 올리는 실수일 수 있어요. 이 총액을 별도로 한 번 더 받으신 경우에만(카드 전표·입금 내역 확인) 계속하세요.')}
L.push('');
// 결제구분이 실려 오면 그 수단에 맞는 확인처만 안내하고, 없으면 둘 다 병기한다.
const where=pm==='카드'?'(카드 매출전표·POS 정산 내역)':pm==='계좌이체'?'(통장 입금 내역)':'(카드결제면 매출전표·POS 정산 내역, 계좌이체면 통장 입금 내역)';
L.push(`위 금액 ${money(o.total)}을 실제로 받으셨는지 확인하셨으면 [확인]을 누르세요. ${where}`);
// 출구 안내 — 아직 결제를 못 받았으면 취소가 정답이다(취소해도 서버 신청은 PENDING 그대로 남는다).
L.push(o.direct?'아직 결제를 못 받으셨으면 [취소] — 받은 파일(또는 QR)로 나중에 다시 열 수 있어요.':'아직 결제를 못 받으셨으면 [취소] — 신청은 그대로 남아 나중에 다시 열 수 있어요(3일 이내).');
return L.join('\n')}
async function processDirectTransfer(parsed){
if(!parsed||typeof parsed!=='object'||parsed.type!=='direct-transfer'||!parsed.ciphertext||!parsed.summary){toast('이 파일(또는 QR 코드)은 선입금대장 전달 형식이 아닙니다.');return}
const rid=str(state.data.meta.restaurantId);
if(!rid){toast('먼저 우리 가게를 등록하세요.');return}
if(str(parsed.restaurant_id)!==rid){window.alert('이 파일은 다른 가게용입니다.\n우리 가게 앞으로 온 전달인지 담당자에게 확인해 주세요.');return}
const batchHash=str(parsed.summary.batch_hash);
// beta.32: 중복은 하드 차단하지 않는다 — "언제 이미 올렸는지"를 검토 확인창에 실어 사장님이
//   실제 받은 결제(결제 1건 ↔ 명단 1건)로 판정한다. 무조건 차단은 다음 달 동일 명단(같은 이름·금액)까지 막았다.
setBusy('열어보는 중입니다.');
try{
const plain=await decryptBlob(parsed.ciphertext);
if(!plain||!Array.isArray(plain.items))throw new Error('명단 형식 오류');
const chk=await verifyBatchAgainstSummary(plain,parsed.summary,batchHash,true);
if(!chk.ok){clearBusy();window.alert('⚠️ 명단 확인값이 일치하지 않아 등록을 차단했습니다.\n('+chk.detail+')\n전송 중 자료가 손상되었거나 변조되었을 수 있습니다.\n공공기관 담당자(서무)에게 다시 보내달라고 요청하세요.');return}
assignDuplicateSuffix(plain.items);
const groupDept=combinedDeptLabel(parsed.institution,parsed.department);
// 승인(relayApprove)과 같은 규칙: 이미 있는 활성 직원은 새 카드 대신 충전한다(다음 달 재전달 시 동명 카드 누적 방지).
const activeByKey=activeEmployeeIndex();
const plan=plain.items.map(it=>{const rec={org:str(it.org)||str(parsed.institution),dept:str(it.dept),name:str(it.name)};const exist=activeByKey.get(empMatchKey(rec));return{it,rec,amt:num(it.amount),exist,before:exist?balanceOf(exist.id):0}});
clearBusy();
if(!window.confirm(batchReviewText({label:groupDept,ym:str(parsed.year_month),direct:true,payers:batchPayers(plain.items),payMethod:batchPayMethod(plain.items),domain:parsed.summary.agency_domain,sentAt:batchSentAt(parsed,parsed.summary),total:num(parsed.summary.total_amount),count:plain.items.length,plan,dupAt:receivedBatchAt(batchHash)}))){render();return}
setBusy('장부에 올리는 중입니다.');
const t=now(),ym=str(parsed.year_month);let tip=chainTip();const emps=[],txs=[],patches=[];
const noteLabel=str(parsed.institution)+' '+str(parsed.department);
let topupCount=0;const patchedIds=new Set();
for(const p of plan){
/* 담당자 웹의 CSV '소속' 선택 열(items[].org) — 없으면 기존대로 기관명. batch_hash 계산식은 불변(name|dept|amount). */
const txNote=noteLabel+(str(p.it.payer)?' · 결제 '+str(p.it.payer):'');
// 승인과 동일: 같은 결합 라벨을 쓰는 활성 직원 전체를 함께 백필한다(명단에 빠진 동료가 다른 그룹으로 갈라지지 않게).
publicOrgPatchesForLabel(p.rec,patchedIds).forEach(pt=>patches.push(pt));
if(p.exist){topupCount++;if(p.amt>0){const before=balanceOf(p.exist.id);const tx=await makeTx({employeeId:p.exist.id,type:'topup',amount:p.amt,beforeBalance:before,afterBalance:before+p.amt,reason:'직접 전달 추가 충전',note:txNote,createdAt:t},tip);tip=tx.txHash;txs.push(tx)}continue}
const eid=uid();
emps.push({id:eid,org:p.rec.org,orgKind:'public',dept:p.rec.dept,name:p.rec.name,note:'',isDeleted:false,phone:'',phoneConsent:false,yearMonth:ym,createdAt:t,updatedAt:t});
if(p.amt>0){const tx=await makeTx({employeeId:eid,type:'open',amount:p.amt,beforeBalance:0,afterBalance:p.amt,reason:'직접 전달 등록',note:txNote,createdAt:t},tip);tip=tx.txHash;txs.push(tx)}
}
await repo.apply({employees:emps.concat(patches),transactions:txs});
emps.forEach(upsertEmp);patches.forEach(upsertEmp);txs.forEach(upsertTx);
await markBatchReceived(batchHash);
clearBusy();render();
const totalAmt=txs.reduce((s,tx)=>s+num(tx.amount),0);
window.alert(`✅ 등록 완료 (직접 전달)\n\n${groupDept}\n신규 ${emps.length}명 · 기존 충전 ${topupCount}명 · ${money(totalAmt)}이 장부에 추가됐어요.`);
if(state.data.meta.pubKey&&window.confirm('장부 되찾기용 백업을 갱신할까요?\n(서버는 내용을 볼 수 없어요 — 잠금)'))await relayBackupNow()
}catch(e){console.error(e);clearBusy();toast('등록 오류: '+(e.message||''))}
}
async function onDirectTransferFile(e){const file=e.target.files&&e.target.files[0];if(!file)return;if(lockScreenActive()){qs('directTransferFile').value='';return}// 잠금 중 파일 경로 차단(2중 안전장치)
try{const text=await file.text();const parsed=JSON.parse(text);await processDirectTransfer(parsed)}catch(err){console.error(err);toast('파일을 읽을 수 없습니다: '+(err&&err.message||''))}finally{qs('directTransferFile').value=''}}
// QR 스캔 — BarcodeDetector(qr_code) 지원 기기에서만 노출. 읽힌 텍스트는 파일 열기와 동일한 processDirectTransfer 경로를 공유
async function detectQrSupport(){try{if(!('BarcodeDetector' in window)){state.qrAvailable=false;return}const formats=await BarcodeDetector.getSupportedFormats();state.qrAvailable=Array.isArray(formats)&&formats.includes('qr_code')}catch(e){state.qrAvailable=false}if(state.loaded&&!renderIsDisruptive())render()}
function stopQrScan(){qrLoopActive=false;if(qrStream){try{qrStream.getTracks().forEach(tr=>tr.stop())}catch(e){}qrStream=null}const video=qs('qrVideo');if(video)video.dataset.ready=''}
async function qrScanLoop(video){while(qrLoopActive&&state.modal&&state.modal.type==='qr-scan'){try{const codes=await qrDetector.detect(video);if(codes&&codes.length){const text=codes[0].rawValue;qrLoopActive=false;stopQrScan();state.modal=null;render();await handleQrText(text);return}}catch(e){}await new Promise(r=>setTimeout(r,350))}}
async function initQrScan(){const video=qs('qrVideo');if(!video||video.dataset.ready==='1')return;video.dataset.ready='1';if(!state.qrAvailable||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){state.modal=null;render();toast('이 기기는 QR(사각 코드) 스캔을 지원하지 않아요. 담당자에게 파일로 받아 주세요.');return}try{qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}})}catch(err){console.error('camera',err);state.modal=null;render();toast('카메라를 사용할 수 없어요. 담당자에게 파일로 받아 주세요.');return}if(!state.modal||state.modal.type!=='qr-scan'){try{qrStream.getTracks().forEach(tr=>tr.stop())}catch(e){}qrStream=null;return}video.srcObject=qrStream;try{await video.play()}catch(e){}try{qrDetector=qrDetector||new BarcodeDetector({formats:['qr_code']})}catch(e){stopQrScan();state.modal=null;render();toast('이 기기는 QR(사각 코드) 스캔을 지원하지 않아요. 담당자에게 파일로 받아 주세요.');return}qrLoopActive=true;qrScanLoop(video)}
async function handleQrText(text){let parsed;try{parsed=JSON.parse(text)}catch(e){toast('QR 내용을 읽을 수 없습니다. 담당자에게 파일로 받아 주세요.');return}await processDirectTransfer(parsed)}

// 챌린지 인증(스펙 §서버 계약): /api/challenge 로 받은 RSA-OAEP 암호문을 내 개인키로 복호화해 auth_token 문자열 획득
async function relayAuthToken(){const base=relayBase(),rid=str(state.data.meta.restaurantId);if(!rid)throw new Error('가게가 등록되지 않았습니다.');const r=await fetch(base+'/api/challenge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({restaurant_id:rid})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.challenge_ct)throw new Error(j.error||'인증 챌린지 오류');const priv=await getPrivateKey();if(!priv)throw new Error('가게 열쇠가 없습니다');const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},priv,b64ToBuf(j.challenge_ct));return new TextDecoder().decode(raw)}
// 클라우드 원장 백업(암호화, 선택) — 기관 신청 blob과 동일한 하이브리드 구조(AES-256-GCM + RSA-OAEP 래핑), 서버는 평문을 볼 수 없음
// 전화번호는 이 기기(로컬)에만 저장 — 클라우드 백업(서버 전송 경로)에는 절대 포함하지 않는다. 로컬 JSON "장부 안전 저장" 파일에는 그대로 남지만, 그 파일은 기기 밖으로 나가지 않는 한 서버로 전송되지 않는다.
function stripPhonesForCloud(core){return{...core,payload:{...core.payload,employees:core.payload.employees.map(({phone,phoneConsent,...rest})=>rest)}}}
async function buildCloudBackupBlob(){if(!state.data.meta.pubKey)throw new Error('키가 없습니다.');const core=stripPhonesForCloud(backupCore());const plaintext=JSON.stringify(core);const aesRaw=randBytes(32);const aesKey=await crypto.subtle.importKey('raw',aesRaw,{name:'AES-GCM'},false,['encrypt']);const iv=randBytes(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},aesKey,new TextEncoder().encode(plaintext));const pub=await crypto.subtle.importKey('spki',b64ToBuf(state.data.meta.pubKey),{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);const encKey=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,aesRaw);return{encKey:bufToB64(encKey),iv:bufToB64(iv),ct:bufToB64(ct)}}
async function relayBackupNow(){if(!navigator.onLine){toast('인터넷 연결을 확인해 주세요.');return}if(!relayRegistered()){toast('먼저 우리 가게를 등록하세요.');return}setBusy('장부 되찾기용 백업을 만드는 중입니다.');try{const blob=await buildCloudBackupBlob();const blobB64=btoa(JSON.stringify(blob));if(blobB64.length>1000000){clearBusy();toast('장부 용량이 커서 백업을 만들 수 없어요.');return}const blobHash=await hash(blobB64);const rid=str(state.data.meta.restaurantId);const authToken=await relayAuthToken();const r=await fetch(relayBase()+'/api/ledger-backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({restaurant_id:rid,auth_token:authToken,blob:blobB64,blob_hash:blobHash})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'백업 실패');const at=now();state.data.meta.lastCloudBackupAt=at;await repo.apply({meta:{lastCloudBackupAt:at}});clearBusy();render();toast('장부를 안전하게 저장했어요.')}catch(e){console.error(e);clearBusy();toast('백업 오류: '+(e.message||''))}}
// 조용한 클라우드 백업 — buildCloudBackupBlob/relayAuthToken/relayBase를 그대로 재사용(새 서버 계약 없음). busy/toast 없이 성공 여부만 반환. 실패는 조용히 false.

async function relayBackupSilent(){try{if(lockScreenActive())return false;if(!navigator.onLine||!relayRegistered()||!state.data.meta.pubKey)return false;const blob=await buildCloudBackupBlob();const blobB64=btoa(JSON.stringify(blob));if(blobB64.length>1000000)return false;const blobHash=await hash(blobB64);const rid=str(state.data.meta.restaurantId);const authToken=await relayAuthToken();const r=await fetch(relayBase()+'/api/ledger-backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({restaurant_id:rid,auth_token:authToken,blob:blobB64,blob_hash:blobHash})});if(!r.ok)return false;const at=now();state.data.meta.lastCloudBackupAt=at;await repo.apply({meta:{lastCloudBackupAt:at}});return true}catch(e){console.error('silent cloud backup',e);return false}}

async function maybeMonthlyAutoBackup(){try{if(lockScreenActive())return;if(state.data.meta.autoCloudBackup===false)return;if(!relayRegistered())return;if(!navigator.onLine)return;const due=monthlyBackupDue();if(!due)return;/*활동0·이미백업·월말아님이면 여기서 종료 → 서버 호출 없음*/const ok=await relayBackupSilent();if(ok){state.data.meta.lastMonthlyBackup=due;await repo.apply({meta:{lastMonthlyBackup:due}});render();toast('이번 달 장부를 안전하게 백업했어요.')}}catch(e){console.error('monthly auto backup',e)}}
async function relayRestoreFromCloud(){if(!navigator.onLine){toast('인터넷 연결을 확인해 주세요.');return}if(!relayRegistered()){toast('먼저 우리 가게를 등록하세요.');return}if(!window.confirm('보관된 내용으로 복원할까요?\n\n현재 기기의 장부가 백업 시점 내용으로 바뀌어요.'))return;setBusy('보관된 내용을 불러오는 중입니다.');try{const rid=str(state.data.meta.restaurantId);const authToken=await relayAuthToken();const r=await fetch(relayBase()+'/api/ledger-backup/get',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({restaurant_id:rid,auth_token:authToken})});if(r.status===404){clearBusy();toast('보관된 내용이 없어요.');return}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'복원 실패');if(j.blob_hash){const calc=await hash(j.blob);if(calc!==j.blob_hash){clearBusy();toast('백업 무결성 확인에 실패했습니다.');return}}const blob=JSON.parse(atob(j.blob));const core=await decryptBlob(blob);clearBusy();const ok=await restoreFromParsed(core);if(ok){const at=j.updated_at?(new Date(j.updated_at).getTime()||now()):now();state.data.meta.lastCloudBackupAt=at;await repo.apply({meta:{lastCloudBackupAt:at}});render()}}catch(e){console.error(e);clearBusy();toast('복원 오류: '+(e.message||''))}}

// 토스트는 사장님용 문구다 — 잠금(손님) 화면에서는 표시하지 않고 그냥 버린다(큐잉하지 않는다).

// 토스트는 화면 위에 겹쳐 놓은 한 조각이다. 그 한 조각 때문에 화면 전체를 다시 그리면, 그리는 도중이던 서명 획과
//   사장님이 고쳐 넣은 금액·비고가 함께 사라진다. 특히 3초 뒤 **스스로** 사라질 때의 렌더는 아무도 누른 적 없는

function paintToast(){if(!renderIsDisruptive())return false;const app=qs('app');if(!app)return false;const cur=document.querySelector('.toast');

if(cur){cur.textContent=state.toast;return true}
const el=document.createElement('div');el.className='toast';el.textContent=state.toast;app.appendChild(el);return true}
function toast(msg){clearTimeout(state.toastTimer);if(lockScreenActive()){state.toast='';return}state.toast=msg;if(!paintToast())render();state.toastTimer=setTimeout(()=>{state.toast='';if(!paintToast())render()},3000)}

// ⚠️ clearBusy는 반드시 render까지 한다 — 예전에는 상태만 지워서, 뒤에 render()가 없는 경로(복원 취소 등)에서

function field(id,label,value,ph,type,extra){return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type||'text'}" value="${esc(value)}" placeholder="${esc(ph||'')}"${type==='number'?' step="1"':''}${extra?' '+extra:''}></div>`}
// 소속(선택) 입력 — 비우면 예전과 100% 동일하게 동작한다(org=''). 빠른 선택은 [개인] + 기존 직원의 org 고유값 최대 4개.
// 소속 제안 목록 = '개인' + 우리 가게에 등록된 공공기관명(meta.orgName) + 기존 직원 소속 고유값(최대 4).
//   공공기관명을 '개인' 바로 다음(최상단권)에 둔다 — 손으로 등록하는 직원 대부분이 그 기관 소속이기 때문이다.
function orgSuggestions(){const orgName=str(state.data.meta.orgName);
const pub=(orgName&&orgName!==DEFAULT_ORG&&orgName!==PERSONAL_ORG)?[orgName]:[];
const set=new Set(state.data.employees.map(e=>str(e.org)).filter(Boolean));
const rest=[...set].filter(v=>v!==PERSONAL_ORG&&!pub.includes(v)).slice(0,4);
return[PERSONAL_ORG,...pub,...rest]}
// 소속(org)이 등록된 공공기관명과 같으면 홈에서 공공기관 블록으로 묶이도록 표식을 붙인다(수동·빠른·CSV 등록 공통).

// ⚠️ orgSuggestions와 대칭을 맞춘다 — 제안 목록에 올리지 않는 값(기본값 '공공기관', '개인')은 분류 기준으로도 쓰지 않는다.

// ⚠️ 이 함수는 '등록 시점'에만 호출된다 — meta.orgName을 나중에 바꿔도 이미 등록된 직원의 orgKind는 그대로다(자동 등록 이력 보존).
//   같은 소속이 두 블록으로 갈릴 수 있으나, 사장님이 직원 정보 수정으로 옮길 수 있으므로 소급 재분류는 하지 않는다.

// 소속 추천 목록의 **유일한** DOM 표현. 예전에는 [한 명씩 등록] 모달과 [빠른 등록] 폼이 각자

// ── 기관 데이터 v2: 전국 2단 계층(시·도 → 기관). 인덱스(agency-index.json) 로드 후 시·도별 부서 파일은 lazy fetch + 캐시. 실패 시 레거시(agency-departments.json) 폴백. ──
function legacyToV2(legacy){return{schemaVersion:2,updatedAt:str(legacy.updatedAt),scope:str(legacy.scope),regions:[{code:'seoul',name:'서울',deptsFile:null,agencies:(legacy.agencies||[]).map(a=>({id:a.id,name:a.name}))}]}}
function legacyDeptMap(legacy){const m={};(legacy.agencies||[]).forEach(a=>{m[a.id]=Array.isArray(a.departments)?a.departments:[]});return m}
async function loadAgencyData(force){
  // 1차: v2 인덱스
  try{const res=await fetch('./agency-index.json'+(force?'?t='+Date.now():''),{cache:force?'reload':'default'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!data||!Array.isArray(data.regions))throw new Error('형식 오류');state.agencyData=data;state.agencyError='';if(force)state.deptCache={};restoreAgencySelection();await ensureDeptsForRegion(state.regionSelected,force);return true}
  catch(e){console.warn('agency-index v2 로드 실패 → 레거시 폴백 시도:',e&&e.message);}
  // 2차: 레거시 폴백(서울 단일 시·도로 변환, 부서는 즉시 캐시)
  try{const res=await fetch('./agency-departments.json'+(force?'?t='+Date.now():''),{cache:force?'reload':'default'});if(!res.ok)throw new Error('HTTP '+res.status);const legacy=await res.json();if(!legacy||!Array.isArray(legacy.agencies))throw new Error('형식 오류');state.agencyData=legacyToV2(legacy);state.deptCache={seoul:{updatedAt:str(legacy.updatedAt),source:'agency-departments.json',depts:legacyDeptMap(legacy),failed:false}};state.agencyError='';restoreAgencySelection();return true}
  catch(e2){console.error('agency data:',e2);state.agencyError='공공기관 목록을 불러올 수 없습니다.';return false}
}
function regionList(){return(state.agencyData&&state.agencyData.regions)||[]}
// beta.45(현장 지시): 두 함수 모두 **고른 적이 없으면 null**이다 — 예전의 '첫 항목' 폴백을 없앴다.
//   폴백이 있던 동안 화면에는 늘 어떤 기관이 골라진 것처럼 보였고, 그 아래 과 목록은 사장님과 아무
//   상관 없는 기관의 것이었다. 게다가 설정에서 체크 한 번이면 그 기관명이 meta.orgName으로 저장됐다.
//   호출부는 전부 (region&&agency) 형태로 null을 이미 다룬다.
function selectedRegion(){const rs=regionList();return rs.find(r=>r.code===state.regionSelected)||null}
function selectedAgency(){const r=selectedRegion();if(!r)return null;return (r.agencies||[]).find(a=>a.id===state.agencySelected)||null}
// 저장된 orgName(기관명 문자열)으로 시·도+기관을 역추적해 초기 선택 복원. 없으면 서울(없으면 첫 시·도) 기본.
function restoreAgencySelection(){const rs=regionList();if(!rs.length)return;const savedOrg=str(state.data&&state.data.meta&&state.data.meta.orgName);if(savedOrg){for(const r of rs){const a=(r.agencies||[]).find(x=>x.name===savedOrg);if(a){state.regionSelected=r.code;state.agencySelected=a.id;return}}}const curR=rs.find(r=>r.code===state.regionSelected);if(curR){if(!(curR.agencies||[]).some(a=>a.id===state.agencySelected))state.agencySelected='';return}
// 저장된 기관명이 없고 고른 적도 없으면 아무것도 고르지 않은 상태로 둔다(예전에는 서울+첫 기관을
//   자동으로 골라 놓았다 — 서울이 아닌 가게에는 처음부터 틀린 값이 보였다).
state.regionSelected='';state.agencySelected=''}
// 시·도 부서 파일 lazy fetch + 메모리 캐시. 실패 시 실패 플래그를 남겨 UI에서 기본 목록 안내.
async function ensureDeptsForRegion(code,force){code=str(code);if(!code)return true;if(!force&&state.deptCache[code])return true;const region=regionList().find(r=>r.code===code);if(!region)return false;if(!region.deptsFile&&state.deptCache[code])return true;const fileRef=region.deptsFile||('agency-depts/'+code+'.json');const url='./'+(fileRef.indexOf('/')>=0?fileRef:('agency-depts/'+fileRef));try{const res=await fetch(url+(force?'?t='+Date.now():''),{cache:force?'reload':'default'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();const depts=(data&&data.depts&&typeof data.depts==='object')?data.depts:{};state.deptCache[code]={updatedAt:str(data&&data.updatedAt),source:str(data&&data.source),depts,failed:false};return true}catch(e){console.error('depts load ('+code+'):',e&&e.message);state.deptCache[code]={updatedAt:'',source:'',depts:{},failed:true};return false}}
// 선택 기관의 부서 목록: 부서 파일에 해당 agencyId가 있으면 그 목록, 없으면 COMMON_DEPTS 템플릿 폴백.

// 기관명에서 시군구 매칭 키 추출(끝의 '청' 제거): 광진구청→광진구, 중구청→중구, 고성군청→고성군
function districtKey(name){name=str(name);if(/청$/.test(name))name=name.slice(0,-1);return name}
// ① 주소에서 시·도 판별(긴 별칭 우선). 데이터 region.code 또는 region.name과 매칭.
function detectRegionFromText(text){const rs=regionList();let best=null,bestLen=0;for(const entry of REGION_ALIASES){for(const nm of entry.names){if(nm.length>bestLen&&text.includes(nm)){const region=rs.find(r=>r.code===entry.code)||rs.find(r=>entry.names.includes(r.name));if(region){best=region;bestLen=nm.length}}}}for(const r of rs){if(r.name&&r.name.length>bestLen&&text.includes(r.name)){best=r;bestLen=r.name.length}}return best}
// ② 특정 시·도 안에서 시군구명 매칭(광역청=첫 항목 제외, 긴 이름 우선)
function matchAgencyInRegion(region,text){const cands=(region.agencies||[]).slice(1).map(a=>({a,key:districtKey(a.name)})).filter(x=>x.key).sort((x,y)=>y.key.length-x.key.length);for(const c of cands){if(text.includes(c.key))return c.a}return null}
// ③ 시·도 판별 실패 시: 시군구명이 전국에서 유일할 때만 매칭(중복명은 포기)
function matchUniqueDistrict(text){const map=new Map();for(const r of regionList()){(r.agencies||[]).slice(1).forEach(a=>{const k=districtKey(a.name);if(!k)return;if(!map.has(k))map.set(k,[]);map.get(k).push({region:r,agency:a})})}const keys=[...map.keys()].sort((a,b)=>b.length-a.length);for(const k of keys){if(text.includes(k)){const arr=map.get(k);return arr.length===1?arr[0]:null}}return null}
// 가게 주소에서 시·도→시군구 2단계로 담당 기관 자동 매칭. 반환 {region,agency} 또는 null(오매칭보다 미매칭 우선).
function matchAgencyByRegion(text){text=str(text);if(!text||!state.agencyData)return null;const region=detectRegionFromText(text);if(region){const agency=matchAgencyInRegion(region,text);return agency?{region,agency}:null}const uniq=matchUniqueDistrict(text);return uniq?{region:uniq.region,agency:uniq.agency}:null}

// 이 화면에는 두 가지 맥락(state.pinContext)이 있다. 입력·검증 경로는 완전히 같고(handlePinKey 하나),
//   다른 것은 문구·되돌아가기 라벨·유휴 시계뿐이다.
//   'owner'   = 손님 화면 아래 [사장님용 잠금 해제]로 사장님이 스스로 들어온 화면 — 남은 손님 흔적이 하나도
//               없고(인계 요청까지 버린다), 120초 무조작이면 손님 초기 화면으로 되돌아간다.
//   'handoff' = 손님이 요청을 넘긴 화면("사장님 확인") — [사장님 확인 받기](금액·서명 포함)이든 [사장님 부르기](대상만)든
//               같은 화면이다. 인계 대상(B면 금액·서명까지)이 표시되고,
//               손님 흔적(인계 요청)이 살아 있으므로 30초 무조작이면 손님 초기 화면으로 되돌아간다.
// TTL(pendingTtl 120초)도 함께 본다 — 잠금 해제 시점의 판정(takePendingCustomer)과 **같은 기준**이어야 한다.
//   기준이 어긋나면 이미 죽은 요청을 화면만 "사장님 확인 / ○○○님"으로 계속 광고하게 되고, 사장님은
//   그 사람의 사용 등록이 열릴 줄 알고 PIN을 넣었다가 그냥 홈을 만난다. 만료된 요청은 여기서 폐기하되,
//   "만료됐다"는 사실은 pendingExpired에 남긴다 — 그래야 사장님이 PIN을 넣었을 때 takePendingCustomer가
//   예전과 똑같이 "요청이 만료되었습니다" 한 줄을 띄운다(P4의 약속 유지).
function handoffEmp(){if(state.pinContext!=='handoff')return null;const id=str(state.pendingCustomerId);if(!id)return null;
const at=num(state.pendingCustomerAt);

// 인계 요청 TTL 만료 시점의 1회성 재렌더. 재렌더가 handoffEmp를 다시 태우면 요청이 폐기되고
//   화면이 평범한 [비밀번호 입력]으로 내려앉는다(그 다음 렌더에서 ho=null → stopHandoffTtl로 자동 종료).
function stopHandoffTtl(){if(handoffTtlTimer){clearTimeout(handoffTtlTimer);handoffTtlTimer=null}}

// 남은 입력 지연(초). 0이면 지연 없음.
