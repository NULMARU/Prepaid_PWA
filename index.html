function field(id,label,value,ph,type){return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type||'text'}" value="${esc(value)}" placeholder="${esc(ph||'')}"${type==='number'?' step="1"':''}></div>`}
// 소속(선택) 입력 — 비우면 예전과 100% 동일하게 동작한다(org=''). 빠른 선택은 [개인] + 기존 직원의 org 고유값 최대 4개.
// 소속 제안 목록 = '개인' + 우리 가게에 등록된 공공기관명(meta.orgName) + 기존 직원 소속 고유값(최대 4).
//   공공기관명을 '개인' 바로 다음(최상단권)에 둔다 — 손으로 등록하는 직원 대부분이 그 기관 소속이기 때문이다.
function orgSuggestions(){const orgName=str(state.data.meta.orgName);
const pub=(orgName&&orgName!==DEFAULT_ORG&&orgName!==PERSONAL_ORG)?[orgName]:[];
const set=new Set(state.data.employees.map(e=>str(e.org)).filter(Boolean));
const rest=[...set].filter(v=>v!==PERSONAL_ORG&&!pub.includes(v)).slice(0,4);
return[PERSONAL_ORG,...pub,...rest]}
// 소속(org)이 등록된 공공기관명과 같으면 홈에서 공공기관 블록으로 묶이도록 표식을 붙인다(수동·빠른·CSV 등록 공통).
// ⚠️ orgKind는 표시 계층 전용이다 — 동일인 매칭 키(empMatchKey = 라벨|이름)는 그대로이므로 충전 로직에 영향이 없다.
// ⚠️ orgSuggestions와 대칭을 맞춘다 — 제안 목록에 올리지 않는 값(기본값 '공공기관', '개인')은 분류 기준으로도 쓰지 않는다.
//   예전에는 meta.orgName이 기본값 그대로인 신규 설치에서 소속에 '공공기관'이라고 적기만 하면 public으로 분류됐다.
// ⚠️ 이 함수는 '등록 시점'에만 호출된다 — meta.orgName을 나중에 바꿔도 이미 등록된 직원의 orgKind는 그대로다(자동 등록 이력 보존).
//   같은 소속이 두 블록으로 갈릴 수 있으나, 사장님이 직원 정보 수정으로 옮길 수 있으므로 소급 재분류는 하지 않는다.
function orgKindFor(org){const v=str(org),on=str(state.data.meta.orgName);
if(!v||!on||on===DEFAULT_ORG||on===PERSONAL_ORG)return '';
return v===on?'public':''}
function orgField(id,value){const opts=orgSuggestions().map(v=>`<option value="${esc(v)}">`).join('');return `<div class="field"><label for="${id}">소속 (선택)</label><input id="${id}" value="${esc(value||'')}" placeholder="예: 한빛물산 · 개인" list="${id}List"><datalist id="${id}List">${opts}</datalist><div class="meta" style="font-size:11px">회사명·공공기관명을 적거나, 개인 선금이면 '개인'</div></div>`}
function deptField(id,label,value,ph){const depts=state.data.meta.departments||[];const chips=depts.map(d=>`<span class="dept-pick${value===d?' on':''}" data-a="pick-dept" data-dept="${esc(d)}">${esc(d)}</span>`).join('');return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" value="${esc(value)}" placeholder="${esc(ph||'')}"><div class="dept-picks">${chips}</div></div>`}

// ── 기관 데이터 v2: 전국 2단 계층(시·도 → 기관). 인덱스(agency-index.json) 로드 후 시·도별 부서 파일은 lazy fetch + 캐시. 실패 시 레거시(agency-departments.json) 폴백. ──
function legacyToV2(legacy){return{schemaVersion:2,updatedAt:str(legacy.updatedAt),scope:str(legacy.scope),regions:[{code:'seoul',name:'서울',deptsFile:null,agencies:(legacy.agencies||[]).map(a=>({id:a.id,name:a.name}))}]}}
function legacyDeptMap(legacy){const m={};(legacy.agencies||[]).forEach(a=>{m[a.id]=Array.isArray(a.departments)?a.departments:[]});return m}
async function loadAgencyData(force){
  // 1차: v2 인덱스
  try{const res=await fetch('./agency-index.json'+(force?'?t='+Date.now():''),{cache:force?'reload':'default'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!data||!Array.isArray(data.regions))throw new Error('형식 오류');state.agencyData=data;state.agencyError='';if(force)state.deptCache={};restoreAgencySelection();await ensureDeptsForRegion(state.regionSelected,force);return true}
  catch(e){console.warn('agency-index v2 로드 실패 → 레거시 폴백 시도:',e&&e.message);}
  // 2차: 레거시 폴백(서울 단일 시·도로 변환, 부서는 즉시 캐시)
  try{const res=await fetch('./agency-departments.json'+(force?'?t='+Date.now():''),{cache:force?'reload':'default'});if(!res.ok)throw new Error('HTTP '+res.status);const legacy=await res.json();if(!legacy||!Array.isArray(legacy.agencies))throw new Error('형식 오류');state.agencyData=legacyToV2(legacy);state.deptCache={seoul:{updatedAt:str(legacy.updatedAt),source:'agency-departments.json',depts:legacyDeptMap(legacy),failed:false}};state.agencyError='';restoreAgencySelection();return true}
  catch(e2){console.error('agency data:',e2);state.agencyError='공공기관 목록을 불러올 수 없습니다.';return false}
}
function regionList(){return(state.agencyData&&state.agencyData.regions)||[]}
function selectedRegion(){const rs=regionList();return rs.find(r=>r.code===state.regionSelected)||rs[0]||null}
function selectedAgency(){const r=selectedRegion();if(!r)return null;const list=r.agencies||[];return list.find(a=>a.id===state.agencySelected)||list[0]||null}
// 저장된 orgName(기관명 문자열)으로 시·도+기관을 역추적해 초기 선택 복원. 없으면 서울(없으면 첫 시·도) 기본.
function restoreAgencySelection(){const rs=regionList();if(!rs.length)return;const savedOrg=str(state.data&&state.data.meta&&state.data.meta.orgName);if(savedOrg){for(const r of rs){const a=(r.agencies||[]).find(x=>x.name===savedOrg);if(a){state.regionSelected=r.code;state.agencySelected=a.id;return}}}const curR=rs.find(r=>r.code===state.regionSelected);if(curR){if((curR.agencies||[]).some(a=>a.id===state.agencySelected))return;state.agencySelected=(curR.agencies&&curR.agencies[0]&&curR.agencies[0].id)||'';return}const def=rs.find(r=>r.code==='seoul')||rs[0];state.regionSelected=def.code;state.agencySelected=(def.agencies&&def.agencies[0]&&def.agencies[0].id)||''}
// 시·도 부서 파일 lazy fetch + 메모리 캐시. 실패 시 실패 플래그를 남겨 UI에서 기본 목록 안내.
async function ensureDeptsForRegion(code,force){code=str(code);if(!code)return true;if(!force&&state.deptCache[code])return true;const region=regionList().find(r=>r.code===code);if(!region)return false;if(!region.deptsFile&&state.deptCache[code])return true;const fileRef=region.deptsFile||('agency-depts/'+code+'.json');const url='./'+(fileRef.indexOf('/')>=0?fileRef:('agency-depts/'+fileRef));try{const res=await fetch(url+(force?'?t='+Date.now():''),{cache:force?'reload':'default'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();const depts=(data&&data.depts&&typeof data.depts==='object')?data.depts:{};state.deptCache[code]={updatedAt:str(data&&data.updatedAt),source:str(data&&data.source),depts,failed:false};return true}catch(e){console.error('depts load ('+code+'):',e&&e.message);state.deptCache[code]={updatedAt:'',source:'',depts:{},failed:true};return false}}
// 선택 기관의 부서 목록: 부서 파일에 해당 agencyId가 있으면 그 목록, 없으면 COMMON_DEPTS 템플릿 폴백.
function agencyDeptEntry(regionCode,agencyId){const cache=state.deptCache[regionCode];if(cache&&cache.depts&&Array.isArray(cache.depts[agencyId]))return cache.depts[agencyId];return null}
function resolveAgencyDepts(regionCode,agencyId){return agencyDeptEntry(regionCode,agencyId)||COMMON_DEPTS}
// ── 주소 → 시·도 별칭(전체명+축약형) ──
const REGION_ALIASES=[
{code:'seoul',names:['서울특별시','서울시','서울']},
{code:'busan',names:['부산광역시','부산시','부산']},
{code:'daegu',names:['대구광역시','대구시','대구']},
{code:'incheon',names:['인천광역시','인천시','인천']},
{code:'gwangju',names:['광주광역시','광주시','광주']},
{code:'daejeon',names:['대전광역시','대전시','대전']},
{code:'ulsan',names:['울산광역시','울산시','울산']},
{code:'sejong',names:['세종특별자치시','세종시','세종']},
{code:'gyeonggi',names:['경기도','경기']},
{code:'gangwon',names:['강원특별자치도','강원도','강원']},
{code:'chungbuk',names:['충청북도','충북']},
{code:'chungnam',names:['충청남도','충남']},
{code:'jeonbuk',names:['전북특별자치도','전라북도','전북']},
{code:'jeonnam',names:['전라남도','전남']},
{code:'gyeongbuk',names:['경상북도','경북']},
{code:'gyeongnam',names:['경상남도','경남']},
{code:'jeju',names:['제주특별자치도','제주도','제주']}
];
// 기관명에서 시군구 매칭 키 추출(끝의 '청' 제거): 광진구청→광진구, 중구청→중구, 고성군청→고성군
function districtKey(name){name=str(name);if(/청$/.test(name))name=name.slice(0,-1);return name}
// ① 주소에서 시·도 판별(긴 별칭 우선). 데이터 region.code 또는 region.name과 매칭.
function detectRegionFromText(text){const rs=regionList();let best=null,bestLen=0;for(const entry of REGION_ALIASES){for(const nm of entry.names){if(nm.length>bestLen&&text.includes(nm)){const region=rs.find(r=>r.code===entry.code)||rs.find(r=>entry.names.includes(r.name));if(region){best=region;bestLen=nm.length}}}}for(const r of rs){if(r.name&&r.name.length>bestLen&&text.includes(r.name)){best=r;bestLen=r.name.length}}return best}
// ② 특정 시·도 안에서 시군구명 매칭(광역청=첫 항목 제외, 긴 이름 우선)
function matchAgencyInRegion(region,text){const cands=(region.agencies||[]).slice(1).map(a=>({a,key:districtKey(a.name)})).filter(x=>x.key).sort((x,y)=>y.key.length-x.key.length);for(const c of cands){if(text.includes(c.key))return c.a}return null}
// ③ 시·도 판별 실패 시: 시군구명이 전국에서 유일할 때만 매칭(중복명은 포기)
function matchUniqueDistrict(text){const map=new Map();for(const r of regionList()){(r.agencies||[]).slice(1).forEach(a=>{const k=districtKey(a.name);if(!k)return;if(!map.has(k))map.set(k,[]);map.get(k).push({region:r,agency:a})})}const keys=[...map.keys()].sort((a,b)=>b.length-a.length);for(const k of keys){if(text.includes(k)){const arr=map.get(k);return arr.length===1?arr[0]:null}}return null}
// 가게 주소에서 시·도→시군구 2단계로 담당 기관 자동 매칭. 반환 {region,agency} 또는 null(오매칭보다 미매칭 우선).
function matchAgencyByRegion(text){text=str(text);if(!text||!state.agencyData)return null;const region=detectRegionFromText(text);if(region){const agency=matchAgencyInRegion(region,text);return agency?{region,agency}:null}const uniq=matchUniqueDistrict(text);return uniq?{region:uniq.region,agency:uniq.agency}:null}
function deptTarget(ctx){return ctx==='setup'?state.setupDepts:(state.data.meta.departments||[])}
async function setDeptTarget(ctx,list){const clean=[...new Set(list.map(str).filter(Boolean))];if(ctx==='setup'){state.setupDepts=clean;render();return}state.data.meta.departments=clean;await repo.apply({meta:{departments:clean}});render()}
async function saveSelectedAgencyName(){const agency=selectedAgency();if(!agency||!repo)return;if(state.data.meta.orgName===agency.name)return;state.data.meta.orgName=agency.name;await repo.apply({meta:{orgName:agency.name}})}
function agencyPickerHtml(ctx){const data=state.agencyData;if(!data)return `<div class="agency-tools"><div class="meta">${esc(state.agencyError||'공공기관 목록을 준비하는 중입니다.')}</div><button class="btn" data-a="agency-refresh">목록 불러오기</button></div>`;const rs=regionList(),region=selectedRegion(),cur=selectedAgency(),target=deptTarget(ctx);const suffix=ctx==='setup'?'Setup':'Settings';const regionSelectId='regionSelect'+suffix,agencySelectId='agencySelect'+suffix;const regionOpts=rs.map(r=>`<option value="${esc(r.code)}"${region&&region.code===r.code?' selected':''}>${esc(r.name)}</option>`).join('');const agencyOpts=region?(region.agencies||[]).map(a=>`<option value="${esc(a.id)}"${cur&&cur.id===a.id?' selected':''}>${esc(a.name)}</option>`).join(''):'';const cache=region?state.deptCache[region.code]:null;const explicit=!!(region&&cur&&agencyDeptEntry(region.code,cur.id));const effectiveDepts=(region&&cur)?resolveAgencyDepts(region.code,cur.id):COMMON_DEPTS;const checks=effectiveDepts.length?effectiveDepts.map(d=>`<label class="dept-check"><input type="checkbox" data-a="agency-dept-toggle" data-ctx="${ctx}" data-dept="${esc(d)}"${target.includes(d)?' checked':''}>${esc(d)}</label>`).join(''):'<div class="meta">불러온 과 목록이 없어요. 아래에서 부서명을 직접 추가할 수 있어요.</div>';const failNote=(cache&&cache.failed)?'<div class="meta" style="color:var(--danger)">부서 목록을 불러오지 못해 기본 목록을 보여드려요.</div>':'';const basis=explicit&&cache&&(cache.updatedAt||cache.source)?('부서 목록 기준일 '+esc(cache.updatedAt||'-')):'부서 목록 기준: 기본 목록';return `<div class="agency-tools"><div class="meta" style="margin-bottom:8px">시·도를 고르고, 우리 가게와 거래하는 공공기관을 고르세요.</div><div class="field"><label for="${regionSelectId}">시·도</label><select id="${regionSelectId}" data-ctx="${ctx}">${regionOpts}</select></div><div class="field"><label for="${agencySelectId}">거래 공공기관</label><select id="${agencySelectId}" data-ctx="${ctx}">${agencyOpts}</select></div><div class="agency-actions"><button class="btn-secondary" data-a="agency-add-all" data-ctx="${ctx}">선택한 공공기관의 과 전체 추가</button><button class="btn" data-a="agency-remove-all" data-ctx="${ctx}">선택한 공공기관의 과 제거</button><button class="btn" data-a="agency-refresh">목록 새로고침</button></div>${failNote}<div class="dept-checks">${checks}</div><div class="meta">${basis} · 동주민센터는 빠져 있어요</div></div>`}

// ── PIN 잠금 화면 ──
// 이 화면에는 두 가지 맥락(state.pinContext)이 있다. 입력·검증 경로는 완전히 같고(handlePinKey 하나),
//   다른 것은 문구·되돌아가기 라벨·유휴 시계뿐이다.
//   'owner'   = 손님 화면 아래 [사장님용 잠금 해제]로 사장님이 스스로 들어온 화면 — 남은 손님 흔적이 하나도
//               없고(인계 요청까지 버린다), 120초 무조작이면 손님 초기 화면으로 되돌아간다.
//   'handoff' = 손님이 [사장님께 보여주기]를 눌러 그대로 넘긴 화면("사장님 확인") — 인계 대상이 표시되고,
//               손님 흔적(인계 요청)이 살아 있으므로 30초 무조작이면 손님 초기 화면으로 되돌아간다.
// TTL(pendingTtl 120초)도 함께 본다 — 잠금 해제 시점의 판정(takePendingCustomer)과 **같은 기준**이어야 한다.
//   기준이 어긋나면 이미 죽은 요청을 화면만 "사장님 확인 / ○○○님"으로 계속 광고하게 되고, 사장님은
//   그 사람의 사용 등록이 열릴 줄 알고 PIN을 넣었다가 그냥 홈을 만난다. 만료된 요청은 여기서 폐기하되,
//   "만료됐다"는 사실은 pendingExpired에 남긴다 — 그래야 사장님이 PIN을 넣었을 때 takePendingCustomer가
//   예전과 똑같이 "요청이 만료되었습니다" 한 줄을 띄운다(P4의 약속 유지).
function handoffEmp(){if(state.pinContext!=='handoff')return null;const id=str(state.pendingCustomerId);if(!id)return null;
const at=num(state.pendingCustomerAt);
if(!at||now()-at>TIMERS.pendingTtl){state.pendingCustomerId='';state.pendingCustomerAt=0;state.pendingExpired=true;return null}
return state.data.employees.find(v=>v.id===id&&!v.isDeleted)||null}
function pinScreenHtml(){
const hasPin=!!state.data.meta.pinHash;
const isSetup=!hasPin||state.pinMode==='change';
const step=isSetup?(state.pinSetup1?'confirm':'new'):'unlock';
if(step==='unlock'&&state.pinRecovery)return pinRecoveryHtml();
// 인계 대상이 사라졌거나(삭제·숨김) 요청이 비었으면 조용히 평범한 잠금 해제 화면으로 되돌아간다.
const ho=step==='unlock'?handoffEmp():null;
// 대상이 표시되는 동안에는 TTL 만료 시점에 딱 한 번 다시 그린다. 이게 없으면 화면은 오직 "조작"에만
//   갱신되는데, 조작이 계속되면 유휴 시계가 계속 밀려 죽은 요청을 영원히 광고하게 된다.
if(ho)scheduleHandoffTtl();else stopHandoffTtl();
const titles={new:'비밀번호 설정',confirm:'비밀번호 확인',unlock:ho?'사장님 확인':'비밀번호 입력'};
const subs={new:'숫자 4자리를 입력하세요',confirm:'한번 더 입력하세요',unlock:ho?`<span class="pin-ho"><b>${esc(ho.name)}</b>님 · 사장님이 비밀번호를 입력해 주세요<br><span class="pin-ho-label">${esc(orgDeptLabel(ho)||'부서 없음')}</span></span>`:'비밀번호를 입력하세요'};
const dots=[0,1,2,3].map(i=>`<div class="pin-dot${i<state.pinInput.length?' filled':''}${state.pinMsg&&state.pinMsg.includes('틀렸습니다')?' error':''}"></div>`).join('');
// 5회 실패 → 즉시 [앱 초기화]를 띄우던 옛 화면은 "손님이 장난으로 5번 누르면 초기화 버튼이 보이는" 구조였다.
//   → 60초 입력 지연(카운트다운)으로 바꾼다. 초기화는 [PIN을 잊으셨나요?] 복구 화면 안에만 남는다.
//   실패 횟수·지연 만료 시각은 meta에 영속된다 — 새로고침·앱 재시작으로 지연을 지울 수 없다(무제한 브루트포스 차단).
const delayLeft=pinDelayLeft();
const dis=delayLeft>0?' disabled':'';
const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" data-a="pin-key" data-key="${n}"${dis}>${n}</button>`).join('');
// 카운트다운은 숫자 노드(#pinDelayLeft) 하나만 갈아끼운다 — 매초 전체 render를 돌리면 유휴 타이머가 계속 재무장돼 굶는다.
const delayBox=delayLeft>0?`<div class="pin-delay">비밀번호를 ${state.pinFails}번 틀렸습니다.<br><span id="pinDelayLeft">${delayLeft}</span>초 뒤에 다시 입력할 수 있어요.</div>`:'';
if(delayLeft>0)schedulePinDelayTick();
const forgotBtn=step==='unlock'?`<div class="pin-reset"><button data-a="pin-forgot">PIN을 잊으셨나요?</button></div>`:'';
// PIN 화면은 사장님 전용 갈림길이다 — 손님이 잘못 들어왔으면 1탭으로 손님 화면으로 돌아갈 수 있어야 한다.
//   인계 화면("사장님 확인")에서는 [처음으로] — 누르면 인계 요청까지 함께 버린다(pin-to-cust가 전부 정리한다).
const backToCust=step==='unlock'?`<div class="cust-foot"><button data-a="pin-to-cust">${ho?'처음으로':'손님 화면으로'}</button></div>`:'';
return `<div class="pin-screen"><div class="pin-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="pin-title">${titles[step]}</div><div class="pin-sub">${subs[step]}</div><div class="pin-dots">${dots}</div><div class="pin-pad">${keys}<button class="pin-key fn" data-a="pin-key" data-key="back"${dis}>←</button><button class="pin-key" data-a="pin-key" data-key="0"${dis}>0</button><button class="pin-key fn" data-a="pin-key" data-key="clear"${dis}>C</button></div><div class="pin-msg">${esc(state.pinMsg)}</div>${delayBox}${forgotBtn}${backToCust}</div>`}
// 인계 요청 TTL 만료 시점의 1회성 재렌더. 재렌더가 handoffEmp를 다시 태우면 요청이 폐기되고
//   화면이 평범한 [비밀번호 입력]으로 내려앉는다(그 다음 렌더에서 ho=null → stopHandoffTtl로 자동 종료).
function stopHandoffTtl(){if(handoffTtlTimer){clearTimeout(handoffTtlTimer);handoffTtlTimer=null}}
function scheduleHandoffTtl(){stopHandoffTtl();
const left=num(state.pendingCustomerAt)+TIMERS.pendingTtl-now();
handoffTtlTimer=setTimeout(()=>{handoffTtlTimer=null;
if(state.loaded&&state.pinLocked&&state.lockView==='pin'&&state.pinContext==='handoff')render()},Math.max(left,0)+50)}
// 남은 입력 지연(초). 0이면 지연 없음.
function pinDelayLeft(){const left=num(state.pinDelayUntil)-now();return left>0?Math.ceil(left/1000):0}
function stopPinDelayTick(){if(pinDelayTimer){clearInterval(pinDelayTimer);pinDelayTimer=null}}
// 1초마다 숫자 노드만 바꾼다(render 금지). 지연이 끝나면 그때 한 번만 render해 키패드를 되살리고,
//   화면을 떠나 노드가 사라지면 타이머도 함께 멈춘다.
function schedulePinDelayTick(){if(pinDelayTimer)return;pinDelayTimer=setInterval(()=>{
const left=pinDelayLeft();
if(left<=0){stopPinDelayTick();if(state.loaded)render();return}
const el=qs('pinDelayLeft');if(!el){stopPinDelayTick();return}
el.textContent=String(left)},1000)}
// [PIN을 잊으셨나요?] 복구 화면의 파괴 버튼 활성화 게이트 — 화면 진입 시각 기준 60초.
function recoveryLeft(){if(!state.pinRecovery||!num(state.pinRecoveryAt))return 0;const left=num(state.pinRecoveryAt)+TIMERS.recoveryGate-now();return left>0?Math.ceil(left/1000):0}
function recoveryReady(){return !!(state.pinRecovery&&num(state.pinRecoveryAt)&&recoveryLeft()<=0)}
function stopRecoveryTick(){if(recoveryTimer){clearInterval(recoveryTimer);recoveryTimer=null}}
function scheduleRecoveryTick(){if(recoveryTimer)return;recoveryTimer=setInterval(()=>{
const left=recoveryLeft();
if(left<=0){stopRecoveryTick();if(state.loaded)render();return}
const el=qs('pinRecoveryLeft');if(!el){stopRecoveryTick();return}
el.textContent=String(left)},250)}
// 복구 화면을 떠날 때(취소·손님 화면·잠금 해제·초기화) 남는 것이 없도록 한자리에서 정리한다.
function leaveRecovery(){state.pinRecovery=false;state.pinRecoveryAt=0;state.allowLockedRestore=false;stopRecoveryTick()}

// PIN 분실 복구 안내(스펙 §4 항목3) — 백업 파일이 있으면 복구, 없으면 기존 전체 초기화 경로.
// ⚠️ 이 화면의 두 버튼은 잠금(손님) 화면에서도 도달 가능한 유일한 파괴 경로다. 사장님의 PIN 분실 복구는 살려야 하므로
//   버튼을 없애는 대신 "화면 진입 후 60초"를 지나야 눌리게 한다 — 손님·아이가 홧김에 3탭으로 장부를 날리는 길을 끊는다.
//   (기존의 confirm 2회 + 삭제 전 강제 백업 다운로드는 그대로 유지된다.)
function pinRecoveryHtml(){
const left=recoveryLeft();
if(left>0)scheduleRecoveryTick();
const dis=left>0?' disabled':'';
const gate=left>0?`<div class="pin-delay">잘못 누름 방지를 위해 <span id="pinRecoveryLeft">${left}</span>초 후 활성화돼요.</div>`:'';
return `<div class="pin-screen"><div class="pin-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="pin-title">PIN을 잊으셨나요?</div><div class="pin-sub">아래 방법 중 하나를 선택하세요.</div>${gate}<div class="section-actions" style="width:100%;max-width:340px"><button class="btn-primary action-btn" data-a="pin-forgot-restore"${dis}><span class="action-icon">📁</span><div><strong>① 백업 파일로 복구</strong><span>저장해둔 백업 파일이 있으면 선택하세요. 데이터를 확인한 뒤 새 비밀번호를 설정합니다.</span></div></button><button class="btn-danger action-btn" data-a="pin-reset"${dis}><span class="action-icon">②</span><div><strong>백업 파일이 없어요</strong><span>모든 데이터를 지우고 처음부터 다시 시작합니다.</span></div></button></div><div class="pin-reset"><button data-a="pin-forgot-cancel">돌아가기</button></div></div>`}

async function handlePinKey(key){
if(pinDelayLeft()>0)return;// 5회 실패 후 입력 지연 중 — 어떤 키도 받지 않는다
if(key==='clear'){state.pinInput='';state.pinMsg='';render();return}
if(key==='back'){state.pinInput=state.pinInput.slice(0,-1);state.pinMsg='';render();return}
if(state.pinInput.length>=4)return;
state.pinInput+=key;state.pinMsg='';render();
if(state.pinInput.length<4)return;
const pin=state.pinInput;const hasPin=!!state.data.meta.pinHash;
const isSetup=!hasPin||state.pinMode==='change';
if(isSetup){
if(!state.pinSetup1){state.pinSetup1=pin;state.pinInput='';render();return}
if(state.pinSetup1!==pin){state.pinSetup1='';state.pinInput='';state.pinMsg='비밀번호가 일치하지 않습니다. 다시 설정하세요.';render();return}
const h=await hash(pin);state.data.meta.pinHash=h;await repo.apply({meta:{pinHash:h}});
state.pinInput='';state.pinSetup1='';state.pinMode='';state.pinLocked=false;state.pinMsg='';state.pinContext='';leaveRecovery();await clearPinGuard();resetCustomerState();render();toast('비밀번호가 설정되었습니다.')
}else{
const h=await hash(pin);
if(h===state.data.meta.pinHash){state.pinInput='';state.pinLocked=false;state.pinMsg='';state.pinContext='';leaveRecovery();stopPinDelayTick();await clearPinGuard();
// 손님 인계(A-full): 손님이 [사장님께 보여주기]를 누른 직후(120초 이내)라면 그 직원의 사용 모달을 바로 연다.
//   금액은 절대 미리 채우지 않는다 — 금액을 정하는 주체는 언제나 사장님이다.
const pending=takePendingCustomer();resetCustomerState();
if(pending.id)await openUsageFor(pending.id);
// 요청이 만료·폐기됐는데 아무 말 없이 홈이 뜨면 사장님이 "왜 안 열리지?" 하고 헤맨다 — 한 줄로 알린다.
else{render();if(pending.expired)toast('손님 확인 요청이 만료됐어요.')}}
else{state.pinFails++;state.pinInput='';state.pinMsg=`비밀번호가 틀렸습니다. (${state.pinFails}회)`;
if(state.pinFails>=5)state.pinDelayUntil=now()+TIMERS.pinDelay;
await savePinGuard();
render()}}}
// PIN 실패 횟수·지연 만료 시각은 meta에 영속한다 — 새로고침 한 번으로 지연이 사라지면 지연이 아니다.
async function savePinGuard(){const pinFails=num(state.pinFails),pinDelayUntil=num(state.pinDelayUntil);
state.data.meta.pinFails=pinFails;state.data.meta.pinDelayUntil=pinDelayUntil;
try{if(repo)await repo.apply({meta:{pinFails,pinDelayUntil}})}catch(e){console.error('pin guard save',e)}}
async function clearPinGuard(){state.pinFails=0;state.pinDelayUntil=0;await savePinGuard()}

// PIN 분실 복구 경로의 초기화도 설정 화면과 동일한 안내창 2회 확인으로 통일(스펙 §수정6)
async function pinReset(){
// 잠금 화면에서 도달했다면 복구 화면의 60초 게이트를 반드시 통과했어야 한다(버튼 disabled와 별개인 2중 방어).
if(lockScreenActive()&&!recoveryReady())return;
const ok=await confirmWipeWithBackup('PIN만 따로 초기화할 수는 없어요(보안).\n\n모든 장부·직원 기록이 지워집니다. 계속할까요?');
if(!ok)return;
setBusy('앱을 초기화하는 중입니다.');
try{await wipeLocalData();clearBusy();render();window.alert('✅ 초기화 완료\n\n모든 로컬 데이터가 삭제되었습니다. 새로 설정해 주세요.')}catch(err){console.error(err);clearBusy();toast('초기화 중 오류가 발생했습니다.')}}

// ══ 잠금 화면 = 손님 화면 ═════════════════════════════════════════════════
// 지도 원칙: "손님은 '요청'을 만들 수 있고 '기록'은 만들 수 없다."
//   이 화면의 어떤 경로도 makeTx/repo.apply에 닿지 않는다. 손님이 남길 수 있는 유일한 흔적은
//   휘발성 pendingCustomerId(사장님 인계 요청)뿐이며, 이는 저장소에 기록되지 않는다.
//   구조적 보장은 onClick/onInput의 LOCK_ALLOWED 게이트가 담당한다(핸들러 개별 검사에 의존하지 않는다).

// 손님 화면 상태 전부 폐기 — 자동 복귀·잠금 해제·[처음으로] 어디서든 같은 초기화를 쓴다.
function resetCustomerState(){state.custQuery='';state.custStage='search';state.custSelectedId='';state.custVerify=null;state.pendingCustomerId='';state.pendingCustomerAt=0;state.pendingExpired=false}
// 사장님 인계 요청 회수(1회성). TTL(120초) 경과·직원 삭제/숨김이면 조용히 폐기하되, 폐기했다는 사실은 알려준다.
//   반환값 {id, expired} — id가 있으면 사용 모달을 열고, expired면 사장님에게 한 줄 안내.
function takePendingCustomer(){const id=str(state.pendingCustomerId),at=num(state.pendingCustomerAt),preExpired=!!state.pendingExpired;
state.pendingCustomerId='';state.pendingCustomerAt=0;state.pendingExpired=false;
// 화면(handoffEmp)이 이미 만료를 판정해 요청을 버린 뒤일 수 있다 — 그 사실을 여기서 이어받는다.
if(!id)return{id:'',expired:preExpired};
if(!at||now()-at>TIMERS.pendingTtl)return{id:'',expired:true};
const emp=state.data.employees.find(v=>v.id===id&&!v.isDeleted);return emp?{id,expired:false}:{id:'',expired:true}}
// 잠금 해제 상태에서 손님 화면(잠금)으로 되돌리기 — 자동 잠금·[손님 셀프 조회] 공용.
//   pinFails/pinDelayUntil은 사장님이 인증을 마친 뒤에만 여기 오므로 함께 비운다(meta까지 영속).
function lockToCustomer(){state.pinLocked=true;state.lockView='customer';state.pinContext='';state.pinInput='';state.pinSetup1='';state.pinMsg='';leaveRecovery();stopPinDelayTick();state.modal=null;
clearTimeout(state.toastTimer);state.toast='';// 사장님용 토스트가 손님 화면으로 넘어가지 않게 한다
resetCustomerState();clearPinGuard();render()}
// 손님 화면을 띄울 수 있는 조건 — PIN이 없거나(최초 설정) 변경 중이면 절대 띄우지 않는다.
// 잠금 화면이 실제로 떠 있는 상태인가. ⚠️ pinLocked는 온보딩 중에도 true다(설정 화면이 먼저 렌더된다)
//    — 게이트를 pinLocked만으로 걸면 초기 설정 화면의 모든 버튼이 막힌다.
function lockScreenActive(){return !!(state.loaded&&state.data.meta.setupComplete&&state.pinLocked)}
function customerViewAllowed(){return !!state.data.meta.pinHash&&state.pinMode!=='change'&&!state.pinRecovery}

// 동명이인 병합 판정 — assignDuplicateSuffix()가 붙이는 구분 마커 '·2','·3'…을 떼어 기본 이름으로 묶는다.
// ⚠️ 옛 규칙(이름 끝 라틴 소문자 1글자)은 Alex/Alec 같은 서로 다른 사람을 "동명이인"으로 오병합해 둘 다 조회를 막았다.
//   마커는 사용자가 직접 칠 일이 없는 문자(가운뎃점+숫자)라 오탐이 구조적으로 불가능하다.
function custDupBase(name){return str(name).replace(/·\d+$/,'')}
function custDupKey(e){const label=orgDeptLabel(e)||'부서 없음';const b=custDupBase(e&&e.name);return b?JSON.stringify([label,b]):''}
// 손님 검색 결과 행 만들기. 질의가 비면 아무도 내보내지 않는다(명단 0명 — 손님에게 전체 명단을 보여주지 않는다).
function custRows(active,q){
if(!str(q))return[];
const groups=new Map();
active.forEach(e=>{const k=custDupKey(e);if(!k)return;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)});
const merged=new Map();groups.forEach((list,k)=>{if(list.length>=2)merged.set(k,list)});
const rows=[],seen=new Set();
active.forEach(e=>{const label=orgDeptLabel(e)||'부서 없음';const k=custDupKey(e);
if(k&&merged.has(k)){if(seen.has(k))return;const list=merged.get(k);if(!list.some(v=>nameMatches(v.name,q)))return;seen.add(k);rows.push({dup:true,label,name:JSON.parse(k)[1],count:list.length});return}
if(!nameMatches(e.name,q))return;
rows.push({dup:false,id:e.id,label,name:e.name})});
return rows}
function custRowHtml(r){
if(r.dup)return `<div class="cust-row dup" aria-disabled="true"><div class="cust-row-label">${esc(r.label)}</div><div class="cust-row-name">${esc(r.name)} (동명이인 ${r.count}명) — 사장님께 말씀해 주세요</div></div>`;
return `<button class="cust-row" data-a="cust-pick" data-id="${esc(r.id)}"><div class="cust-row-label">${esc(r.label)}</div><div class="cust-row-name">${esc(r.name)}</div></button>`}
// 최근 거래 슬림 행 — 손님 화면 전용. 서명 이미지는 띄우지 않고(옆 손님에게 남의 서명이 보이면 안 된다) 취소 버튼도 없다.
function custTxHtml(t,voided){
const lbl={open:'등록',topup:'충전',use:'사용',void:'취소',adjust:'조정'}[t.type]||t.type;
const isOut=t.type==='use',isAdj=t.type==='adjust',isV=voided.has(t.id);
const sign=isOut?'-':(isAdj&&num(t.amount)<0)?'':'+';
const amt=isAdj?money(t.amount):money(Math.abs(t.amount));
const sig=t.signatureData?'<span class="cust-chip">서명 있음 ✓</span>':'';
const vm=isV?'<span class="cust-chip void">취소됨</span>':'';
return `<div class="cust-tx${isV?' voided':''}"><div><div class="cust-tx-label">${esc(lbl)}</div><div class="cust-tx-date">${esc(dt(t.createdAt))}</div></div><div class="cust-tx-right"><div class="cust-tx-amt ${isOut?'out':'in'}">${sign}${amt}</div><div>${sig}${vm}</div></div></div>`}

function customerScreenHtml(){
const d=derive();
const q=str(state.custQuery);
const shop=state.data.meta.shopName||APP;
const head=`<div class="cust-head"><div class="cust-shop">${esc(shop)}</div><div class="cust-title">내 선금 잔액 확인</div></div>`;
const foot=`<div class="cust-foot"><button data-a="lock-to-pin">사장님용 잠금 해제</button></div>`;
const wrap=body=>`<div class="cust-screen">${head}${body}${foot}</div>`;

// 최초 설정 완료 안내(스펙 §수정4): PIN 설정 직후 딱 한 번, 두 갈래로 다음 행동을 안내
function setupGuideHtml(){
const on=relayRegistered();
// 등록에 성공했으면 열쇠 백업이 가장 급한 일 — 열쇠가 없으면 명단 수신도 등록 해제도 못 한다(B3).

return '<div class="setup"><div class="setup-head"><h1>완료</h1><p>'+(on?'자동 등록이 켜졌어요. 공공기관에서 보낸 명단을 앱에서 바로 받을 수 있어요.':'가게 등록을 마무리하세요. 등록해야 공공기관 담당자(서무)가 우리 가게를 찾을 수 있어요.')+'</p></div>'+keyBlock+'<div class="section-actions" style="max-width:420px;margin:0 auto"><button class="btn-primary action-btn" data-a="guide-add-employee"><span class="action-icon">＋</span><div><strong>한 명씩 등록</strong><span>직원과 초기 선입금을 직접 입력해요 (수동 등록)</span></div></button><button class="btn-secondary action-btn" data-a="guide-start-agency"><span class="action-icon">🏛</span><div><strong>'+(on?'공공기관에서 보낸 명단 받기':'우리 가게 등록 마무리하기')+'</strong><span>'+(on?'공공기관이 보낸 명단 신청을 확인해 장부에 올려요 (자동 등록)':'우리 가게를 등록해야 공공기관 명단을 받을 수 있어요')+'</span></div></button></div><div style="text-align:center;margin-top:16px"><button class="btn" data-a="guide-dismiss" style="min-height:40px;padding:0 16px;font-size:13px">나중에 할게요 (홈으로)</button></div></div>'}

// 초기 설정 완료 처리 — 연락처는 선택이며, 채워졌으면 로컬(meta)에만 저장(스펙 §수정3-2). 서버 등록은 기관 등록 성공 시 relayRegister()에서 자동 처리.
async function finishSetup(kakao,email){
kakao=str(kakao);email=str(email);
if(!state.setupTermsAgreed){toast('이용약관 및 개인정보처리방침에 동의해 주세요.');return}
if(kakao&&!isKakaoOpenLink(kakao)){toast("카카오톡 '오픈채팅' 링크만 등록할 수 있어요");return}
if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('이메일 형식을 확인해 주세요.');return}
const region=selectedRegion();const agency=selectedAgency();const agencyDeptSet=new Set((region&&agency)?resolveAgencyDepts(region.code,agency.id):[]);const usedAgency=state.setupDepts.some(v=>agencyDeptSet.has(v));
state.data.meta.departments=[].concat(state.setupDepts);
state.data.meta.orgName=usedAgency&&agency?agency.name:(state.data.meta.orgName||DEFAULT_ORG);
state.data.meta.contactKakaoLink=kakao;
state.data.meta.contactEmail=email;
state.data.meta.setupComplete=true;
const termsAgreedAt=now();state.data.meta.termsAgreedAt=termsAgreedAt;
await repo.apply({meta:{shopName:state.data.meta.shopName||'',shopAddr:state.data.meta.shopAddr||'',shopTel:state.data.meta.shopTel||'',orgName:state.data.meta.orgName,departments:state.data.meta.departments,contactKakaoLink:kakao,contactEmail:email,setupComplete:true,termsAgreedAt}});
// 우리 가게 등록(서버 전송)은 반드시 약관 동의 이후에만 — 2/4에서 고른 가게가 있을 때 여기서 처음 서버를 호출한다.
const registered=await finishStoreRegistration();
state.setupStep=1;state.setupGuide=true;
// 등록이 안 끝난 채로 '초기 설정 완료'만 띄우면 실패가 가려진다(A4) — 남은 할 일을 그대로 말해준다.
render();toast(registered?'초기 설정 완료':'설정은 끝났어요. 가게 등록은 아직 안 됐어요 — 홈의 안내를 눌러 마무리하세요.')}

// 온보딩 2/4에서 고른 가게를 서버에 등록. 실패(오프라인 등)하면 로컬 등록 상태를 되돌리고 홈 배너로 마무리를 유도한다.
async function finishStoreRegistration(){
const picked=state.setupPickedStore;
if(!picked||!str(picked.id)){await markStoreRegisterPending();return false}
const before=num(state.data.meta.relayRegisteredAt);
state.data.meta.restaurantId=str(picked.id);state.data.meta.relayStoreName=str(picked.name);
try{await repo.apply({meta:{restaurantId:state.data.meta.restaurantId,relayStoreName:state.data.meta.relayStoreName}})}catch(e){console.error('store meta save',e)}
try{await relayRegister()}catch(e){console.error('setup register',e)}
if(num(state.data.meta.relayRegisteredAt)>before)return true;// 성공(relayRegister가 pending 플래그도 해제)
state.data.meta.restaurantId='';state.data.meta.relayStoreName='';
try{await repo.apply({meta:{restaurantId:'',relayStoreName:''}})}catch(e){console.error('store meta rollback',e)}
await markStoreRegisterPending();return false}
async function markStoreRegisterPending(){state.data.meta.storeRegisterPending=true;try{await repo.apply({meta:{storeRegisterPending:true}})}catch(e){console.error('pending flag',e)}}

// 음성 인식(STT) — 어르신·바쁜 매장을 위한 이름 음성 검색 (Web Speech API)
function voiceSearch(){

function focusablesIn(container){return[...container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&el.offsetParent!==null)}
function activateModalA11y(shouldFocus){const back=document.querySelector('.modal-back');if(!back)return;const modal=back.querySelector('.modal');if(!modal)return;modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');if(!modal.hasAttribute('tabindex'))modal.setAttribute('tabindex','-1');const items=focusablesIn(modal);if(shouldFocus){if(items.length)items[0].focus();else modal.focus()}if(modalKeydownHandler)document.removeEventListener('keydown',modalKeydownHandler);modalKeydownHandler=function(e){if(e.key==='Escape'){state.modal=null;render();return}if(e.key!=='Tab')return;const list=focusablesIn(modal);if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}};document.addEventListener('keydown',modalKeydownHandler)}

// ── 이름 검색 매칭 (초성 + 공백 무시) ──
// 검색어가 전부 한글 자음(ㄱ-ㅎ)이면 "초성 검색"으로 취급해 이름의 초성열과 부분 일치시킨다("ㄱㅁ" → 김민수).
// 그 외에는 기존 부분 일치(includes) 그대로. 어느 경우든 공백은 양쪽 모두 지우고 비교한다("이 순신" → 이순신).
// ⚠️ 검색 대상은 이름뿐이다 — 소속·부서는 (현행대로) 검색어 매칭에 넣지 않는다.
const CHOSEONG=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toChoseong(s){let out='';for(const ch of str(s)){const c=ch.charCodeAt(0);out+=(c>=0xAC00&&c<=0xD7A3)?CHOSEONG[Math.floor((c-0xAC00)/588)]:ch}return out}
function isChoseongQuery(q){return /^[ㄱ-ㅎ]+$/.test(q)}
function nameMatches(name,kw){const q=str(kw).replace(/\s+/g,'');if(!q)return true;const n=str(name),nk=n.replace(/\s+/g,'');if(isChoseongQuery(q))return toChoseong(nk).includes(q);return n.includes(str(kw))||nk.includes(q)}
function derive(){const balances=new Map(),voided=new Set();const asc=sortTxAsc(state.data.transactions);asc.forEach(t=>{const p=balances.get(t.employeeId)||0;balances.set(t.employeeId,applyTx(p,t));if(t.type==='void'&&t.targetTransactionId)voided.add(t.targetTransactionId)});const employees=state.data.employees.map(e=>({...e,balance:balances.get(e.id)||0,deptKey:orgDeptLabel(e)||'부서 없음'})).sort((a,b)=>a.deptKey.localeCompare(b.deptKey,'ko')||a.name.localeCompare(b.name,'ko'));const empMap=new Map(employees.map(e=>[e.id,e]));const active=employees.filter(e=>!e.isDeleted);
// 홈 그룹 — 헤더 문구·순서는 활성 직원 전체(homeGroupIndex)에서, 내용물은 검색·필터가 적용된 filtered에서 온다.
const groupIndex=homeGroupIndex(active);
// 부서 필터 자기치유: 저장된 그룹 키가 지금은 없는 그룹이면(소속·부서 수정이나 자동 등록 백필로 키가 바뀐 경우)
//   선택 UI에는 '전체 소속'이 보이는데 내부적으로는 아무도 통과하지 못해 "검색 결과가 없습니다"만 남는다 → 즉시 전체 소속으로 되돌린다.
if(state.deptFilter&&!groupIndex.meta.has(state.deptFilter))state.deptFilter='';
const kw=state.search.trim();const df=state.deptFilter;const filtered=active.filter(e=>{if(df&&homeGroupKey(e)!==df)return false;if(kw&&!nameMatches(e.name,kw))return false;return true});const total=active.reduce((s,e)=>s+e.balance,0);
// 검색 중일 때만 "최근 사용 순"(마지막 거래 createdAt 내림차순, 동률은 기존 순서 유지 — sort는 안정 정렬).
// 검색이 없으면 그룹 정렬·그룹 안 순서는 종전 그대로다.
if(kw){const lastTxAt=new Map();state.data.transactions.forEach(t=>{const p=lastTxAt.get(t.employeeId)||0;if(t.createdAt>p)lastTxAt.set(t.employeeId,t.createdAt)});filtered.sort((a,b)=>(lastTxAt.get(b.id)||0)-(lastTxAt.get(a.id)||0))}
const fmap=new Map();filtered.forEach(e=>{const k=homeGroupKey(e);if(!fmap.has(k))fmap.set(k,[]);fmap.get(k).push(e)});
const homeGroups=groupIndex.order.filter(g=>fmap.has(g.key)).map(g=>{const items=fmap.get(g.key);
// 회사 그룹만 부서 소제목(하위 카테고리)으로 한 번 더 나눈다. 부서가 빈 직원은 소제목 없이 먼저 나온다.
const subs=g.kind==='company'?groupBy(items,e=>str(e.dept)).sort((a,b)=>(a[0]?1:0)-(b[0]?1:0)||a[0].localeCompare(b[0],'ko')).map(([dept,list])=>({dept,items:list})):null;
return{key:g.key,kind:g.kind,label:g.label,org:g.org,items,subs,count:items.length,totalBalance:items.reduce((s,e)=>s+e.balance,0)}});const hist=sortTxDesc(state.data.transactions).filter(t=>!state.historyEmployeeId||t.employeeId===state.historyEmployeeId);const historyGroups=groupBy(hist,t=>{const e=empMap.get(t.employeeId);return(e?e.deptKey:'부서 없음')+'||'+(e?e.name:'알 수 없는 직원')+'||'+t.employeeId}).map(([key,items])=>{const[dept,name,eid]=key.split('||');return{dept,name,employeeId:eid,employee:empMap.get(eid)||null,items}}).sort((a,b)=>a.dept.localeCompare(b.dept,'ko')||a.name.localeCompare(b.name,'ko'));const dateHist=sortTxDesc(state.data.transactions);const dateKey=ts=>{const x=new Date(ts);return `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}`};const dateGroups=groupBy(dateHist,t=>dateKey(t.createdAt)).map(([date,items])=>{const useTotal=items.filter(t=>t.type==='use'&&!voided.has(t.id)).reduce((s,t)=>s+num(t.amount),0);return{date,items,useTotal,count:items.length}});return{employees,empMap,active,filtered,total,homeGroups,voided,historyGroups,dateGroups}}

function screenHtml(d){if(state.screen==='history')return historyHtml(d);if(state.screen==='settings')return settingsHtml(d);return homeHtml(d)}
function statusPillsHtml(){const pills=[];if(!navigator.onLine)pills.push(`<span class="pill pill-offline">오프라인 — 장부는 계속 쓸 수 있어요</span>`);if(relayRegistered())pills.push(`<span class="pill pill-relay">공공기관 명단 받는 중</span>`);const n=num(state.inboxCount);if(relayRegistered()&&n>0)pills.push(`<button class="pill pill-alert" data-a="relay-inbox">📩 새 명단 신청 ${n}건 — 눌러서 확인</button>`);return pills.length?`<div class="pill-row">${pills.join('')}</div>`:''}
function quickActionsHtml(){return `<div class="quick-actions"><button class="quick-action" data-a="quick-find-emp"><span aria-hidden="true">👤</span> 직원 찾기</button><button class="quick-action" data-a="quick-history"><span aria-hidden="true">🕐</span> 이력 보기</button></div>`}
// 빈 화면은 "안내"로 끝내지 않고 바로 누를 수 있는 다음 행동(CTA)을 준다.
function homeHtml(d){const pills=statusPillsHtml();if(!d.filtered.length)return `${pills}<div class="card empty">${(state.search.trim()||state.deptFilter)?'검색 결과가 없습니다.<br><button class="btn" data-a="reset-filter" style="margin-top:12px">초기화</button>':'아직 올린 직원이 없어요.<br>공공기관에서 받거나 직접 올릴 수 있어요.<br><button class="btn-primary" data-a="guide-add-employee" style="margin-top:14px;min-height:56px;padding:0 22px;font-size:16px;font-weight:700">＋ 한 명씩 올리기</button>'}</div>`;const todayUse=state.data.transactions.filter(t=>t.type==='use'&&sameDay(t.createdAt,now())&&!d.voided.has(t.id)).reduce((s,t)=>s+num(t.amount),0);
// 그룹 헤더는 접힘/펼침 아코디언(설정의 toggle-dept와 같은 조작감, 상태는 홈 전용 키 state.homeExpanded).
// 자동 펼침: 그룹이 1개뿐 / 검색어·부서 필터가 켜져 있을 때(검색이 "안 되는 것처럼" 보이지 않게).
const forceOpen=!!(state.search.trim()||state.deptFilter)||d.homeGroups.length===1;
const groupsHtml=d.homeGroups.map(g=>{const open=forceOpen||!!state.homeExpanded[g.key];const balCls=g.totalBalance<0?'negative':g.totalBalance===0?'zero':'';
const body=!open?'':(g.subs?g.subs.map(s=>`${s.dept?`<div class="group-sub">${esc(s.dept)}</div>`:''}${s.items.map(empCard).join('')}`).join(''):g.items.map(empCard).join(''));
return `<div class="card group"><div class="group-head" data-a="toggle-home-group" data-g="${esc(g.key)}"${forceOpen?' data-forced="1"':''} role="button" tabindex="0" aria-expanded="${open?'true':'false'}"><div class="group-headline"><span class="group-toggle" aria-hidden="true">${open?'▼':'▶'}</span><div><div class="group-title">${esc(g.label)}</div><div class="group-meta">직원 ${g.count}명</div></div></div><div class="bal ${balCls}">${money(g.totalBalance)}</div></div>${body}</div>`}).join('');
const summary=`<div class="card summary"><div>오늘 사용 ${money(todayUse)}</div><div class="v">전체 잔액 ${money(d.total)}</div></div>`;
// 검색 결과가 딱 1명이면 그룹 헤더 없이 그 한 명만 크게 보여준다(손님 앞에서 동료 정보가 함께 보이지 않게).
// 이 화면은 손님에게 그대로 보여주는 용도이므로 가게 매출이 드러나는 요약 카드(오늘 사용·전체 잔액)도 함께 감춘다.
if(state.search.trim()&&d.filtered.length===1)return `${pills}${quickActionsHtml()}${soloEmpCard(d.filtered[0])}`;
return `${pills}${summary}${quickActionsHtml()}${groupsHtml}`}
// 확대 카드 — empCard와 같은 조작(사용·증표·이력)을 그대로 두고 크기만 키운다(크기는 .card.employee.solo CSS).
function soloEmpCard(e){const c=e.balance<0?'negative':e.balance===0?'zero':'';const initial=esc(Array.from(str(e.name))[0]||'?');return `<div class="card employee solo" style="display:flex;align-items:center;gap:12px"><div class="emp-avatar" aria-hidden="true">${initial}</div><div class="employee-main" data-a="history-for" data-id="${esc(e.id)}"><div class="name">${esc(e.name)}</div><div class="dept">${esc(orgDeptLabel(e)||'부서 없음')}${e.note?' · '+esc(e.note):''}</div></div><div class="bal ${c}" style="margin:0;white-space:nowrap">${money(e.balance)}</div><button class="small" data-a="receipt" data-id="${esc(e.id)}" aria-label="${esc(e.name)} 잔액증표 보기" title="잔액증표(명함)" style="flex:0 0 auto;min-width:48px;font-size:20px">🧾</button><button class="btn-primary" data-a="use" data-id="${esc(e.id)}" style="flex:0 0 auto">사용</button></div>`}
function empCard(e){const c=e.balance<0?'negative':e.balance===0?'zero':'';const initial=esc(Array.from(str(e.name))[0]||'?');return `<div class="card employee" style="display:flex;align-items:center;gap:12px"><div class="emp-avatar" aria-hidden="true">${initial}</div><div class="employee-main" data-a="history-for" data-id="${esc(e.id)}"><div class="name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.name)}</div><div class="dept" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(orgDeptLabel(e)||'부서 없음')}${e.note?' · '+esc(e.note):''}</div></div><div class="bal ${c}" style="margin:0;white-space:nowrap;font-size:20px">${money(e.balance)}</div><button class="small" data-a="receipt" data-id="${esc(e.id)}" aria-label="${esc(e.name)} 잔액증표 보기" title="잔액증표(명함)" style="flex:0 0 auto;min-width:44px;font-size:18px">🧾</button><button class="btn-primary" data-a="use" data-id="${esc(e.id)}" style="min-width:auto;padding:10px 16px;flex:0 0 auto">사용</button></div>`}
function historyHtml(d){if(state.historyTab==='employee')return historyByEmployee(d);return historyByDate(d)}
function historyByDate(d){if(!d.dateGroups.length)return '<div class="card empty">거래 이력이 없습니다.<br>홈 화면에서 직원을 골라 [사용]을 눌러 등록해 보세요.<br><button class="btn-primary" data-a="go-home" style="margin-top:14px;min-height:56px;padding:0 22px;font-size:16px;font-weight:700">홈으로 가기</button></div>';return d.dateGroups.map(g=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1.5px solid #eef1f4"><div class="name" style="font-size:16px">${esc(g.date)}</div><div style="font-size:12px;color:var(--muted)">${g.count}건${g.useTotal?` · 사용 ${money(g.useTotal)}`:''}</div></div><div class="list">${g.items.map(t=>txCardDate(t,d)).join('')}</div></div>`).join('')}
function txCardDate(t,d){const e=d.empMap.get(t.employeeId);const eName=e?e.name:'알 수 없음';const eDept=e?e.deptKey:'';const lbl={open:'등록',topup:'충전',use:'사용',void:'취소',adjust:'조정'}[t.type]||t.type;const isOut=t.type==='use';const isAdj=t.type==='adjust';const isV=d.voided.has(t.id);const adjNeg=isAdj&&num(t.amount)<0;const sign=isOut?'-':adjNeg?'':'+';const cls=isOut?'out':isAdj?'adjust':'in';const sig=t.signatureData?`<img class="thumb" src="${t.signatureData}" data-a="view-sign" data-id="${esc(t.id)}" alt="서명">`:'';const vb=t.type==='use'&&!isV?`<button class="small" data-a="void" data-id="${esc(t.id)}">이 사용 기록 취소</button>`:'';const vm=isV?'<span class="chip" style="background:var(--danger-soft);color:var(--danger)">취소됨</span>':'';const nt=t.note?`<span class="chip">${esc(t.note)}</span>`:'';const time=new Date(t.createdAt);const hm=String(time.getHours()).padStart(2,'0')+':'+String(time.getMinutes()).padStart(2,'0');return `<div class="txn" style="${isV?'opacity:.5':''}"><div class="txn-top"><div><div class="txn-title">${esc(eName)} <span style="font-weight:400;color:var(--muted);font-size:11px">${esc(eDept)} · ${esc(lbl)}</span></div></div><div class="amt ${cls}">${sign}${money(isAdj?t.amount:Math.abs(t.amount))}</div></div><div class="chips"><span>${hm}</span>${nt}${vm}${t.reason&&t.type!=='use'?`<span>${esc(t.reason)}</span>`:''}</div>${sig}${vb}</div>`}
function historyByEmployee(d){if(!d.historyGroups.length)return '<div class="card empty">거래 이력이 없습니다.<br>홈 화면에서 직원을 골라 [사용]을 눌러 등록해 보세요.<br><button class="btn-primary" data-a="go-home" style="margin-top:14px;min-height:56px;padding:0 22px;font-size:16px;font-weight:700">홈으로 가기</button></div>';return d.historyGroups.map(g=>{const emp=g.employee;const bal=emp?emp.balance:0;const canAdjust=emp&&!emp.isDeleted;return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="name">${esc(g.name)}<span class="dept" style="margin-left:8px">${esc(g.dept)}</span></div><div style="display:flex;align-items:center;gap:8px"><div style="font-size:22px;font-weight:800;color:var(--danger);white-space:nowrap">잔액 ${money(bal)}</div>${canAdjust?`<button class="small" data-a="adjust" data-id="${esc(g.employeeId)}">조정</button>`:''}</div></div><div class="list">${g.items.map(t=>txCard(t,d)).join('')}</div></div>`}).join('')}
function txCard(t,d){const lbl={open:'등록',topup:'충전',use:'사용',void:'취소',adjust:'조정'}[t.type]||t.type;const isOut=t.type==='use';const isAdj=t.type==='adjust';const isV=d.voided.has(t.id);const adjNeg=isAdj&&num(t.amount)<0;const sign=isOut?'-':adjNeg?'':'+';const cls=isOut?'out':isAdj?'adjust':'in';const displayAmt=isAdj?money(t.amount):money(Math.abs(t.amount));const sig=t.signatureData?`<img class="thumb" src="${t.signatureData}" data-a="view-sign" data-id="${esc(t.id)}" alt="서명">`:'';const vb=t.type==='use'&&!isV?`<button class="small" data-a="void" data-id="${esc(t.id)}">이 사용 기록 취소</button>`:'';const vm=isV?'<span class="chip" style="background:var(--danger-soft);color:var(--danger)">취소됨</span>':'';const nt=t.note?`<span class="chip">${esc(t.note)}</span>`:'';return `<div class="txn" style="${isV?'opacity:.5':''}"><div class="txn-top"><div class="txn-title">${esc(lbl)}</div><div class="amt ${cls}">${sign}${displayAmt}</div></div><div class="chips"><span style="font-size:14px;font-weight:600">${dt(t.createdAt)}</span>${nt}${vm}${t.reason&&t.type!=='use'?`<span>${esc(t.reason)}</span>`:''}</div>${sig}${vb}</div>`}
// 전화번호 등록/수정·삭제 + 문자 안내 동의 체크박스는 활성 직원에게만 노출(스펙 §수정3). 번호는 이 폰에만 저장되며 서버로 전송되지 않는다.
function phoneControlsHtml(e){const has=!!e.phone;return `<div class="phone-row"><button class="small" data-a="emp-phone-edit" data-id="${esc(e.id)}">${has?'번호 수정':'번호 등록'}</button>${has?`<button class="small" data-a="emp-phone-clear" data-id="${esc(e.id)}">번호 삭제</button>`:''}<label class="phone-consent${has?'':' disabled'}"><input type="checkbox" data-a="emp-phone-consent" data-id="${esc(e.id)}"${has?'':' disabled'}${e.phoneConsent?' checked':''}> 문자 안내 동의</label></div><div class="meta" style="font-size:10px">전화번호는 이 폰에만 저장되며 서버로 전송되지 않아요.</div>`}
function manageRow(e){return `<div class="row"><div class="left"><div class="txn-title">${esc(e.name)}${e.isDeleted?'<span class="hidden-badge">숨김</span>':''}</div><div class="meta">${esc(orgDeptLabel(e)||'부서 없음')} · 현재 잔액 ${money(e.balance)}</div>${e.note?`<div class="meta">${esc(e.note)}</div>`:''}${e.isDeleted?'':phoneControlsHtml(e)}</div><div class="right">${e.isDeleted?`<button class="small" data-a="restore-emp" data-id="${esc(e.id)}">복원</button>`:`<button class="small" data-a="edit-employee" data-id="${esc(e.id)}">수정</button><button class="small" data-a="topup" data-id="${esc(e.id)}">충전</button><button class="small" data-a="adjust" data-id="${esc(e.id)}">조정</button><button class="small" data-a="hide" data-id="${esc(e.id)}">숨김</button>`}</div></div>`}
function navHtml(){return `<div class="nav"><button class="${state.screen==='home'?'active':''}" data-a="screen" data-screen="home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>홈</button><button class="${state.screen==='history'?'active':''}" data-a="screen" data-screen="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>이력</button><button class="${state.screen==='settings'?'active':''}" data-a="screen" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>설정</button></div>`}

if(state.modal.type==='terms'){return `<div class="modal-back"><div class="modal"><h2>약관 동의</h2><p class="help">서비스를 계속 이용하려면 약관에 동의해 주세요. 한 번만 확인하면 됩니다.</p>${termsAgreeBlockHtml('terms-toggle','termsChk',false)}<div class="modal-actions"><button class="btn-primary" id="termsAgreeBtn" data-a="terms-agree" disabled>동의하고 시작</button></div></div></div>`}

if(state.modal.type==='topup'){const e=d.empMap.get(state.modal.id);if(!e)return '';return `<div class="modal-back"><div class="modal"><h2>추가 충전</h2><p class="help">${esc(e.name)} · 현재 잔액 ${money(e.balance)}</p><div class="form">${field('topupAmount','충전 금액','9000','예: 9000','number')}${field('topupReason','사유','','예: 추가 선입금')}</div><div class="modal-actions"><button class="btn" data-a="close-modal">취소</button><button class="btn-primary" data-a="save-topup">충전 저장</button></div></div></div>`}
if(state.modal.type==='adjust'){const e=d.empMap.get(state.modal.id);if(!e)return '';return `<div class="modal-back"><div class="modal"><h2>잔액 조정</h2><p class="help">현재 잔액은 ${money(e.balance)}입니다.</p><div class="form">${field('adjustBalance','새 잔액',String(e.balance),'예: 27000','number')}${field('adjustReason','조정 사유','','예: 장부 확인 후 정정')}</div><div class="modal-actions"><button class="btn" data-a="close-modal">취소</button><button class="btn-warn" data-a="save-adjust">조정 저장</button></div></div></div>`}
if(state.modal.type==='usage'){const e=d.empMap.get(state.modal.id);if(!e)return '';const smsPhone=state.modal.smsPhone||'';const smsBox=smsPhone?`<div class="field"><label>문자 안내 (선택)</label><div class="meta">${esc(formatPhone(smsPhone))}로 저장 직후 문자 앱이 자동으로 열립니다.<br>문자 앱이 열리면 <b>보내기</b>를 눌러 주세요(자동 발송은 되지 않습니다).</div></div>`:'';return `<div class="modal-back"><div class="modal"><h2>사용 등록</h2><p class="help">금액을 입력한 뒤 서명을 받고 저장하세요.</p><div class="receipt"><div class="receipt-row"><span>직원</span><strong>${esc(e.name)}</strong></div><div class="receipt-row"><span>소속·부서</span><strong>${esc(orgDeptLabel(e)||'부서 없음')}</strong></div><div class="receipt-row"><span>현재 잔액</span><strong style="font-size:24px;color:var(--primary)">${money(e.balance)}</strong></div></div><div class="form"><div class="field"><label>빠른 금액</label><div class="quick"><button data-a="fill-use" data-amount="9000">9,000원</button><button data-a="fill-use" data-amount="18000">18,000원</button><button data-a="fill-use" data-amount="27000">27,000원</button></div></div>${field('useAmount','사용 금액','','금액을 입력하세요','number')}${field('useNote','비고 (점심/저녁/특식 등)','','선택 입력')}${smsBox}<div class="field"><label>서명</label><div class="sig-box"><canvas id="signCanvas" class="signature"></canvas></div></div></div><div class="modal-actions"><button class="btn" data-a="clear-sign">서명 지우기</button><button class="btn" data-a="close-modal">취소</button><button class="btn-primary" data-a="save-use">서명 후 저장</button></div></div></div>`}
if(state.modal.type==='signature'){const t=state.data.transactions.find(v=>v.id===state.modal.id);if(!t||!t.signatureData)return '';const e=state.data.employees.find(v=>v.id===t.employeeId);return `<div class="modal-back"><div class="modal" style="text-align:center"><h2>서명 확인</h2><p class="help">${esc(e?e.name:'알 수 없음')} · ${dt(t.createdAt)} · ${money(t.amount)}</p><img src="${t.signatureData}" style="max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff" alt="서명"><div class="modal-actions"><button class="btn" data-a="close-modal">닫기</button></div></div></div>`}
if(state.modal.type==='store-search'){const results=state.modal.results||[];const emptyMsg=state.modal.regionFilteredOut?'이 지역에서는 찾지 못했습니다. 지역을 빼고 다시 검색해 보세요.':'검색 결과가 없습니다. 가게 이름을 바꿔보세요.';const list=results.length?results.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;gap:8px"><div style="min-width:0"><div style="font-weight:600">${esc(x.name)}</div><div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.address||'')}</div></div><button class="btn-primary small" data-a="relay-pick-store" data-id="${esc(x.restaurant_id)}" data-name="${esc(x.name)}" style="flex-shrink:0">이 가게</button></div>`).join(''):(state.modal.searched?`<div class="empty">${esc(emptyMsg)}</div>`:'');return `<div class="modal-back"><div class="modal"><h2>우리 가게 찾기</h2><p class="help">가게 이름으로 검색해 우리 가게를 선택하세요. 한 번만 등록하면 됩니다.</p><div class="form"><div class="field"><label>가게 이름</label><input id="storeName" placeholder="예: 정식김밥" value="${esc(state.modal.q||'')}"></div><div class="field"><label>지역(선택) — 예: 광진구 구의동</label><input id="storeRegion" placeholder="예: 광진구 구의동" value="${esc(state.modal.region||'')}"></div></div><div class="modal-actions"><button class="btn" data-a="close-modal">닫기</button><button class="btn-primary" data-a="relay-search-stores">${state.modal.searching?'검색 중…':'검색'}</button></div>${list?`<div style="margin-top:12px">${list}</div>`:''}</div></div>`}
if(state.modal.type==='inbox'){const items=state.modal.items||[];const body=items.length?items.map(it=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px"><div style="font-weight:700">${esc(combinedDeptLabel(it.summary.institution,it.summary.department))}</div><div class="meta">${esc(it.summary.restaurant_name||'')} · ${esc(it.summary.year_month||'')}</div><div style="margin:6px 0">총액 <b>${money(it.summary.total_amount)}</b> · ${num(it.summary.member_count)}명 <span class="meta">(승인 전에는 이름이 보이지 않습니다)</span></div><div style="display:flex;gap:8px"><button class="btn-primary" data-a="relay-approve" data-sid="${esc(it.summary_id)}">통장 확인 후 승인</button><button class="btn-danger" data-a="relay-reject" data-sid="${esc(it.summary_id)}">거절</button></div></div>`).join(''):'<div class="empty">대기 중인 신청이 없습니다.<br>공공기관에서 신청을 보내면 여기에 나타나요.</div>';return `<div class="modal-back"><div class="modal"><h2>공공기관 명단 신청 수신함</h2><p class="help">통장에서 입금자명·금액을 대조한 뒤 승인하세요. 승인 시에만 명단이 열립니다.</p>${body}<div class="modal-actions"><button class="btn" data-a="relay-inbox">새로고침</button><button class="btn" data-a="close-modal">닫기</button></div></div></div>`}
if(state.modal.type==='qr-scan'){return `<div class="modal-back"><div class="modal" style="text-align:center"><h2>QR(사각 코드)로 받기</h2><p class="help">담당자가 보여주는 QR(사각 코드)를 카메라로 비춰주세요. 서버를 거치지 않고 바로 등록돼요.</p><video id="qrVideo" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;aspect-ratio:3/4;object-fit:cover"></video><div class="modal-actions"><button class="btn" data-a="close-modal">취소</button></div></div></div>`}
if(state.modal.type==='csv'){const rows=state.modal.rows||[];const dupWarn=state.modal.dupWarn||0;const errs=rows.filter(r=>r.error).length;const newCount=rows.filter(r=>!r.error&&r.mode!=='topup').length;const topupCount=rows.filter(r=>!r.error&&r.mode==='topup').length;const sm=!rows.length?'':errs>0?`<div style="color:var(--danger);font-weight:700;margin:8px 0">❌ ${errs}건 오류 — 수정 후 다시 시도하세요</div>`:`<div style="color:var(--success);font-weight:700;margin:8px 0">✅ ${newCount?'신규 '+newCount+'명':''}${newCount&&topupCount?' + ':''}${topupCount?'기존 충전 '+topupCount+'명':''} — 등록 가능</div>`;const hasOrg=rows.some(r=>str(r.org));const tb=rows.length?`<div class="csv-preview"><table class="csv-table"><thead><tr><th>행</th>${hasOrg?'<th>소속</th>':''}<th>부서</th><th>이름</th><th>금액</th><th>상태</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.error?'err':''}" style="${r.mode==='topup'?'background:var(--warn-soft)':''}"><td>${r.line}</td>${hasOrg?`<td>${esc(r.org||'')}</td>`:''}<td>${esc(r.dept)}</td><td>${esc(r.name)}</td><td>${r.amount?money(r.amount):'-'}</td><td>${r.error||(r.mode==='topup'?'🔄 추가 충전':'✅ 신규')}</td></tr>`).join('')}</tbody></table></div>`:'';return `<div class="modal-back"><div class="modal"><h2>엑셀 명단(CSV) 불러오기</h2><p class="help">엑셀에서 저장한 CSV 파일을 불러와요. 첫 줄(제목 줄)에 부서, 이름, 금액 칸이 있어야 해요. <b>소속</b> 칸이 있으면 함께 읽어요(선택).<br>이미 등록된 직원은 금액이 추가로 충전돼요.</p>${sm}${dupWarn?`<div style="color:var(--warn,#b7791f);font-weight:700;margin:8px 0">⚠️ 동명이인 ${dupWarn}건 감지 — 구분 마커(·2, ·3 …)를 자동 부여했습니다. 표에서 확인하세요.</div>`:''}${tb}<div class="modal-actions"><button class="btn" data-a="close-modal">취소</button>${rows.length&&!errs?'<button class="btn-primary" data-a="exec-csv">등록하기</button>':'<button class="btn-secondary" data-a="pick-csv">파일 선택</button>'}</div></div></div>`}
if(state.modal.type==='receipt'){return receiptCardHtml(d)}
return ''}

// 잔액증표(명함형) — 표시 전용. 잔액은 derive() 결과만 사용(별도 계산 금지).
function receiptCardHtml(d){const e=d.empMap.get(state.modal.id);if(!e)return '';const shop=state.data.meta.shopName||APP;const od=orgDeptLabel(e);const who=od?`${esc(od)} ${esc(e.name)}님`:`${esc(e.name)}님`;const x=new Date(now());const dateStr=`${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}`;const integrityBad=state.modal.integrityOk===false||state.modal.crossOk===false;let balBlock;if(integrityBad){balBlock=`<div class="receipt-warn">장부에 이상이 있어 잔액을 표시할 수 없습니다.<br>설정 → 장부 검사를 확인하세요.</div>`}else{const neg=e.balance<0;balBlock=`<div class="receipt-bal${neg?' neg':''}">${money(e.balance)}${neg?'<div class="receipt-negnote">확인 필요</div>':''}</div>`}return `<div class="modal-back"><div class="modal receipt-modal"><div class="namecard"><div class="namecard-shop">${esc(shop)}</div><div class="namecard-body"><div class="namecard-who">${who}</div>${balBlock}</div><div class="namecard-foot"><div class="namecard-date">${dateStr}</div><div class="namecard-note">${esc(shop)} 전용 · 잔액 확인용 · 양도 불가</div></div></div><div class="modal-actions"><button class="btn" data-a="close-modal">닫기</button></div></div></div>`}

// 증표 열기 — 3중 안전장치: ①derive balance만 사용 ②해시체인 재검증 ③시간순 applyTx 누적 교차검증
// 잔액 표시 전 안전장치 ②③ — 해시체인 재검증 + 시간순 applyTx 누적 교차검증.
//   증표(사장님)와 손님 화면이 반드시 같은 판정을 쓰도록 헬퍼로 뽑았다(한쪽만 완화되는 일이 없게).
async function verifyBalanceFor(id){let integrityOk=true,crossOk=true;
try{const chain=await verifyChain();integrityOk=chain.ok}catch(err){console.error('balance verify',err);integrityOk=false}
try{const d=derive();const e=d.empMap.get(id);if(e){const txs=sortTxAsc(state.data.transactions.filter(t=>t.employeeId===id));const recomputed=txs.reduce((s,t)=>applyTx(s,t),0);crossOk=recomputed===e.balance}}catch(err){console.error('balance cross-check',err);crossOk=false}
return{integrityOk,crossOk}}
async function openReceipt(id){const{integrityOk,crossOk}=await verifyBalanceFor(id);state.modal={type:'receipt',id,integrityOk,crossOk};render()}
// 사용 모달 열기 — 홈의 [사용] 버튼과 손님 인계(A-full)가 같은 경로를 쓴다. 금액은 언제나 빈 칸으로 연다.
async function openUsageFor(id){const emp=state.data.employees.find(v=>v.id===id&&!v.isDeleted);if(!emp){render();return}
let smsPhone='';if(emp.phoneConsent&&emp.phone){try{smsPhone=await getPhone(emp)}catch(err){console.error('phone decrypt',err)}}
state.screen='home';state.modal={type:'usage',id,smsPhone};render()}

// ── 유휴 타이머: 자동 잠금(90초) · 손님 화면 자동 복귀(30초) · 모달 방치 상한(10분) ──
// 두 시계는 서로 배타적이다 — 잠금 해제 상태에서는 손님 복귀 타이머가, 잠금 상태에서는 자동 잠금 타이머가 절대 돌지 않는다.
// canAutoLockBase = 모달 여부만 뺀 자동 잠금 조건. 모달이 열려 있으면 90초에는 잠그지 않되(서명 중 잠김 방지)
//   10분 무조작이면 방치로 보고 모달째 잠근다 — 사용 모달(이름·잔액 노출)을 띄운 채 자리를 비우는 경우가 실제로 있다.
function canAutoLockBase(){return !!(state.loaded&&!state.pinLocked&&state.data.meta.setupComplete&&state.data.meta.pinHash&&!state.setupGuide&&!state.busy)}
function canAutoLock(){return canAutoLockBase()&&!state.modal}
function armIdle(){
if(idleTimer){clearTimeout(idleTimer);idleTimer=null}
if(!state.loaded)return;
if(state.pinLocked){
// 손님 화면 자동 복귀 — 앞 손님의 검색어·선택·호출 요청이 다음 손님에게 남지 않게 한다.
//   PIN 최초 설정·변경 중에는 돌아갈 손님 화면 자체가 없으므로 시계를 걸지 않는다.
if(!lockScreenActive()||!state.data.meta.pinHash||state.pinMode==='change')return;
// 복구 화면은 60초 활성화 게이트가 끝나고도 30초를 더 준다 — 게이트를 기다리는 동안 화면이 사라지면 사장님이 복구를 못 한다.
if(state.pinRecovery){idleTimer=setTimeout(()=>{if(state.pinLocked&&state.pinRecovery)backToCustomerIdle()},recoveryLeft()*1000+TIMERS.custIdle);return}
// ⚠️ PIN 화면(lockView==='pin')에는 **언제나** 시계를 건다. 길이만 두 가지다.
//   · 손님 흔적이 남아 있는 화면 — "사장님 확인"(handoff)이거나 인계 요청이 살아 있으면 30초(custIdle).
//     방치하면 앞 손님의 요청이 다음 손님에게 남는다(HIGH-3의 본체).
//   · 사장님이 [사장님용 잠금 해제]로 스스로 연 화면(owner) — 120초(ownerPinIdle).
//     예전에는 여기에 시계를 아예 걸지 않았다("4자리 고르는 도중 화면이 튀면 안 된다"). 그 대가가 컸다:
//       (a) 부분 입력된 PIN(예: 3자리)이 무기한 남아 다음 사람이 1자리만 맞히면 되는 상태가 된다(1/10),
//       (b) 손님이 [사장님용 잠금 해제]를 오탭하고 자리를 뜨면 태블릿이 PIN 패드에 영구 체류해
//           다음 손님의 셀프 조회가 막힌다(매뉴얼의 "늘 손님 화면" 약속 위반).
//     120초는 원래의 우려(입력 중 화면 튐)를 그대로 해소하면서 두 결함을 닫는다 — 4자리 입력에
//     2분이 걸리는 경우는 없고, 어떤 조작이든(키 입력 포함) 시계는 처음부터 다시 돈다.
//   만료 동작은 한 가지다: 손님 초기 화면 복귀 + 입력 중이던 PIN 폐기 + 손님 상태·인계 요청 폐기.
if(state.lockView==='pin'){
const pinIdleMs=(state.pinContext==='handoff'||state.pendingCustomerId)?TIMERS.custIdle:TIMERS.ownerPinIdle;
idleTimer=setTimeout(()=>{if(state.pinLocked&&state.lockView==='pin')backToCustomerIdle()},pinIdleMs);
return}
if(!(state.custQuery||state.custStage!=='search'||state.custSelectedId||state.pendingCustomerId))return;
idleTimer=setTimeout(()=>{resetCustomerState();render()},TIMERS.custIdle);
return}
// 자동 잠금 — 모달(서명 캔버스 포함)·저장 중·설정/안내 화면에서는 걸지 않는다(작업 중에 잠기면 안 된다).
if(canAutoLock()){idleTimer=setTimeout(()=>{if(canAutoLock())lockToCustomer()},TIMERS.autoLock);return}
if(canAutoLockBase()&&state.modal){idleTimer=setTimeout(()=>{if(canAutoLockBase()&&state.modal)lockToCustomer()},TIMERS.modalIdleCap)}}
// PIN 화면 방치 → 손님 초기 화면으로. 잠금은 절대 풀리지 않고, 앞 손님의 흔적(인계 요청 포함)은 전부 사라진다.
function backToCustomerIdle(){state.lockView='customer';state.pinContext='';state.pinInput='';state.pinMsg='';leaveRecovery();stopPinDelayTick();stopHandoffTtl();resetCustomerState();render()}
// 조작이 있으면 시계를 다시 시작한다. 캡처 단계라 어떤 핸들러가 이벤트를 막아도 반드시 실행된다.
['click','input','change','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,armIdle,true));

// ── 이벤트 ──
// 액션 디스패치 맵(스펙 §4 항목7): data-a 값 → 핸들러 함수. onClick은 조회만 담당.
const clickActions={
'go-home':()=>{state.screen='home';state.search='';state.deptFilter='';render()},
'reset-filter':()=>{state.search='';state.deptFilter='';render()},
'quick-find-emp':()=>{const i=qs('searchInput');if(i){i.focus();try{i.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}}},
'quick-history':()=>{state.screen='history';state.historyEmployeeId='';render()},
'screen':(el)=>{state.screen=el.dataset.screen||'home';if(state.screen!=='history')state.historyEmployeeId='';render()},
'add-employee':()=>{state.modal={type:'employee',mode:'add'};render()},
'edit-employee':(el)=>{state.modal={type:'employee',mode:'edit',id:el.dataset.id};render()},
'topup':(el)=>{state.modal={type:'topup',id:el.dataset.id};render()},
'adjust':(el)=>{state.modal={type:'adjust',id:el.dataset.id};render()},
'use':async(el)=>{await openUsageFor(el.dataset.id)},
'history-for':(el)=>{state.historyEmployeeId=el.dataset.id||'';state.historyTab='employee';state.screen='history';render()},
'history-tab':(el)=>{state.historyTab=el.dataset.tab||'date';if(state.historyTab==='date')state.historyEmployeeId='';render()},
'view-sign':(el)=>{state.modal={type:'signature',id:el.dataset.id};render()},
'receipt':async(el)=>{await openReceipt(el.dataset.id)},
'close-modal':()=>{state.modal=null;render()},
'fill-use':(el)=>{const i=qs('useAmount');if(i)i.value=el.dataset.amount||''},
'fill-open':(el)=>{const i=qs('empOpen');if(i)i.value=el.dataset.amount||''},
// 사용 모달 빠른 금액 — 한 번 눌러 채우고, 그대로 직접 수정할 수 있다(등록 모달의 fill-open과 같은 패턴).
'fill-use':(el)=>{const i=qs('useAmount');if(i)i.value=el.dataset.amount||''},
'pick-dept':(el)=>{const input=qs('empDept');if(input){input.value=el.dataset.dept||'';input.focus()}document.querySelectorAll('.dept-pick').forEach(c=>c.classList.toggle('on',c.dataset.dept===el.dataset.dept))},
'clear-sign':()=>{if(signPad)signPad.clear()},
'save-employee':async()=>{await saveEmployee()},

// ── 잠금 화면(손님 화면) 전용 액션 ─────────────────────────────────────────
// 전부 화면 전환·휘발성 상태 변경뿐이다. 이 중 어떤 것도 makeTx/repo.apply에 닿지 않는다.

// 손님 → 사장님 전환. 앞 손님의 검색·선택·조회 상태는 즉시 버린다(PIN 화면 뒤에 숨겨두지 않는다).
//   ⚠️ 인계 요청(pendingCustomerId/At)도 함께 버린다 — **요청은 handoff 경로에서만 유효하다**는 근본 방어다.
//   이걸 남기면 "owner 맥락 + 살아 있는 인계 요청"이라는 조합이 만들어지는데, 그 화면은 평범한
//   [비밀번호 입력]으로 보여서(사장님은 요청이 살아 있는 줄 모른다) 잠금 해제 순간 엉뚱한 사용 모달이 뜬다.
//   부작용: 사장님이 "사장님 확인" 화면에서 굳이 일반 잠금 해제로 갈아타면 인계가 사라진다.
//   그 전환은 실제로는 거의 없는 경로다(인계 화면에는 [사장님용 잠금 해제] 버튼 자체가 없고, 같은 자리의
//   [처음으로]도 어차피 요청을 버린다) — 드문 경로 하나를 잃는 대신 위 조합을 구조적으로 없앤다.
'lock-to-pin':()=>{state.lockView='pin';state.pinContext='owner';state.pinInput='';state.pinMsg='';state.custQuery='';state.custStage='search';state.custSelectedId='';state.custVerify=null;state.pendingCustomerId='';state.pendingCustomerAt=0;render()},

//   ⚠️ 인계 요청(pendingCustomerId)도 여기서 버린다 — "사장님 확인" 화면의 [처음으로]는 취소를 뜻한다.
'pin-to-cust':()=>{state.lockView='customer';state.pinContext='';state.pinInput='';state.pinMsg='';leaveRecovery();resetCustomerState();render()},
// 새로 고른 손님이 이전 인계 요청을 덮어쓴다 — 남겨두면 엉뚱한 사람의 사용 모달이 열린다.

'cust-confirm':async(el)=>{const id=str(el.dataset.id);const emp=state.data.employees.find(v=>v.id===id&&!v.isDeleted);if(!emp){resetCustomerState();render();return}
state.custSelectedId=id;state.custVerify=await verifyBalanceFor(id);state.custStage='self';render()},
// [아니요] — 검색어까지 지우고 처음 화면으로. 검색어를 남기면 결과가 1건일 때 같은 확인 카드가 다시 떠
//   손님이 빠져나갈 길이 없어진다(결과 1건이면 곧바로 확인 카드로 가는 규칙 때문).
'cust-cancel':()=>{resetCustomerState();render()},

// 사장님 인계 요청 — 기록이 아니라 "요청"이다(휘발성, 저장소에 남기지 않는다). 잠금은 유지된다.
//   손님이 폰을 건네는 그 동작이 곧 "사장님 차례"이므로 곧바로 PIN 화면("사장님 확인")을 띄운다.
//   앞 손님의 검색·조회 상태는 여기서 버린다(PIN 화면 뒤에 숨겨두지 않는다) — 남기는 것은 인계 요청뿐이고
//   그 요청의 수명은 TTL 120초와 이 화면의 30초 유휴 복귀가 함께 관리한다.
'cust-call-owner':()=>{const id=str(state.custSelectedId);const emp=state.data.employees.find(v=>v.id===id&&!v.isDeleted);if(!emp){resetCustomerState();render();return}
state.pendingCustomerId=id;state.pendingCustomerAt=now();
state.custQuery='';state.custStage='search';state.custSelectedId='';state.custVerify=null;
state.lockView='pin';state.pinContext='handoff';state.pinInput='';state.pinMsg='';render()}
};
// 잠금 상태에서 실행을 허용하는 액션 화이트리스트(구조적 보장).
//   여기 없는 data-a는 onClick 진입부에서 통째로 차단된다 — 숨은 파일 input·저장·차감·설정 등 모든 쓰기 경로 포함.
//   ⚠️ 이 목록에 원장을 쓰는 액션을 추가하지 말 것. 손님은 '요청'만 만들 수 있고 '기록'은 만들 수 없다.
const LOCK_ALLOWED=new Set(['pin-key','pin-reset','pin-forgot','pin-forgot-cancel','pin-forgot-restore','lock-to-pin','pin-to-cust','cust-pick','cust-confirm','cust-cancel','cust-clear','cust-back','cust-call-owner']);
async function onClick(e){const el=e.target.closest('[data-a]');if(!el)return;
if(lockScreenActive()&&!LOCK_ALLOWED.has(el.dataset.a))return;// 잠금 게이트 — 손님 화면에서 원장 쓰기 경로는 구조적으로 도달 불가
const fn=clickActions[el.dataset.a];if(fn)await fn(el)}
async function onInput(e){
// 잠금 중 입력은 손님 검색창 하나만 받는다(사장님 검색 state.search와 완전히 분리된 state.custQuery).
// 'change'는 받지 않는다 — 검색창이 화면에서 사라질 때 blur와 함께 change가 늦게 날아와
//   innerHTML 교체 도중 render를 재진입시킨다(그 렌더가 통째로 실패한다).
// 검색창에 글자를 치는 순간 = 새 손님이 시작한다는 뜻이다 → 앞 손님의 인계 요청은 여기서 버린다.
//   결과가 1건이면 [cust-pick] 없이 곧바로 확인 카드로 넘어가므로, 뿌리(입력)에서 지워야 엉뚱한 인계가 없다.
if(lockScreenActive()){if(e.target.id==='custSearchInput'&&e.type!=='change'){state.custQuery=e.target.value||'';state.custSelectedId='';state.custStage='search';state.custVerify=null;state.pendingCustomerId='';state.pendingCustomerAt=0;if(!composing)render()}return}
if(e.target.id==='searchInput'){state.search=e.target.value||'';if(!composing)render()}if(e.target.id==='deptFilterSelect'){state.deptFilter=e.target.value||'';render()}if(e.target.id==='historyFilter'){state.historyEmployeeId=e.target.value||'';render()}if(e.target.id==='regionSelectSetup'||e.target.id==='regionSelectSettings'){const isSettings=e.target.id==='regionSelectSettings';state.regionSelected=e.target.value||'';const region=selectedRegion();state.agencySelected=(region&&region.agencies&&region.agencies[0]&&region.agencies[0].id)||'';if(!state.deptCache[state.regionSelected]){setBusy('부서 목록을 불러오는 중입니다.');await ensureDeptsForRegion(state.regionSelected);clearBusy()}if(isSettings){try{await saveSelectedAgencyName()}catch(err){console.error(err)}}render();return}
if(e.target.id==='agencySelectSetup'||e.target.id==='agencySelectSettings'){state.agencySelected=e.target.value||'';if(e.target.id==='agencySelectSettings'){try{await saveSelectedAgencyName()}catch(err){console.error(err);toast('공공기관명 저장 오류');return}}render()}}

// ── CRUD ──
// 동일인 판정 키는 empMatchKey = "소속·부서 표시 라벨|이름"(돈이 어긋나는 유일한 경로 — 절대 좁히지 말 것).
// 화면에서 같아 보이는 직원 = 같은 직원. 레거시(org='', dept='기관명 부서명')와 신규 분리 저장은 라벨이 같아 동일인으로 묶인다.
async function saveEmployee(){const org=str(qs('empOrg')&&qs('empOrg').value),dept=str(qs('empDept')&&qs('empDept').value),name=str(qs('empName')&&qs('empName').value),note=str(qs('empNote')&&qs('empNote').value),t=now();if(!name){toast('직원명을 입력하세요.');return}if(state.modal.mode==='edit'){const old=state.data.employees.find(v=>v.id===state.modal.id);if(!old){toast('직원을 찾을 수 없습니다.');return}const key=empMatchKey({org,dept,name});const dup=state.data.employees.find(v=>v.id!==old.id&&!v.isDeleted&&empMatchKey(v)===key);if(dup){toast('같은 이름과 소속·부서의 활성 직원이 이미 있습니다.');return}const next={...old,org,dept,name,note,updatedAt:t};
// 소속·부서를 바꾸면 홈 그룹 분류 표식(orgKind)도 따라가야 한다 — 소속을 '개인'으로 바꿨는데 공공기관 부서 그룹에
//   그대로 남으면 사장님이 옮길 방법이 없다. 소속·부서가 그대로면 표식을 유지한다(자동 등록 이력 보존).

function validateRestoreData(data){const errors=[],warnings=[],empIds=new Set(),txIds=new Set(),allowed=new Set(['open','topup','use','void','adjust']);data.employees.forEach((e,i)=>{if(!e.id)errors.push(`직원 ${i+1}: ID 없음`);if(!e.name)errors.push(`직원 ${i+1}: 이름 없음`);if(empIds.has(e.id))errors.push(`직원 ID 중복: ${e.id}`);empIds.add(e.id)});data.transactions.forEach((t,i)=>{if(!t.id)errors.push(`거래 ${i+1}: ID 없음`);if(txIds.has(t.id))errors.push(`거래 ID 중복: ${t.id}`);txIds.add(t.id);if(!allowed.has(t.type))errors.push(`거래 ${i+1}: 알 수 없는 유형 ${t.type}`);if(!empIds.has(t.employeeId))errors.push(`거래 ${i+1}: 직원 참조 없음`);if(!Number.isInteger(num(t.amount)))errors.push(`거래 ${i+1}: 금액이 정수가 아님`);if(['open','topup','use','void'].includes(t.type)&&num(t.amount)<=0)errors.push(`거래 ${i+1}: 금액은 1원 이상이어야 함`);if(t.type==='adjust'&&num(t.amount)===0)warnings.push(`거래 ${i+1}: 조정 금액이 0원입니다.`)});data.transactions.forEach((t,i)=>{if(t.type==='void'&&t.targetTransactionId&&!txIds.has(t.targetTransactionId))errors.push(`거래 ${i+1}: 취소 대상 거래가 없습니다.`)});const balances=new Map();sortTxAsc(data.transactions).forEach((t,i)=>{const before=balances.get(t.employeeId)||0,after=applyTx(before,t);if(num(t.beforeBalance)!==before||num(t.afterBalance)!==after)warnings.push(`거래 ${i+1}: 저장된 전후 잔액과 재계산 잔액이 다릅니다.`);balances.set(t.employeeId,after)});return{errors,warnings}}

function initSignPad(){const canvas=qs('signCanvas');if(!canvas||canvas.dataset.ready==='1')return;const ctx=canvas.getContext('2d');const ratio=Math.max(window.devicePixelRatio||1,1),w=canvas.clientWidth||600,h=canvas.clientHeight||180;canvas.width=Math.floor(w*ratio);canvas.height=Math.floor(h*ratio);ctx.scale(ratio,ratio);canvas.dataset.ready='1';let drawing=false,empty=true;const paint=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#d7dde4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(16,h-32);ctx.lineTo(w-16,h-32);ctx.stroke()};const point=e=>{const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}};const start=e=>{e.preventDefault();drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};const move=e=>{if(!drawing)return;e.preventDefault();empty=false;const p=point(e);ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#1f2933';ctx.lineTo(p.x,p.y);ctx.stroke()};const end=()=>{drawing=false};paint();canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);canvas.addEventListener('mouseleave',end);canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);signPad={clear(){empty=true;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);paint()},isEmpty(){return empty},toDataUrl(){return empty?'':canvas.toDataURL('image/jpeg',0.5)}}}

// WebAuthn 생체 잠금 — 보수적 축소 구현: PRF 확장을 이용한 deviceSecret 추가 래핑은 검증 없이 도입 시

// ── 그룹 2: 장부 지키기 — 백업/열쇠 백업/복원/검사를 한곳에 모음 ──
// 등록은 했는데 열쇠 백업을 아직 안 한 상태는 위험 — 버튼에 경고 배지를 붙인다(B3).
const keyBackupNeeded=keyBackupUrgent();
const ledgerGroup=`<div class="card settings-card">
<div class="section-head"><div><div class="section-title">장부 지키기</div><div class="section-kicker">직원·거래 기록을 안전하게 보관하고 점검해요</div></div></div>
<div class="section-actions">
<button class="btn-secondary action-btn" data-a="export-safe"><span class="action-icon">↓</span><div><strong>장부 안전 저장</strong><span>현재 시점의 엑셀용 CSV와 복원용 데이터 파일을 함께 저장해요</span></div></button>
<button class="btn action-btn" data-a="export-key"><span class="action-icon">🔑</span><div><strong>내 열쇠 백업 (중요)${keyBackupNeeded?' <span class="badge-count">⚠️ 아직 안 함</span>':''}</strong><span>${keyBackupNeeded?'폰을 잃어버리면 열쇠 없이는 명단을 받을 수도, 등록을 해제할 수도 없어요. 지금 백업하세요.':'기기를 바꾸거나 잃어버려도 공공기관 신청을 받으려면 꼭 백업하세요'}</span></div></button>
<button class="btn action-btn" data-a="import"><span class="action-icon">↑</span><div><strong>저장한 데이터 불러오기(복원)</strong><span>안전 저장해둔 데이터 파일(JSON)로 되돌려요</span></div></button>
<button class="btn-secondary action-btn" data-a="verify-integrity"><span class="action-icon">✓</span><div><strong>장부 검사</strong><span>거래 기록에 이상이 없는지 쉬운 말로 확인해요</span></div></button>
</div>
${verifyResultHtml()}
</div>`;
// ── 장부 지키기 구역의 맨 아래: 폰 분실 대비 원격 백업 카드. 기관 등록 전에도 카드는 보이되, 실제 저장·불러오기는 등록 후에만 동작한다 ──
const autoCloudOn=state.data.meta.autoCloudBackup!==false;
const cloudVaultCard=`<div class="card settings-card">
<div class="section-head"><div><div class="section-title">📱 폰을 잃어버려도 장부 되찾기</div><div class="section-kicker">잠긴 채 보관돼서 서버도 열어볼 수 없어요</div></div></div>
<div class="meta" style="line-height:1.6">백업되는 것: 직원 명단(이름·부서·잔액), 거래 기록, 가게 정보. <b>전화번호와 열쇠는 백업되지 않아요.</b> 내용은 잠근 채 보관되어 서버도 열어볼 수 없어요.</div>
<label style="display:flex;align-items:center;gap:10px;margin-top:4px;cursor:pointer"><input type="checkbox" data-a="toggle-auto-cloud"${autoCloudOn?' checked':''} style="width:auto;min-height:auto;flex-shrink:0"><span style="font-size:13px;line-height:1.5"><b>월말 자동 백업(클라우드)</b><br>매달 말 잠긴 백업을 서버에 자동 보관해요</span></label>
${relayRegistered()?'':`<div class="meta" style="color:var(--muted)">${autoCloudOn?'우리 가게를 등록(자동 등록)하면 켜져요.':'자동 백업이 꺼져 있어요.'}</div>`}
${relayRegistered()?`<div class="meta" style="margin-top:8px">마지막 저장: ${esc(state.data.meta.lastCloudBackupAt?dt(state.data.meta.lastCloudBackupAt):'없음')}</div>
<div class="section-actions" style="margin-top:8px">
<button class="btn-primary action-btn" data-a="cloud-backup-now"><span class="action-icon">🔒</span><div><strong>지금 저장하기</strong><span>내용을 잠근 채로 서버에 보관해요</span></div></button>
<button class="btn action-btn" data-a="cloud-backup-restore"><span class="action-icon">↺</span><div><strong>새 폰에서 불러오기</strong><span>보관된 내용을 이 기기로 가져와요</span></div></button>
</div>`:`<div class="meta" style="margin-top:8px;color:var(--muted)">우리 가게를 등록(자동 등록)하면 쓸 수 있어요.</div>`}
</div>`;
// ── 그룹 3: 기본 설정 — 가게/부서/직원 정보, 비밀번호, 화면 관련 설정. 위험 동작은 접어서 아래로 ──
const basicGroup=`<div class="card settings-card">
<div class="section-head"><div><div class="section-title">기본 설정</div><div class="section-kicker">가게 정보</div></div></div>
<div class="inline-form"><input id="shopNameInput" type="text" value="${esc(state.data.meta.shopName||'')}" placeholder="음식점 이름을 입력하세요"><button class="btn-primary" data-a="save-shop">가게 저장</button></div>
${shopExtra}
</div>
<div class="card settings-card">
<div class="section-head"><div><div class="section-title">공공기관 부서 목록 관리</div><div class="section-kicker">직원을 등록할 때 부서를 고르는 추천 목록이에요. 공공기관을 선택하면 그 기관의 과 목록을 한 번에 채울 수 있어요.</div></div></div>
<div class="agency-current"><div><div class="meta">현재 공공기관</div><div class="agency-current-name">${esc(org)}</div></div><button class="small" data-a="edit-org">공공기관명 변경</button></div>
${agencyPickerHtml('settings')}
<div class="section-kicker">현재 사용 부서 ${depts.length}개</div>
<div class="dept-tags">${deptTags}</div>
<div class="inline-form"><input id="newDeptInput" type="text" placeholder="새 부서명 입력"><button class="btn-secondary" data-a="add-dept">추가</button></div>
</div>
<div class="card settings-card">
<div class="section-head"><div><div class="section-title">비밀번호(PIN)</div><div class="section-kicker">앱을 열 때 사용하는 4자리 비밀번호</div></div><button class="small" data-a="change-pin">변경</button></div>
${webauthnCardHtml()}
</div>
<div class="card settings-card">
<details><summary style="cursor:pointer;font-weight:800;font-size:15px;color:var(--danger)">위험 작업 — 전체 초기화</summary>
<div class="section-actions" style="margin-top:10px">
<button class="btn-danger action-btn" data-a="full-reset"><span class="action-icon">!</span><div><strong>전체 초기화</strong></div></button>
</div>
<div class="danger-note">전체 초기화 전에는 최종 백업 파일이 자동으로 생성됩니다.</div>
</details>
</div>`;
// ── 그룹 4(맨 아래): 앱 정보·법적 안내 ──
const infoGroup=`<div class="card stack"><div class="meta">저장 위치: 이 기기</div><div class="meta">마지막 백업: ${esc(state.data.meta.lastBackupAt?dt(state.data.meta.lastBackupAt):'없음')}</div><div class="meta">직원 수: ${d.active.length}명 (숨김 포함 ${d.employees.length}명)</div><div class="meta">거래 수: ${state.data.transactions.length}건</div><div class="meta">앱 버전: v${APP_VERSION}</div>
<div class="section-head" style="margin-top:6px"><div><div class="section-title" style="font-size:15px">앱 정보</div></div></div>
<div class="meta" style="line-height:1.6">이 앱은 결제·이체·정산 기능이 없으며 자금을 보관하지 않습니다. 선금은 공공기관·회사 등과 음식점 간 직접 거래이며, 이 앱은 장부 기록 도구입니다. 선금 기록은 등록된 해당 음식점 1곳에서만 사용됩니다. 장부 데이터는 이 기기에 저장되며, 클라우드 백업은 암호화되어 서버도 내용을 볼 수 없습니다. 선입금의 발행·차감·잔액 관리의 주체와 책임은 각 음식점에 있습니다.</div>
<div class="meta">데이터 출처: 음식점 검색 — 행정안전부 LOCALDATA 공공데이터</div>
<div class="meta" style="margin-top:8px">본 서비스는 무상으로 제공되며, 백업하지 않은 데이터의 복구와 서비스 중단·오류로 인한 손해를 보장하지 않습니다. 자세한 내용은 이용약관 제6조를 확인해 주세요.</div>
<div class="meta" style="font-size:11px">관련 문서: <a href="https://app.bapjangbu.com/docs/privacy.html" target="_blank" rel="noopener">개인정보처리방침</a> · <a href="https://app.bapjangbu.com/docs/terms.html" target="_blank" rel="noopener">이용약관</a></div>
<div class="meta" style="margin-top:8px;font-size:11px;color:#98a2b3;text-align:center">© 2026 밥장부(선입금대장) · 널마루. All rights reserved.</div></div>`;
return `${backupBanner()}${enrollGroup}${employeeCard}${contactCard}${ledgerGroup}${cloudVaultCard}${basicGroup}${infoGroup}`}

// ── Service Worker 등록 ──
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}

// ── 초기화 ──
async function init(){setBusy('저장소를 준비하는 중입니다.');repo=await makeRepo();if(!repo){clearBusy();qs('app').innerHTML='<div class="pin-screen"><div class="pin-icon" style="background:linear-gradient(135deg,var(--danger),#e74c3c)"><svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div><div class="pin-title">저장소 오류</div><div class="pin-sub">이 브라우저/기기에서 IndexedDB를 사용할 수 없습니다.<br><br>선입금대장은 안정적인 데이터 저장을 위해<br>IndexedDB가 필수입니다.<br><br><strong>해결 방법:</strong><br>① Chrome 최신 버전을 사용하세요<br>② 시크릿/사생활 모드가 아닌지 확인하세요<br>③ 브라우저 설정에서 저장공간을 확인하세요</div></div>';return}state.mode=repo.modeLabel;state.data=norm(await repo.loadAll());
// PIN 실패 횟수·입력 지연은 meta에서 되살린다 — 새로고침·앱 재시작으로 지연을 지울 수 없어야 한다(브루트포스 차단).
state.pinFails=num(state.data.meta.pinFails);state.pinDelayUntil=num(state.data.meta.pinDelayUntil);
try{await ensureKeyPair()}catch(e){console.error('keygen:',e)}detectWebauthn();detectQrSupport();await loadAgencyData(false);if(!state.data.meta.setupComplete&&(state.data.employees.length||state.data.transactions.length)){state.data.meta.setupComplete=true;await repo.apply({meta:{setupComplete:true}})}
// 1회성 마이그레이션(D1): 이 기능이 생기기 전에 설정을 마친 기존 사용자는 pending 플래그가 없어 등록 안내를 못 받는다.
if(state.data.meta.setupComplete&&!relayRegistered()&&state.data.meta.storeRegisterPending===undefined){state.data.meta.storeRegisterPending=true;try{await repo.apply({meta:{storeRegisterPending:true}})}catch(e){console.error('pending migration',e)}}
state.loaded=true;clearBusy();render();maybeMonthlyAutoBackup();refreshInboxCount()}
})();
</script>
