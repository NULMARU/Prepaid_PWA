<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>선입금대장</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--line:#e1e5ea;--text:#1b2838;--muted:#5f6d7e;--primary:#1a5276;--primary-soft:#e6f0f8;--primary-dark:#12405f;--primary-glow:rgba(26,82,118,.12);--danger:#c0392b;--danger-soft:#fef0ee;--warn:#c05621;--warn-soft:#fef6ee;--success:#0e7a46;--success-soft:#edf8f2;--surface-warm:#fff7ea;--balance-grad:linear-gradient(135deg,#174579,#1e6e94);--accent-bar:linear-gradient(180deg,var(--primary),#2874a6);--shadow:0 1px 4px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.03);--shadow-md:0 4px 12px rgba(15,23,42,.08);--shadow-lg:0 12px 32px rgba(15,23,42,.12);--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}body{min-height:100vh}button,input,select{font:inherit}button{border:none;cursor:pointer;border-radius:12px;min-height:52px;transition:transform .1s,opacity .12s}button:active{transform:scale(.97);opacity:.82}input,select{width:100%;min-height:52px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .2s}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-glow);outline:none}

/* ─── 레이아웃 ─── */
.app{max-width:900px;margin:0 auto;padding:16px 16px 90px}
.top{position:sticky;top:0;z-index:10;background:rgba(240,242,245,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 0 12px;border-bottom:1px solid rgba(225,229,234,.5)}
.title{display:flex;gap:10px;align-items:start;justify-content:space-between}
.title h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px;background:linear-gradient(135deg,var(--primary),#2874a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{margin-top:3px;color:var(--muted);font-size:12px;letter-spacing:.2px}
.tool{display:flex;gap:6px;flex-wrap:wrap}
.tool button{min-height:38px;padding:0 13px;font-size:13px;font-weight:700;border-radius:10px}
/* 홈 상단 [장부 저장] — 상시 노출(월간 배너 대체). 저장 시점(monthlyBackupDue)이면 강조색 + ⚠️ 배지가 붙는다. */
.tool .ledger-save.due{background:var(--warn-soft);border-color:#e8c9a0;color:#9c4413}
.tool .ledger-save .due-dot{margin-left:3px;font-size:12px}
/* [손님 셀프 조회] — 1탭으로 손님 화면(잠금)으로 넘어가는 버튼. 홈에서 가장 자주 쓰는 버튼이라 눈에 띄게 둔다. */
.tool .handoff{background:var(--primary);border-color:var(--primary);color:#fff}
/* 홈 필터 2행 — 1행은 검색창 전폭(폰에서도 300px+), 2행은 소속 필터 + 음성 검색 */
.home-filters{display:grid;gap:8px;margin-top:10px}
.home-filters .filter-row{display:flex;gap:8px}
.home-filters .filter-row>input,.home-filters .filter-row>select{flex:1 1 auto;min-width:0}
.home-filters .filter-row>button{flex:0 0 auto}

/* ─── 버튼 ─── */
.btn{background:#fff;border:1.5px solid var(--line);color:var(--text)}
.btn-primary{background:linear-gradient(135deg,var(--primary),#1e6fa1);color:#fff;border:none;box-shadow:0 2px 6px rgba(26,82,118,.2)}
.btn-secondary{background:var(--primary-soft);color:var(--primary);border:1.5px solid #ccdce8}
.btn-danger{background:var(--danger);color:#fff;border:none}
.btn-warn{background:var(--warn-soft);color:var(--warn);border:1.5px solid #e8c9a0}

/* ─── 카드 ─── */
/* grid-template-columns:minmax(0,1fr) — 그리드 항목의 최소 크기를 0으로 낮춰 긴 내용(카드·표·모달)이 폰 화면 밖으로 밀려나지 않게 한다(가로 스크롤·설정 탭 잘림·모달 버튼 미노출 동시 해결). 태블릿 렌더링은 동일. */
.stack{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid rgba(225,229,234,.7);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.banner{border-left:4px solid}
.banner-x{position:absolute;top:6px;right:6px;width:32px;min-width:32px;height:32px;min-height:32px;padding:0;border:none;background:transparent;color:var(--muted);font-size:15px;line-height:1;cursor:pointer}
.banner.warn{background:var(--surface-warm);border-left-color:var(--warn)}
.banner.error{background:var(--danger-soft);border-left-color:var(--danger)}
.settings-card{display:grid;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:2px}
/* word-break:keep-all — 한글 단어가 글자 단위로 끊기지 않게(문구 자체는 불변, 줄바꿈 위치만 개선). */
.section-title{font-size:20px;font-weight:800;line-height:1.25;color:var(--text);position:relative;padding-left:12px;word-break:keep-all}
.section-title::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:4px;border-radius:999px;background:var(--accent-bar)}
.section-kicker{font-size:12px;color:var(--muted);font-weight:700;line-height:1.5}
.section-actions{display:grid;gap:8px}
.action-btn{display:flex;gap:10px;align-items:flex-start;text-align:left;justify-content:flex-start;padding:13px 14px;min-height:58px}
.action-btn .action-icon{width:24px;flex:0 0 24px;text-align:center;font-size:17px;line-height:1.25}
.action-btn strong{display:block;font-size:15.5px;line-height:1.35}
.action-btn span{display:block;margin-top:2px;font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.45}
/* 진한 배경(파랑·빨강) 버튼 위에서는 설명·아이콘의 회색(var(--muted))이 거의 안 보인다 → 흰색 계열로 바꾼다. */
.action-btn.btn-primary span,.action-btn.btn-danger span,.action-btn.btn-primary .action-icon,.action-btn.btn-danger .action-icon{color:rgba(255,255,255,.9)}
/* 액션 버튼 안의 배지(신청 건수·⚠️ 아직 안 함)가 상속 폭/색에 눌려 깨지지 않게 한다. */
.action-btn .badge-count{display:inline-block;color:#fff;width:auto}
.inline-form{display:flex;gap:8px;align-items:center}
.inline-form input{min-width:0}
.inline-form button{flex:0 0 auto;min-width:84px}
.quick-add-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.quick-add-form input{flex:1 1 120px;min-width:100px}
.quick-add-form button{flex:0 0 auto;min-width:72px}
.phone-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.phone-consent{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);min-height:32px;padding:0 6px}
.phone-consent input{width:auto;min-height:auto;margin:0;accent-color:var(--primary)}
.phone-consent.disabled{opacity:.5}
.agency-current{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#fafbfd;border:1px solid var(--line);border-radius:10px}
.agency-current-name{font-size:17px;font-weight:800;color:var(--primary);line-height:1.3}
.dept-tags{line-height:2;max-height:140px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.danger-note{font-size:11px;color:var(--danger);line-height:1.5}
@media (max-width:520px){.section-head{display:grid}.inline-form{display:grid}.inline-form button{width:100%}.agency-current{align-items:flex-start}.action-btn{padding:12px}}

/* ─── 부서 그룹 ─── */
.group{display:grid;gap:8px}
/* 그룹 헤더는 탭하면 펼쳐지는 아코디언 — 폰 손가락 기준 48px 이상을 보장한다. */
.group-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 2px 8px;min-height:48px;border-bottom:1.5px solid #eef1f4;cursor:pointer;border-radius:8px;transition:background .15s}
.group-head:active{background:var(--primary-soft)}
.group-headline{display:flex;align-items:center;gap:8px;min-width:0}
.group-toggle{font-size:11px;color:var(--muted);width:16px;flex:0 0 16px;text-align:center}
.group-title{font-size:18px;font-weight:800;letter-spacing:-.2px;color:var(--primary)}
.group-meta{color:var(--muted);font-size:12px;font-weight:600}
/* 회사 그룹 안의 부서 소제목(하위 카테고리) */
.group-sub{font-size:13px;font-weight:800;color:var(--muted);padding:8px 2px 2px;letter-spacing:-.2px}

/* ─── 직원 카드 ─── */
.employee{display:grid;gap:10px}
.employee-main{cursor:pointer;border-radius:10px;padding:4px;margin:-4px;transition:background .15s}
/* 직원 카드 본문 폭 — 기존 인라인(flex:1;min-width:0)과 동일. CSS로 옮겨야 폰 2행 규칙(아래 미디어쿼리)이 인라인에 막히지 않는다. */
.card.employee .employee-main{flex:1;min-width:0}
.employee-main:active{background:var(--primary-soft)}
.name{font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.2px}
.dept,.meta,.note{color:var(--muted);font-size:12px;line-height:1.5}
.bal{margin-top:0;font-size:24px;font-weight:800;color:var(--primary);letter-spacing:-.5px}
.bal.zero{color:#a0aab4}
.bal.negative{color:var(--danger)}
/* 검색 결과가 딱 1명이면 그룹 헤더 없이 그 한 명만 크게 — 손님 앞에서 타인 정보가 함께 보이지 않는다. */
.card.employee.solo{padding:20px 18px;border:2px solid #ccdce8;box-shadow:var(--shadow-md)}
.card.employee.solo .emp-avatar{flex:0 0 56px;width:56px;height:56px;font-size:26px;border-radius:14px}
.card.employee.solo .name{font-size:26px!important;letter-spacing:-.4px}
.card.employee.solo .dept{font-size:14px!important}
.card.employee.solo .bal{font-size:34px!important}
.card.employee.solo [data-a="use"]{min-height:60px!important;padding:0 26px!important;font-size:18px;font-weight:800}
/* 직원 아바타 배지(장식) */
.emp-avatar{flex:0 0 42px;width:42px;height:42px;border-radius:10px;background:var(--primary-soft);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;line-height:1;letter-spacing:-.3px}
/* 홈 상태 pill(표시 전용) */
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1.35}
.pill-offline{background:#eef1f4;color:var(--muted)}
.pill-relay{background:var(--primary-soft);color:var(--primary)}
/* 📩 새 명단 신청 칩은 "누르는 것"이므로 손가락 크기(52px)와 읽히는 글씨(15px)를 보장한다. */
.pill-alert{background:var(--warn-soft);color:#9c4413;border:1.5px solid #e8c9a0;font-weight:800;min-height:52px;padding:12px 18px;font-size:15px;border-radius:999px}
.pill-alert:active{opacity:.85}
.badge-count{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;vertical-align:middle}
.notice-money{font-size:11.5px;line-height:1.6;color:var(--warn);background:var(--warn-soft);border:1px solid #e8c9a0;border-radius:10px;padding:8px 10px}
/* 홈 퀵액션(보조 버튼) */
.quick-actions{display:flex;gap:8px}
.quick-action{flex:1;min-height:48px;background:#fff;border:1.5px solid var(--line);color:var(--primary);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.quick-action:active{background:var(--primary-soft)}

/* ─── 요약/액션 ─── */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:100px;font-size:16px;font-weight:700}
.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;font-weight:700;padding:14px 16px;background:var(--balance-grad);color:#fff;border:none;border-radius:12px;margin-top:4px;box-shadow:0 6px 18px rgba(23,69,121,.22)}
.summary>div:first-child{opacity:.9}
.summary .v{color:#fff;font-size:22px;letter-spacing:-.3px;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:32px 16px;line-height:1.7;font-size:15px}

/* ─── 거래 이력 ─── */
.list{display:grid;gap:8px}
.txn{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid #f0f2f5}
.txn:last-child{border-bottom:none}
/* 거래 취소 버튼은 위험 동작이므로 넓이·색으로 분명히 구분한다(라벨은 "이 사용 기록 취소"). */
.txn>[data-a="void"]{justify-self:start;min-width:132px;color:var(--danger);border-color:#e8bdb7}
.txn-top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.txn-title{font-size:15px;font-weight:700;line-height:1.4}
.amt{font-size:20px;font-weight:800;white-space:nowrap;letter-spacing:-.3px}
.amt.in{color:var(--success)}
.amt.out{color:var(--danger)}
.amt.adjust{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{padding:3px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:11px}
.thumb{width:80px;height:44px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;transition:border-color .15s}
.thumb:active{border-color:var(--primary)}

/* ─── 직원 관리 행 ─── */
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eef1f4}
.row:last-child{border-bottom:0}
.row .left{flex:1;min-width:0}
.row .right{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.small{min-height:44px;padding:0 10px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:700;border-radius:8px}
/* .small이 .btn-primary 뒤에 와서 배경(흰색)을 덮어 "흰 글씨/흰 배경"이 되는 것을 막는다(같은 특이도 → 나중 규칙 승리). */
.btn-primary.small{background:linear-gradient(135deg,var(--primary),#1e6fa1);border:none;color:#fff}
.hidden-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;background:#eef1f4;color:var(--muted);font-size:11px;font-weight:700;margin-left:4px}

/* ─── 하단 탭 ─── */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;display:flex;background:rgba(255,255,255,.96);border-top:1px solid rgba(225,229,234,.8);box-shadow:0 -2px 8px rgba(15,23,42,.04);z-index:20;padding-bottom:env(safe-area-inset-bottom,0);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav button{flex:1;min-height:58px;border-radius:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:color .15s}
.nav button:active{transform:none;opacity:1}
.nav button.active{color:var(--primary)}
.nav button svg{width:22px;height:22px;stroke-width:2;fill:none;stroke:currentColor}

/* ─── 모달 ─── */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{width:min(100%,640px);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);padding:20px}
.modal h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.modal h2::after{content:"";display:block;width:34px;height:3px;margin-top:8px;border-radius:999px;background:var(--accent-bar)}
.modal[style*="text-align:center"] h2::after{margin-left:auto;margin-right:auto}
.help{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.form{display:grid;gap:12px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{font-size:16px;font-weight:700;background:var(--primary-soft);color:var(--primary);border:1.5px solid #ccdce8}
.receipt{display:grid;gap:6px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fafbfd;margin-bottom:12px}
.receipt-row{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.signature{width:100%;height:180px;display:block;background:#fff;touch-action:none}
.sig-box{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.namecard{aspect-ratio:1.58/1;min-height:200px;border-radius:18px;background:var(--balance-grad);color:#fff;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-lg);overflow:hidden}
.namecard-shop{font-size:16px;font-weight:800;letter-spacing:-.3px;opacity:.96}
.namecard-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:6px 0}
.namecard-who{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.3;word-break:keep-all}
.receipt-bal{font-size:42px;font-weight:900;letter-spacing:-1.2px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.receipt-bal.neg{color:#ffc2b8}
.receipt-negnote{font-size:14px;font-weight:800;margin-top:6px;color:#ffd7cf}
.receipt-warn{font-size:14px;font-weight:700;line-height:1.55;text-align:center;color:#fff;background:rgba(192,57,43,.6);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:12px 14px}
.namecard-foot{display:flex;flex-direction:column;gap:3px}
.namecard-date{font-size:12px;font-weight:700;opacity:.92}
.namecard-note{font-size:11px;font-weight:600;opacity:.85;letter-spacing:-.2px;word-break:keep-all}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal-actions button{flex:1;font-size:16px;font-weight:700}

/* ─── 토스트/로딩 ─── */
/* 토스트는 화면 위(주소창·상태 pill)와 겹치지 않게 하단 내비 위로 띄운다. */
.toast{position:fixed;left:50%;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 20px;border-radius:14px;background:rgba(27,40,56,.9);color:#fff;box-shadow:var(--shadow-lg);z-index:60;text-align:center;line-height:1.4;font-size:14px;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.65);z-index:70;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.busy>div{background:#fff;padding:24px 36px;border-radius:18px;box-shadow:var(--shadow-lg);font-size:16px;font-weight:700;text-align:center}

/* ─── CSV 미리보기 ─── */
.csv-preview{max-height:280px;overflow-y:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px}
.csv-table{width:100%;border-collapse:collapse;font-size:12px}
.csv-table th{background:var(--primary);color:#fff;padding:8px 10px;text-align:left;position:sticky;top:0;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.csv-table td{padding:7px 10px;border-bottom:1px solid #eef1f4}
.csv-table tr.err{background:var(--danger-soft)}
.csv-table tr.err td{color:var(--danger)}

/* ─── 부서 태그/선택 ─── */
.dept-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:600;margin:3px}
.dept-tag button{background:none;border:none;color:var(--danger);font-size:15px;min-height:auto;padding:0 2px;cursor:pointer;border-radius:0}
.dept-picks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;max-height:130px;overflow-y:auto}
.dept-pick{padding:5px 11px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.dept-pick.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.dept-pick:active{transform:scale(.95)}
.agency-tools{display:grid;gap:8px;margin-top:8px}
.agency-actions{display:flex;gap:8px;flex-wrap:wrap}
.agency-actions button{min-height:38px;font-size:12px;font-weight:700;flex:1}
.dept-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:6px;max-height:220px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fafbfd}
.dept-check{display:flex;gap:6px;align-items:center;min-height:44px;padding:5px 7px;border-radius:8px;background:#fff;font-size:13px;font-weight:700;color:var(--text);border:1px solid #eef1f4}
/* 체크박스는 손가락으로 정확히 누를 수 있는 크기로(기본 13px → 22px). */
.dept-check input{width:22px;height:22px;min-height:auto;margin:0;accent-color:var(--primary)}

/* ─── 직원 관리 아코디언 ─── */
.mgr-group{border-bottom:1px solid #eef1f4}
.mgr-group:last-child{border-bottom:none}
.mgr-head{display:flex;align-items:center;gap:8px;padding:11px 4px;cursor:pointer;font-weight:700;border-radius:8px;transition:background .15s}
.mgr-head:active{background:var(--bg)}
.mgr-toggle{font-size:10px;color:var(--muted);width:16px;text-align:center;flex-shrink:0}
.mgr-dept{font-size:14px;flex:1}
.mgr-count{font-size:12px;color:var(--muted);font-weight:600}
.mgr-body{padding:0 0 4px 20px}
/* 직원 목록 관리 카드 상단 요약(홈 하단에서 이 자리로 옮긴 "활성 직원 N명 · 잔액 합계") */
.mgr-summary{margin-top:0;font-size:14px;padding:12px 14px;box-shadow:0 4px 12px rgba(23,69,121,.16)}
.mgr-summary .v{font-size:19px}

/* ─── PIN 화면 ─── */
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(160deg,#f0f2f5 0%,#e6eaf0 100%)}
.pin-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#2874a6);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 4px 12px rgba(26,82,118,.25)}
.pin-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2}
.pin-title{font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text);letter-spacing:-.3px}
.pin-sub{font-size:13px;color:var(--muted);margin-bottom:28px;text-align:center;line-height:1.5}
/* "사장님 확인"(손님 인계) 화면의 대상 표시 — 긴 부서명·긴 이름에서도 화면 밖으로 나가지 않게 폭을 묶는다 */
.pin-ho{display:block;max-width:300px;margin:0 auto;font-size:15px;color:var(--text);word-break:keep-all;overflow-wrap:anywhere}
.pin-ho b{font-size:18px;font-weight:800}
.pin-ho-label{display:inline-block;margin-top:2px;font-size:12px;color:var(--muted)}
.pin-dots{display:flex;gap:14px;margin-bottom:32px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #c8ced6;background:#fff;transition:all .2s}
.pin-dot.filled{background:var(--primary);border-color:var(--primary);transform:scale(1.15)}
.pin-dot.error{background:var(--danger);border-color:var(--danger);animation:shake .3s}
.pin-pad{display:grid;grid-template-columns:repeat(3,68px);gap:10px;justify-content:center}
.pin-key{width:68px;height:68px;border-radius:50%;background:#fff;border:1px solid #dce0e6;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;min-height:auto;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .1s}
.pin-key:active{background:var(--primary-soft);border-color:var(--primary);transform:scale(.93)}
.pin-key.fn{background:transparent;border:none;font-size:14px;color:var(--muted);font-weight:600;box-shadow:none}
.pin-key.fn:active{background:var(--bg);transform:scale(.95)}
.pin-msg{margin-top:18px;font-size:13px;color:var(--danger);text-align:center;min-height:20px;font-weight:600}
.pin-reset{margin-top:20px;text-align:center}
.pin-reset button{min-height:auto;padding:8px 16px;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px}
.pin-delay{margin-top:16px;text-align:center;font-size:13px;font-weight:700;color:var(--danger);line-height:1.6;max-width:320px}
.pin-key[disabled]{opacity:.4}
/* ─── 잠금 화면 = 손님 화면 ─── */
/* 손님이 직접 만지는 유일한 화면이다. 여기서는 어떤 원장 쓰기도 일어나지 않는다(요청만 만들 수 있다). */
.cust-screen{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:22px 16px 28px;background:linear-gradient(160deg,#f0f2f5 0%,#e6eaf0 100%)}
.cust-head{text-align:center;margin-bottom:16px;width:100%;max-width:420px}
.cust-shop{font-size:15px;font-weight:800;color:var(--primary);letter-spacing:-.3px;word-break:keep-all}
.cust-title{font-size:24px;font-weight:900;letter-spacing:-.6px;margin-top:4px;color:var(--text);word-break:keep-all}
.cust-body{width:100%;max-width:420px;flex:1}
.cust-search{position:relative;display:flex;align-items:center}
.cust-search input{min-height:60px;font-size:19px;font-weight:700;padding:0 46px 0 16px;border-radius:14px;border:2px solid var(--primary);background:#fff;width:100%}
.cust-clear{position:absolute;right:6px;width:40px;min-width:40px;height:44px;min-height:44px;padding:0;border:none;background:none;color:var(--muted);font-size:18px}
.cust-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;word-break:keep-all}
.cust-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.cust-row{display:block;width:100%;text-align:left;min-height:64px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cust-row-label{font-size:12px;font-weight:700;color:var(--muted);line-height:1.4;word-break:keep-all}
.cust-row-name{font-size:21px;font-weight:800;letter-spacing:-.4px;color:var(--text);line-height:1.3;word-break:keep-all}
.cust-row.dup{background:#f7f8fa;border-style:dashed}
.cust-row.dup .cust-row-name{color:var(--muted)}
.cust-card{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:20px 18px;box-shadow:var(--shadow-lg);text-align:center}
.cust-ask{font-size:16px;font-weight:700;color:var(--muted);margin-bottom:12px}
.cust-label{font-size:14px;font-weight:700;color:var(--muted);line-height:1.5;word-break:keep-all}
.cust-name{font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:4px;line-height:1.25;word-break:keep-all}
.cust-bal{font-size:40px;font-weight:900;letter-spacing:-1.2px;color:var(--primary);margin:16px 0 4px;line-height:1.1}
.cust-warn{margin:16px 0;padding:12px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:15px;font-weight:700;line-height:1.6;word-break:keep-all}
.cust-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.cust-actions button{min-height:56px;font-size:17px;font-weight:800;border-radius:14px}
.cust-tx-title{margin-top:18px;padding-top:14px;border-top:1.5px solid #eef1f4;font-size:13px;font-weight:800;color:var(--muted);text-align:left}
.cust-txs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cust-tx{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;background:#fafbfd;border:1px solid var(--line)}
.cust-tx.voided{opacity:.55}
.cust-tx-label{font-size:14px;font-weight:800}
.cust-tx-date{font-size:11px;color:var(--muted);font-weight:600}
.cust-tx-right{text-align:right;flex-shrink:0}
.cust-tx-amt{font-size:16px;font-weight:800;white-space:nowrap}
.cust-tx-amt.out{color:var(--danger)}
.cust-tx-amt.in{color:var(--primary)}
.cust-chip{display:inline-block;font-size:10px;font-weight:700;color:var(--muted);background:#eef1f4;border-radius:6px;padding:2px 6px;margin-left:4px}
.cust-chip.void{background:var(--danger-soft);color:var(--danger)}
.cust-foot{margin-top:22px;text-align:center}
.cust-foot button{min-height:auto;padding:8px 16px;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
/* 폰: 빠른 금액은 3개를 한 줄에(세로로 길게 늘어져 스크롤되는 것 방지).
   모달 버튼은 column-reverse — 마지막에 오는 [서명 후 저장]이 맨 위(엄지 근처)로 온다. 순서만 바뀌고 DOM/문구는 불변. */
@media(max-width:640px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}.actions button,.modal-actions button{min-width:100%}.modal-actions{flex-direction:column-reverse}.summary,.txn-top,.receipt-row,.row,.group-head{display:grid}.group-head{min-height:56px;gap:2px}.tool{width:100%}.tool button{flex:1}.tool .handoff{flex:1 1 100%;min-height:44px}}
/* ─── 폰(≤640px) 직원 카드 2행 구성 ───
   1행: 아바타 + 이름/부서(줄바꿈 허용 — 이름은 절대 자르지 않는다)
   2행: 잔액(전액 표기 — 금전 원장이므로 축약 금지) + 증표 + 사용 버튼
   !important는 empCard()의 인라인 style(white-space:nowrap / font-size)을 이기기 위한 CSS-only 경로다. */
@media(max-width:640px){
  .card.employee{flex-wrap:wrap;row-gap:10px}
  .card.employee .employee-main{flex:1 1 calc(100% - 54px);order:1;min-width:0}
  .card.employee .name{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;word-break:keep-all;overflow-wrap:anywhere}
  .card.employee .dept{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;word-break:keep-all;overflow-wrap:anywhere}
  .card.employee .emp-avatar{order:0}
  .card.employee .bal{order:2;flex:1 1 auto;font-size:22px!important}
  .card.employee [data-a="receipt"]{order:3}
  .card.employee [data-a="use"]{order:4;min-height:48px}
}

/* ─── 초기 설정 ─── */
.setup{max-width:900px;margin:0 auto;padding:24px 16px 40px}
.setup-head{text-align:center;margin-bottom:24px}
.setup-head h1{font-size:22px;font-weight:800;margin:0 0 4px;background:linear-gradient(135deg,var(--primary),#2874a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;word-break:keep-all}
.setup-head p{color:var(--muted);font-size:13px;margin:0;line-height:1.6}
.setup-step{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;margin-bottom:12px}
.setup-selected{border:2px solid var(--primary);background:var(--primary-soft);border-radius:12px;padding:14px}
</style>

<body>
<div id="app"></div>
<input id="restoreFile" type="file" accept="application/json,.json" hidden>
<input id="csvFile" type="file" accept=".csv,.txt" hidden>
<input id="directTransferFile" type="file" accept="application/json,.json" hidden>
<script>
(()=>{
'use strict';
const APP='선입금대장',APP_VERSION='1.0.0-beta.19',DB='prepaid-ledger-db',VER=3,LOCAL='prepaid-ledger-local',now=()=>Date.now(),qs=i=>document.getElementById(i);
// ── 시간 상수(잠금 화면=손님 화면) ─────────────────────────────────────────
// 프로덕션 값은 여기 그대로 유지한다. 자동화 검증만 __prepaidTestHooks.TIMERS로 짧게 덮어쓴다
// (실제 대기 30초·90초를 e2e에서 그대로 기다릴 수 없기 때문 — 값 자체는 코드 상수로 남는다).
//   recoveryGate = [PIN을 잊으셨나요?] 화면의 파괴 버튼 활성화까지의 대기(잘못 누름 방지).
//   modalIdleCap = 모달을 열어둔 채 방치했을 때의 자동 잠금 상한(작업 중 즉시 잠김은 여전히 막는다).

//     무기한 남아 남은 탐색공간이 1/10로 줄고, (b) 손님이 오탭한 태블릿이 PIN 패드에 영구 체류해
//     "계산대 위 태블릿은 늘 손님 화면"이라는 매뉴얼 약속이 깨진다. 120초가 그 둘 사이의 값이다.
const TIMERS={custIdle:30000,autoLock:90000,pendingTtl:120000,pinDelay:60000,recoveryGate:60000,modalIdleCap:600000,ownerPinIdle:120000};
const DEFAULT_RELAY='https://prepaid-relay.sulsul-plus.workers.dev';

const PERSONAL_ORG='개인';
const DEFAULT_DEPTS=[];// 신규 설치 시 기본 부서 없음(스펙 수정1) — 기존 사용자의 저장된 부서 목록은 norm()에서 덮어쓰지 않음
const COMMON_DEPTS=[...DEFAULT_DEPTS];
// 손님 화면 상태(lockView 이하 6개)는 전부 휘발성이다 — IndexedDB·백업 JSON에 절대 기록하지 않는다.

const state={loaded:false,mode:'준비 중',screen:'home',search:'',deptFilter:'',historyTab:'date',historyEmployeeId:'',modal:null,toast:'',toastTimer:null,busy:'',expandedDepts:{},homeExpanded:{},pinLocked:true,pinInput:'',pinFails:0,pinMode:'',pinSetup1:'',pinMsg:'',pinRecovery:false,pinRecoveryAt:0,allowLockedRestore:false,pinDelayUntil:0,lockView:'customer',pinContext:'',custQuery:'',custStage:'search',custSelectedId:'',custVerify:null,pendingCustomerId:'',pendingCustomerAt:0,pendingExpired:false,backupConfirmed:false,setupStep:1,setupSelected:null,setupDepts:[],setupGuide:false,setupTermsAgreed:false,setupPickedStore:null,setupStoreQ:'',setupStoreRegion:'',setupStoreResults:[],setupStoreSearching:false,setupStoreSearched:false,setupStoreFilteredOut:false,inboxCount:null,storeBannerDismissed:false,keyBackupBannerDismissed:false,agencyData:null,agencyError:'',regionSelected:'',agencySelected:'',deptCache:{},webauthnAvailable:false,qrAvailable:false,data:{employees:[],transactions:[],meta:{lastBackupAt:null,orgName:DEFAULT_ORG,shopName:'',departments:[...DEFAULT_DEPTS]}}};
let repo,signPad=null,modalOpenKey=null,modalReturnFocus=null,modalKeydownHandler=null,qrStream=null,qrDetector=null,qrLoopActive=false;
// 유휴 타이머(자동 잠금·손님 화면 자동 복귀)와 PIN 지연 카운트다운 타이머 — init()이 위에서 먼저 돌기 때문에 선언은 여기 최상단에 둔다.
let idleTimer=null,pinDelayTimer=null,recoveryTimer=null,handoffTtlTimer=null;
document.addEventListener('click',onClick);document.addEventListener('input',onInput);document.addEventListener('change',onInput);qs('restoreFile').addEventListener('change',onRestoreFile);qs('csvFile').addEventListener('change',onCsvFile);qs('directTransferFile').addEventListener('change',onDirectTransferFile);
let composing=false;document.addEventListener('compositionstart',()=>{composing=true});document.addEventListener('compositionend',(e)=>{composing=false;onInput(e)});
// 온/오프라인 상태 pill 토글 — 상태 저장 없이 재렌더만(navigator.onLine을 직접 읽음)
window.addEventListener('online',()=>{if(state.loaded){render();refreshInboxCount()}});window.addEventListener('offline',()=>{if(state.loaded)render()});
document.addEventListener('keydown',function(e){if(e.key==='Enter'){if(e.target.id==='setupNewDept'){e.preventDefault();var b2=document.querySelector('[data-a="setup-add-dept"]');if(b2)b2.click()}if(e.target.id==='newDeptInput'){e.preventDefault();var b3=document.querySelector('[data-a="add-dept"]');if(b3)b3.click()}if(e.target.id==='setupManualName'||e.target.id==='setupManualAddr'||e.target.id==='setupManualTel'){e.preventDefault();var b4=document.querySelector('[data-a="setup-manual-save"]');if(b4)b4.click()}if(e.target.id==='setupStoreName'||e.target.id==='setupStoreRegion'){e.preventDefault();var b5=document.querySelector('[data-a="setup-store-search"]');if(b5)b5.click()}}});
// role="button"으로 만든 요소(홈 그룹 헤더 등)는 실제 <button>이 아니라서 브라우저가 Enter/Space를 눌러주지 않는다.

// ── 월 단위 백업 판정 (돈 데이터 — 안전 최우선). 모든 트리거(자동저장·배너·서버호출)는 monthHasActivity 게이트를 먼저 통과해야 한다 ──
function ymOf(ts){const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function curYm(){return ymOf(now())}
function prevYm(){const d=new Date(now());d.setDate(1);d.setMonth(d.getMonth()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
// 활동 게이트: 해당 연월(YYYY-MM)에 생성된 실제 장부 변동 거래가 1건이라도 있으면 true. 빈 달이면 어떤 백업 트리거도 실행되지 않는다.
function monthHasActivity(ym){return state.data.transactions.some(t=>ymOf(t.createdAt)===ym)}
function monthAlreadyBackedUp(ym){return str(state.data.meta.lastMonthlyBackup)===ym}
function isLastDayOfMonth(ts){const n=new Date(ts),t=new Date(ts);t.setDate(n.getDate()+1);return t.getMonth()!==n.getMonth()}
// 월말 시점 판정 — 백업이 필요한 연월(YYYY-MM) 문자열을 반환, 없으면 ''. 활동 0건·이미 백업한 달은 절대 반환하지 않는다.
function monthlyBackupDue(){
  // ① 지난달에 활동이 있는데 아직 백업 안 했으면 우선(월말에 앱을 안 열어 다음 달로 넘어간 경우 포함)
  const p=prevYm();
  if(monthHasActivity(p)&&!monthAlreadyBackedUp(p))return p;
  // ② 이번 달 말일(또는 그 이후)이고, 이번 달 활동이 있는데 미백업이면 이번 달
  const c=curYm();
  if(isLastDayOfMonth(now())&&monthHasActivity(c)&&!monthAlreadyBackedUp(c))return c;
  return '';
}
function daysAgoText(ts){if(!ts)return '아직 없음';const days=Math.floor((now()-ts)/86400000);return days<=0?'오늘':days+'일 전'}

// ── SHA-256 ──

// ── 거래 시각 발급기 (단조 증가·정수) ────────────────────────────────────────
// 해시 체인은 "만든 순서"대로 엮인다. 그런데 표시·정렬·검증은 createdAt으로 하므로,

// 멀쩡한 장부가 "체인 단절"로 오판됐다(옛 코드는 Date.now()+Math.random()으로 소수 시각을
// 뿌려 순서를 아예 무작위로 만들었다 — 실행마다 결과가 흔들리는 비결정적 버그).
// 이제 거래 시각은 오직 이 함수만 발급한다: 항상 정수, 항상 직전 발급값보다 크다.
// ⚠️ 새 거래의 createdAt을 이 함수 밖에서 만들지 말 것(Math.random()·Date.now() 직접 사용 금지).
var __txClock=0;   // var — 스크립트 평가 순서와 무관하게 안전하게 초기화되도록(TDZ 없음)
function seedTxClock(txs){let m=num(__txClock);(txs||[]).forEach(t=>{const v=Number(t&&t.createdAt);if(Number.isFinite(v)&&v>m)m=v});__txClock=Math.ceil(m)}
function nextTxTime(pref){let t=Number(pref);if(!Number.isFinite(t)||t<=0)t=now();t=Math.floor(t);if(t<=num(__txClock))t=num(__txClock)+1;__txClock=t;return t}

// ── 거래 정렬 기준 (잔액 계산·이력 표시·체인 검증 공용) ──────────────────────
// 1차 createdAt, 2차 id — 옛 장부에 남아 있는 동률·소수 시각에서도 순서가 흔들리지 않게 한다.
// ⚠️ 거래 순서를 쓰는 곳은 전부 이 비교자를 써야 한다(잔액·이력·검증이 서로 다른 순서를 보면 오판이 난다).
function cmpTxAsc(a,b){const d=num(a&&a.createdAt)-num(b&&b.createdAt);if(d)return d<0?-1:1;const x=str(a&&a.id),y=str(b&&b.id);return x<y?-1:x>y?1:0}

function sortTxAsc(list){return[...(list||[])].sort(cmpTxAsc)}

// ── tx 무결성 체인 (스펙 §4.3) ──
// 체인 꼬리 = "아무도 prevHash로 가리키지 않는" 해시. createdAt 최댓값이 아니다 —
// 옛 장부에는 소수·동률 createdAt이 섞여 있어 가장 늦은 시각이 실제 꼬리가 아닐 수 있고,
// 그 자리에 새 거래를 이으면 체인이 두 갈래로 갈라진다.
function chainTip(){const txs=state.data.transactions.filter(t=>t&&str(t.txHash));if(!txs.length)return '';const pointed=new Set();txs.forEach(t=>{const p=str(t.prevHash);if(p)pointed.add(p)});const tails=sortTxAsc(txs.filter(t=>!pointed.has(str(t.txHash))));const pick=tails.length?tails:sortTxAsc(txs);return str(pick[pick.length-1].txHash)}
function txHashOf(employeeId,amount,afterBalance,prevHash,createdAt){return hash(String(employeeId)+'|'+num(amount)+'|'+num(afterBalance)+'|'+(prevHash||'')+'|'+createdAt)}
// createdAt은 언제나 nextTxTime()이 발급한다 — 호출자가 배치 시작 시각(t)을 넘겨도
// 같은 밀리초면 자동으로 +1ms씩 밀려, 배치 안 거래들의 시간 순서 = 체인 연결 순서가 된다.

// 검증은 "저장된 시각 순서"가 아니라 "체인 연결(prevHash→txHash)" 자체를 따라간다.
//   ① 각 거래의 자기 해시 재계산 — 내용(직원·금액·잔액·시각)이 한 글자라도 바뀌면 즉시 잡힌다.
//   ② 각 거래의 prevHash가 실제로 존재하는(그리고 ①을 통과한) 거래를 가리키는지 — 중간 거래를
//      지우거나 바꾸면 그 뒤 거래의 연결이 끊겨 잡힌다.
// 시각 정렬에 의존하지 않으므로, 소수·동률 createdAt이 섞인 옛 장부(백업 복원 포함)에서도
// 멀쩡한 체인을 "단절"로 오판하지 않는다. createdAt은 표시·정렬용으로만 쓴다.
// (txHash가 없는 아주 옛 거래는 체인 밖 — 예전과 같이 legacy로 세고 검증에서 제외한다.)
async function verifyChain(){const txs=sortTxAsc(state.data.transactions);let checked=0;const broken=[],legacy=[],sound=[];

for(const t of sound){const p=str(t.prevHash);if(p&&!known.has(p))broken.push({id:t.id,reason:'체인 단절'})}

// ── 암호 모듈 (스펙 §4.1, §4.2) : RSA-OAEP 키페어 + AES-GCM 래핑 ──
function cryptoOk(){return !!(window.crypto&&window.crypto.subtle&&window.crypto.getRandomValues)}
function bufToB64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function b64ToBuf(b64){const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function randBytes(n){const u=new Uint8Array(n);crypto.getRandomValues(u);return u}

async function wrapPrivateKey(priv,passphrase){const pkcs8=bufToB64(await crypto.subtle.exportKey('pkcs8',priv));return aesEncryptStr(pkcs8,passphrase)}
async function unwrapPrivateKey(bundleStr,passphrase){const pkcs8=await aesDecryptStr(bundleStr,passphrase);return crypto.subtle.importKey('pkcs8',b64ToBuf(pkcs8),{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt'])}
async function ensureKeyPair(){if(!cryptoOk())return;const m=state.data.meta;let secret=m.deviceSecret;if(!secret)secret=bufToB64(randBytes(32));if(m.pubKey&&m.privKeyWrapped&&m.deviceSecret)return;const kp=await genKeyPair(),pubKey=bufToB64(await crypto.subtle.exportKey('spki',kp.publicKey)),privKeyWrapped=await wrapPrivateKey(kp.privateKey,secret),keyCreatedAt=now();await repo.apply({meta:{deviceSecret:secret,pubKey,privKeyWrapped,keyCreatedAt}});m.deviceSecret=secret;m.pubKey=pubKey;m.privKeyWrapped=privKeyWrapped;m.keyCreatedAt=keyCreatedAt}
async function getPrivateKey(){const m=state.data.meta;if(!m.privKeyWrapped||!m.deviceSecret)return null;try{return await unwrapPrivateKey(m.privKeyWrapped,m.deviceSecret)}catch(e){console.error('privkey unwrap',e);return null}}
async function getPhone(emp){if(!emp||!emp.phone||!state.data.meta.deviceSecret)return '';try{return await aesDecryptStr(emp.phone,state.data.meta.deviceSecret)}catch(e){console.error('phone decrypt',e);return ''}}
async function setPhone(empId,phoneRaw){const emp=state.data.employees.find(v=>v.id===empId);if(!emp)return;if(!state.data.meta.deviceSecret)await ensureKeyPair();const enc=phoneRaw?await aesEncryptStr(phoneRaw,state.data.meta.deviceSecret):'';const next={...emp,phone:enc,phoneConsent:!!phoneRaw,updatedAt:now()};await repo.apply({employees:[next]});upsertEmp(next)}
async function setPhoneConsent(empId,consent){const emp=state.data.employees.find(v=>v.id===empId);if(!emp||!emp.phone)return;const next={...emp,phoneConsent:!!consent,updatedAt:now()};await repo.apply({employees:[next]});upsertEmp(next)}
function formatPhone(v){const s=str(v).replace(/[^0-9]/g,'');if(s.length===11)return s.slice(0,3)+'-'+s.slice(3,7)+'-'+s.slice(7);if(s.length===10)return s.slice(0,3)+'-'+s.slice(3,6)+'-'+s.slice(6);return s}
// 개인키 암호화 백업 (스펙 STEP 12) — 사용자 passphrase로 래핑, 기기 분실 대비 별도 파일
async function exportKeyBackup(){if(!cryptoOk()){toast('이 브라우저는 열쇠 백업을 지원하지 않습니다.');return}const priv=await getPrivateKey();if(!priv||!state.data.meta.pubKey){toast('등록된 열쇠가 없습니다.');return}const pass=window.prompt('내 열쇠 백업 암호를 입력하세요 (분실 시 복구 불가).\n이 암호는 어디에도 저장되지 않습니다.','');if(pass===null)return;if(str(pass).length<8){toast('암호는 8자 이상이어야 합니다.');return}setBusy('내 열쇠 백업을 만드는 중입니다.');try{const pkBackup=await wrapPrivateKey(priv,pass),body={type:'prepaid-key-backup',v:1,appVersion:APP_VERSION,exportedAt:now(),pubKey:state.data.meta.pubKey,pkBackup};downloadFile(JSON.stringify(body,null,2),`선입금대장_내열쇠백업_${dateStamp()}.json`,'application/json');const myKeyBackedUpAt=now();state.data.meta.myKeyBackedUpAt=myKeyBackedUpAt;try{await repo.apply({meta:{myKeyBackedUpAt}})}catch(e2){console.error('key-backup flag save:',e2)}clearBusy();toast('내 열쇠 백업 파일을 저장했습니다.')}catch(e){console.error(e);clearBusy();toast('내 열쇠 백업 오류')}}

// '내 열쇠 백업'을 한 번도 받지 않았다면, 장부 백업만 믿고 있다가 기기 분실 시 신청을 못 받는 상황을 막기 위해 안내한다.

// SMS 안내 (스펙 §수정4) — 직원별 전화번호+동의가 모두 있을 때만, 차감 저장 직후 기기 문자앱을 sms: URI로 자동 오픈 시도한다.
// 웹 특성상 완전 자동 발송은 불가능하다(문자 앱에서 사장님이 '보내기'를 한 번 눌러야 실제 전송됨) — 화면 안내 문구로 이 한계를 명시한다.
// iOS는 'sms:번호&body=' , Android는 'sms:번호?body=' 형식을 쓴다. 데스크톱 등 미지원 환경에서는 조용히 생략하고 토스트만 띄운다.
function smsAppSupport(){const ua=(navigator.userAgent||'');return{ios:/iPad|iPhone|iPod/.test(ua),android:/Android/.test(ua)}}
async function maybeSendSms(emp,amount,after){
const fresh=state.data.employees.find(v=>v.id===emp.id)||emp;
if(!fresh.phoneConsent||!fresh.phone)return;
const{ios,android}=smsAppSupport();
if(!ios&&!android){toast('이 기기에서는 문자 앱을 자동으로 열 수 없어 문자 안내를 생략했습니다.');return}
const phone=await getPhone(fresh);
if(!phone)return;
const shop=state.data.meta.shopName||APP;
const body=`${shop} ${fresh.name}님 ${money(amount)} 사용, 잔액 ${money(after)}`;
const sep=ios?'&body=':'?body=';
const href='sms:'+phone.replace(/[^0-9+]/g,'')+sep+encodeURIComponent(body);
window.__lastSmsHref=href;// 자동화 검증용 훅(문자 앱 오픈 시도 기록) — 네트워크로 전송되지 않음, 이 기기 안에서만 사용

async function relayApprove(sid){if(!navigator.onLine){toast('인터넷 연결을 확인해 주세요.');return}const base=relayBase(),rid=str(state.data.meta.restaurantId);if(!base)return;const modal=state.modal;const item=(modal&&modal.items||[]).find(x=>x.summary_id===sid);if(!item)return;if(!item.ciphertext){toast('암호문이 없습니다.');return}if(!window.confirm(`${combinedDeptLabel(item.summary.institution,item.summary.department)}\n${item.summary.restaurant_name||''}\n총액 ${money(item.summary.total_amount)} · ${item.summary.member_count}명\n\n통장 입금을 확인하셨으면 승인하세요.`))return;setBusy('열어보는 중입니다.');try{const plain=await decryptBlob(item.ciphertext);if(!plain||!Array.isArray(plain.items))throw new Error('명단 형식 오류');const reHash=await batchHashOf(plain.items);if(reHash!==item.summary.batch_hash){clearBusy();window.alert('⚠️ 명단 확인값이 일치하지 않아 등록을 차단했습니다.\n전송 중 자료가 손상되었거나 변조되었을 수 있습니다.\n공공기관 담당자(서무)에게 다시 보내달라고 요청하세요.');return}assignDuplicateSuffix(plain.items);const t=now(),ym=str(item.summary.year_month),groupDept=combinedDeptLabel(item.summary.institution,item.summary.department);let tip=chainTip();const emps=[],txs=[],patches=[];const noteLabel=str(item.summary.institution)+' '+str(item.summary.department);const activeByKey=activeEmployeeIndex();let topupCount=0;const patchedIds=new Set();for(const it of plain.items){const rec={org:str(item.summary.institution),dept:str(it.dept),name:str(it.name)};const amt=num(it.amount);const exist=activeByKey.get(empMatchKey(rec));publicOrgPatchesForLabel(rec,patchedIds).forEach(pt=>patches.push(pt));if(exist){topupCount++;if(amt>0){const before=balanceOf(exist.id);const tx=await makeTx({employeeId:exist.id,type:'topup',amount:amt,beforeBalance:before,afterBalance:before+amt,reason:'공공기관 신청 승인 추가 충전',note:noteLabel,createdAt:t},tip);tip=tx.txHash;txs.push(tx)}continue}const eid=uid();emps.push({id:eid,org:rec.org,orgKind:'public',dept:rec.dept,name:rec.name,note:'',isDeleted:false,phone:'',phoneConsent:false,yearMonth:ym,createdAt:t,updatedAt:t});if(amt>0){const tx=await makeTx({employeeId:eid,type:'open',amount:amt,beforeBalance:0,afterBalance:amt,reason:'공공기관 신청 승인',note:noteLabel,createdAt:t},tip);tip=tx.txHash;txs.push(tx)}}if(topupCount){clearBusy();if(!window.confirm(`${groupDept}\n신규 ${emps.length}명 · 기존 충전 ${topupCount}명\n\n이미 등록된 직원은 새로 만들지 않고 금액을 더해요. 계속할까요?`)){render();return}setBusy('장부에 올리는 중입니다.')}await repo.apply({employees:emps.concat(patches),transactions:txs});emps.forEach(upsertEmp);patches.forEach(upsertEmp);txs.forEach(upsertTx);const authToken=await relayAuthToken();await fetch(base+'/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary_id:sid,status:'APPROVED',restaurant_id:rid,auth_token:authToken})});if(modal&&Array.isArray(modal.items)){modal.items=modal.items.filter(x=>x.summary_id!==sid);state.inboxCount=modal.items.length}clearBusy();render();refreshInboxCount();const totalAmt=txs.reduce((s,tx)=>s+num(tx.amount),0);window.alert(`✅ 등록 완료\n\n${groupDept}\n신규 ${emps.length}명 · 기존 충전 ${topupCount}명 · ${money(totalAmt)}이 장부에 추가됐어요.`);if(state.data.meta.pubKey&&window.confirm('장부 되찾기용 백업을 갱신할까요?\n(서버는 내용을 볼 수 없어요 — 잠금)'))await relayBackupNow()}catch(e){console.error(e);clearBusy();toast('승인 오류: '+(e.message||''))}}
// ── 직접 전달(파일·QR) 수신 — 서버를 거치지 않고 기관이 건넨 암호문을 그 자리에서 열어 장부에 등록 ──
// 계약(고정): {v:1, type:'direct-transfer', restaurant_id, restaurant_name, institution, department, year_month, summary:{total_amount, member_count, batch_hash}, ciphertext:{alg,encKey,iv,ct}}
function directTransferBatchHashes(){return Array.isArray(state.data.meta.receivedBatchHashes)?state.data.meta.receivedBatchHashes:[]}
async function markDirectTransferBatch(bh){if(!bh)return;const list=directTransferBatchHashes();if(list.includes(bh))return;const next=[...list,bh].slice(-300);state.data.meta.receivedBatchHashes=next;await repo.apply({meta:{receivedBatchHashes:next}})}
async function processDirectTransfer(parsed){
if(!parsed||typeof parsed!=='object'||parsed.type!=='direct-transfer'||!parsed.ciphertext||!parsed.summary){toast('이 파일(또는 QR 코드)은 선입금대장 전달 형식이 아닙니다.');return}
const rid=str(state.data.meta.restaurantId);
if(!rid){toast('먼저 우리 가게를 등록하세요.');return}
if(str(parsed.restaurant_id)!==rid){window.alert('이 파일은 다른 가게용입니다.\n우리 가게 앞으로 온 전달인지 담당자에게 확인해 주세요.');return}
const batchHash=str(parsed.summary.batch_hash);
if(batchHash&&directTransferBatchHashes().includes(batchHash)){window.alert('이미 등록한 명단입니다. (중복 전달)\n다시 등록할 필요가 없습니다.');return}
if(!window.confirm(`${str(parsed.institution)} · ${str(parsed.department)}\n총액 ${money(parsed.summary.total_amount)} · ${num(parsed.summary.member_count)}명\n\n통장 입금을 확인하셨으면 등록하세요. (직접 전달 — 서버를 거치지 않습니다)`))return;
setBusy('열어보는 중입니다.');
try{
const plain=await decryptBlob(parsed.ciphertext);
if(!plain||!Array.isArray(plain.items))throw new Error('명단 형식 오류');
const reHash=await batchHashOf(plain.items);
if(reHash!==batchHash){clearBusy();window.alert('⚠️ 명단 확인값이 일치하지 않아 등록을 차단했습니다.\n전송 중 자료가 손상되었거나 변조되었을 수 있습니다.\n공공기관 담당자(서무)에게 다시 보내달라고 요청하세요.');return}
assignDuplicateSuffix(plain.items);
const t=now(),ym=str(parsed.year_month),groupDept=combinedDeptLabel(parsed.institution,parsed.department);let tip=chainTip();const emps=[],txs=[],patches=[];
const noteLabel=str(parsed.institution)+' '+str(parsed.department);
// 승인(relayApprove)과 같은 규칙: 이미 있는 활성 직원은 새 카드 대신 충전한다(다음 달 재전달 시 동명 카드 누적 방지).
const activeByKey=activeEmployeeIndex();let topupCount=0;const patchedIds=new Set();
for(const it of plain.items){
const rec={org:str(parsed.institution),dept:str(it.dept),name:str(it.name)};
const amt=num(it.amount);
const exist=activeByKey.get(empMatchKey(rec));
// 승인과 동일: 같은 결합 라벨을 쓰는 활성 직원 전체를 함께 백필한다(명단에 빠진 동료가 다른 그룹으로 갈라지지 않게).
publicOrgPatchesForLabel(rec,patchedIds).forEach(pt=>patches.push(pt));
if(exist){topupCount++;if(amt>0){const before=balanceOf(exist.id);const tx=await makeTx({employeeId:exist.id,type:'topup',amount:amt,beforeBalance:before,afterBalance:before+amt,reason:'직접 전달 추가 충전',note:noteLabel,createdAt:t},tip);tip=tx.txHash;txs.push(tx)}continue}
const eid=uid();
emps.push({id:eid,org:rec.org,orgKind:'public',dept:rec.dept,name:rec.name,note:'',isDeleted:false,phone:'',phoneConsent:false,yearMonth:ym,createdAt:t,updatedAt:t});
if(amt>0){const tx=await makeTx({employeeId:eid,type:'open',amount:amt,beforeBalance:0,afterBalance:amt,reason:'직접 전달 등록',note:noteLabel,createdAt:t},tip);tip=tx.txHash;txs.push(tx)}
}
if(topupCount){clearBusy();if(!window.confirm(`${groupDept}\n신규 ${emps.length}명 · 기존 충전 ${topupCount}명\n\n이미 등록된 직원은 새로 만들지 않고 금액을 더해요. 계속할까요?`)){render();return}setBusy('장부에 올리는 중입니다.')}
await repo.apply({employees:emps.concat(patches),transactions:txs});
emps.forEach(upsertEmp);patches.forEach(upsertEmp);txs.forEach(upsertTx);
await markDirectTransferBatch(batchHash);
clearBusy();render();
const totalAmt=txs.reduce((s,tx)=>s+num(tx.amount),0);
window.alert(`✅ 등록 완료 (직접 전달)\n\n${groupDept}\n신규 ${emps.length}명 · 기존 충전 ${topupCount}명 · ${money(totalAmt)}이 장부에 추가됐어요.`);
if(state.data.meta.pubKey&&window.confirm('장부 되찾기용 백업을 갱신할까요?\n(서버는 내용을 볼 수 없어요 — 잠금)'))await relayBackupNow()
}catch(e){console.error(e);clearBusy();toast('등록 오류: '+(e.message||''))}
}
async function onDirectTransferFile(e){const file=e.target.files&&e.target.files[0];if(!file)return;if(lockScreenActive()){qs('directTransferFile').value='';return}// 잠금 중 파일 경로 차단(2중 안전장치)
try{const text=await file.text();const parsed=JSON.parse(text);await processDirectTransfer(parsed)}catch(err){console.error(err);toast('파일을 읽을 수 없습니다: '+(err&&err.message||''))}finally{qs('directTransferFile').value=''}}
// QR 스캔 — BarcodeDetector(qr_code) 지원 기기에서만 노출. 읽힌 텍스트는 파일 열기와 동일한 processDirectTransfer 경로를 공유
async function detectQrSupport(){try{if(!('BarcodeDetector' in window)){state.qrAvailable=false;return}const formats=await BarcodeDetector.getSupportedFormats();state.qrAvailable=Array.isArray(formats)&&formats.includes('qr_code')}catch(e){state.qrAvailable=false}if(state.loaded)render()}
function stopQrScan(){qrLoopActive=false;if(qrStream){try{qrStream.getTracks().forEach(tr=>tr.stop())}catch(e){}qrStream=null}const video=qs('qrVideo');if(video)video.dataset.ready=''}
async function qrScanLoop(video){while(qrLoopActive&&state.modal&&state.modal.type==='qr-scan'){try{const codes=await qrDetector.detect(video);if(codes&&codes.length){const text=codes[0].rawValue;qrLoopActive=false;stopQrScan();state.modal=null;render();await handleQrText(text);return}}catch(e){}await new Promise(r=>setTimeout(r,350))}}
async function initQrScan(){const video=qs('qrVideo');if(!video||video.dataset.ready==='1')return;video.dataset.ready='1';if(!state.qrAvailable||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){state.modal=null;render();toast('이 기기는 QR(사각 코드) 스캔을 지원하지 않아요. 담당자에게 파일로 받아 주세요.');return}try{qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}})}catch(err){console.error('camera',err);state.modal=null;render();toast('카메라를 사용할 수 없어요. 담당자에게 파일로 받아 주세요.');return}if(!state.modal||state.modal.type!=='qr-scan'){try{qrStream.getTracks().forEach(tr=>tr.stop())}catch(e){}qrStream=null;return}video.srcObject=qrStream;try{await video.play()}catch(e){}try{qrDetector=qrDetector||new BarcodeDetector({formats:['qr_code']})}catch(e){stopQrScan();state.modal=null;render();toast('이 기기는 QR(사각 코드) 스캔을 지원하지 않아요. 담당자에게 파일로 받아 주세요.');return}qrLoopActive=true;qrScanLoop(video)}
async function handleQrText(text){let parsed;try{parsed=JSON.parse(text)}catch(e){toast('QR 내용을 읽을 수 없습니다. 담당자에게 파일로 받아 주세요.');return}await processDirectTransfer(parsed)}

// 챌린지 인증(스펙 §서버 계약): /api/challenge 로 받은 RSA-OAEP 암호문을 내 개인키로 복호화해 auth_token 문자열 획득
async function relayAuthToken(){const base=relayBase(),rid=str(state.data.meta.restaurantId);if(!rid)throw new Error('가게가 등록되지 않았습니다.');const r=await fetch(base+'/api/challenge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({restaurant_id:rid})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.challenge_ct)throw new Error(j.error||'인증 챌린지 오류');const priv=await getPrivateKey();if(!priv)throw new Error('가게 열쇠가 없습니다');const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},priv,b64ToBuf(j.challenge_ct));return new TextDecoder().decode(raw)}
// 클라우드 원장 백업(암호화, 선택) — 기관 신청 blob과 동일한 하이브리드 구조(AES-256-GCM + RSA-OAEP 래핑), 서버는 평문을 볼 수 없음
// 전화번호는 이 기기(로컬)에만 저장 — 클라우드 백업(서버 전송 경로)에는 절대 포함하지 않는다. 로컬 JSON "장부 안전 저장" 파일에는 그대로 남지만, 그 파일은 기기 밖으로 나가지 않는 한 서버로 전송되지 않는다.
function stripPhonesForCloud(core){return{...core,payload:{...core.payload,employees:core.payload.employees.map(({phone,phoneConsent,...rest})=>rest)}}}
async function buildCloudBackupBlob(){if(!state.data.meta.pubKey)throw new Error('키가 없습니다.');const core=stripPhonesForCloud(backupCore());const plaintext=JSON.stringify(core);const aesRaw=randBytes(32);const aesKey=await crypto.subtle.importKey('raw',aesRaw,{name:'AES-GCM'},false,['encrypt']);const iv=randBytes(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},aesKey,new TextEncoder().encode(plaintext));const pub=await crypto.subtle.importKey('spki',b64ToBuf(state.data.meta.pubKey),{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);const encKey=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,aesRaw);return{encKey:bufToB64(encKey),iv:bufToB64(iv),ct:bufToB64(ct)}}
async function relayBackupNow(){if(!navigator.onLine){toast('인터넷 연결을 확인해 주세요.');return}if(!relayRegistered()){toast('먼저 우리 가게를 등록하세요.');return}setBusy('장부 되찾기용 백업을 만드는 중입니다.');try{const blob=await buildCloudBackupBlob();const blobB64=btoa(JSON.stringify(blob));if(blobB64.length>1000000){clearBusy();toast('장부 용량이 커서 백업을 만들 수 없어요.');return}const blobHash=await hash(blobB64);const rid=str(state.data.meta.restaurantId);const authToken=await relayAuthToken();const r=await fetch(relayBase()+'/api/ledger-backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({restaurant_id:rid,auth_token:authToken,blob:blobB64,blob_hash:blobHash})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'백업 실패');const at=now();state.data.meta.lastCloudBackupAt=at;await repo.apply({meta:{lastCloudBackupAt:at}});clearBusy();render();toast('장부를 안전하게 저장했어요.')}catch(e){console.error(e);clearBusy();toast('백업 오류: '+(e.message||''))}}
// 조용한 클라우드 백업 — buildCloudBackupBlob/relayAuthToken/relayBase를 그대로 재사용(새 서버 계약 없음). busy/toast 없이 성공 여부만 반환. 실패는 조용히 false.
async function relayBackupSilent(){try{if(!navigator.onLine||!relayRegistered()||!state.data.meta.pubKey)return false;const blob=await buildCloudBackupBlob();const blobB64=btoa(JSON.stringify(blob));if(blobB64.length>1000000)return false;const blobHash=await hash(blobB64);const rid=str(state.data.meta.restaurantId);const authToken=await relayAuthToken();const r=await fetch(relayBase()+'/api/ledger-backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({restaurant_id:rid,auth_token:authToken,blob:blobB64,blob_hash:blobHash})});if(!r.ok)return false;const at=now();state.data.meta.lastCloudBackupAt=at;await repo.apply({meta:{lastCloudBackupAt:at}});return true}catch(e){console.error('silent cloud backup',e);return false}}
// 월말 자동 클라우드 백업 트리거(앱 로드 시 1회). 활동 게이트·등록·토글을 모두 통과할 때만 서버를 호출한다. 실패해도 조용히 넘기고 배너로 유도.
async function maybeMonthlyAutoBackup(){try{if(state.data.meta.autoCloudBackup===false)return;if(!relayRegistered())return;if(!navigator.onLine)return;const due=monthlyBackupDue();if(!due)return;/*활동0·이미백업·월말아님이면 여기서 종료 → 서버 호출 없음*/const ok=await relayBackupSilent();if(ok){state.data.meta.lastMonthlyBackup=due;await repo.apply({meta:{lastMonthlyBackup:due}});render();toast('이번 달 장부를 안전하게 백업했어요.')}}catch(e){console.error('monthly auto backup',e)}}
async function relayRestoreFromCloud(){if(!navigator.onLine){toast('인터넷 연결을 확인해 주세요.');return}if(!relayRegistered()){toast('먼저 우리 가게를 등록하세요.');return}if(!window.confirm('보관된 내용으로 복원할까요?\n\n현재 기기의 장부가 백업 시점 내용으로 바뀌어요.'))return;setBusy('보관된 내용을 불러오는 중입니다.');try{const rid=str(state.data.meta.restaurantId);const authToken=await relayAuthToken();const r=await fetch(relayBase()+'/api/ledger-backup/get',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({restaurant_id:rid,auth_token:authToken})});if(r.status===404){clearBusy();toast('보관된 내용이 없어요.');return}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'복원 실패');if(j.blob_hash){const calc=await hash(j.blob);if(calc!==j.blob_hash){clearBusy();toast('백업 무결성 확인에 실패했습니다.');return}}const blob=JSON.parse(atob(j.blob));const core=await decryptBlob(blob);clearBusy();const ok=await restoreFromParsed(core);if(ok){const at=j.updated_at?(new Date(j.updated_at).getTime()||now()):now();state.data.meta.lastCloudBackupAt=at;await repo.apply({meta:{lastCloudBackupAt:at}});render()}}catch(e){console.error(e);clearBusy();toast('복원 오류: '+(e.message||''))}}

// ── UI ──
// 토스트는 사장님용 문구다 — 잠금(손님) 화면에서는 표시하지 않고 그냥 버린다(큐잉하지 않는다).
//   배경 작업(월간 자동 백업 등)이 손님 화면 위에 사장님용 안내를 띄우던 경로를 여기서 한 번에 막는다.
function toast(msg){clearTimeout(state.toastTimer);if(lockScreenActive()){state.toast='';return}state.toast=msg;render();state.toastTimer=setTimeout(()=>{state.toast='';render()},3000)}

// ⚠️ clearBusy는 반드시 render까지 한다 — 예전에는 상태만 지워서, 뒤에 render()가 없는 경로(복원 취소 등)에서
//   "저장 중" 오버레이가 화면에 남고 자동 잠금 타이머도 다시 무장되지 않았다. 이중 렌더는 무해하다(innerHTML 재구성).
