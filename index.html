function stopPinDelayTick(){if(pinDelayTimer){clearInterval(pinDelayTimer);pinDelayTimer=null}}

//   화면을 떠나 노드가 사라지면 타이머도 함께 멈춘다.
function schedulePinDelayTick(){if(pinDelayTimer)return;pinDelayTimer=setInterval(()=>{
const left=pinDelayLeft();

const el=qs('pinDelayLeft');if(!el){stopPinDelayTick();return}

// [PIN을 잊으셨나요?] 복구 화면의 파괴 버튼 활성화 게이트 — 화면 진입 시각 기준 60초.
function recoveryLeft(){if(!state.pinRecovery||!num(state.pinRecoveryAt))return 0;const left=num(state.pinRecoveryAt)+TIMERS.recoveryGate-now();return left>0?Math.ceil(left/1000):0}
function recoveryReady(){return !!(state.pinRecovery&&num(state.pinRecoveryAt)&&recoveryLeft()<=0)}
function stopRecoveryTick(){if(recoveryTimer){clearInterval(recoveryTimer);recoveryTimer=null}}
function scheduleRecoveryTick(){if(recoveryTimer)return;recoveryTimer=setInterval(()=>{
const left=recoveryLeft();
if(left<=0){stopRecoveryTick();if(state.loaded)render();return}
const el=qs('pinRecoveryLeft');if(!el){stopRecoveryTick();return}
el.textContent=String(left)},250)}
// 복구 화면을 떠날 때(취소·손님 화면·잠금 해제·초기화) 남는 것이 없도록 한자리에서 정리한다.
function leaveRecovery(){state.pinRecovery=false;state.pinRecoveryAt=0;state.allowLockedRestore=false;stopRecoveryTick()}

function pinRecoveryHtml(){
const left=recoveryLeft();
if(left>0)scheduleRecoveryTick();
const dis=left>0?' disabled':'';
const gate=left>0?`<div class="pin-delay">잘못 누름 방지를 위해 <span id="pinRecoveryLeft">${left}</span>초 후 활성화돼요.</div>`:'';
return `<div class="pin-screen"><div class="pin-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="pin-title">PIN을 잊으셨나요?</div><div class="pin-sub">아래 방법 중 하나를 선택하세요.</div>${gate}<div class="section-actions" style="width:100%;max-width:340px"><button class="btn-primary action-btn" data-a="pin-forgot-restore"${dis}><span class="action-icon">📁</span><div><strong>① 백업 파일로 복구</strong><span>저장해둔 백업 파일이 있으면 선택하세요. 데이터를 확인한 뒤 새 비밀번호를 설정합니다.</span></div></button><button class="btn-danger action-btn" data-a="pin-reset"${dis}><span class="action-icon">②</span><div><strong>백업 파일이 없어요</strong><span>모든 데이터를 지우고 처음부터 다시 시작합니다.</span></div></button></div><div class="pin-reset"><button data-a="pin-forgot-cancel">돌아가기</button></div></div>`}

async function handlePinKey(key){
if(pinDelayLeft()>0)return;// 5회 실패 후 입력 지연 중 — 어떤 키도 받지 않는다
if(key==='clear'){state.pinInput='';state.pinMsg='';render();return}
if(key==='back'){state.pinInput=state.pinInput.slice(0,-1);state.pinMsg='';render();return}
if(state.pinInput.length>=4)return;
state.pinInput+=key;state.pinMsg='';render();
if(state.pinInput.length<4)return;
const pin=state.pinInput;const hasPin=!!state.data.meta.pinHash;
const isSetup=!hasPin||state.pinMode==='change';
if(isSetup){
if(!state.pinSetup1){state.pinSetup1=pin;state.pinInput='';render();return}
if(state.pinSetup1!==pin){state.pinSetup1='';state.pinInput='';state.pinMsg='비밀번호가 일치하지 않습니다. 다시 설정하세요.';render();return}
await savePinHash(pin);
state.pinInput='';state.pinSetup1='';state.pinMode='';state.pinLocked=false;state.pinMsg='';state.pinContext='';leaveRecovery();await clearPinGuard();resetCustomerState();render();toast('비밀번호가 설정되었습니다.')
}else{
if(await verifyPin(pin)){state.pinInput='';state.pinLocked=false;state.pinMsg='';state.pinContext='';leaveRecovery();stopPinDelayTick();await clearPinGuard();maybeMonthlyAutoBackup();
// 손님 인계: 손님이 요청을 넘긴 직후(120초 이내)라면 그 직원의 사용 모달을 바로 연다.

//   · B([사장님 확인 받기]) = 금액·서명이 함께 넘어온다 → 프리필하되 **금액은 그대로 수정 가능**하다.
//     프리필은 "손님이 이렇게 요청했다"는 초안일 뿐이고, 확정하는 주체는 여전히 사장님이다
//     (저장은 기존 saveUse 경로 = 금액·전후 잔액 confirm을 반드시 거친다).
const pending=takePendingCustomer();resetCustomerState();
if(pending.id)await openUsageFor(pending.id,{amount:pending.amount,sign:pending.sign});
// 요청이 만료·폐기됐는데 아무 말 없이 홈이 뜨면 사장님이 "왜 안 열리지?" 하고 헤맨다 — 한 줄로 알린다.
else{render();if(pending.expired)toast('손님 확인 요청이 만료됐어요.')}}
else{state.pinFails++;state.pinInput='';state.pinMsg=`비밀번호가 틀렸습니다. (${state.pinFails}회)`;
if(state.pinFails>=5)state.pinDelayUntil=now()+TIMERS.pinDelay;
await savePinGuard();
render()}}}
// PIN 실패 횟수·지연 만료 시각은 meta에 영속한다 — 새로고침 한 번으로 지연이 사라지면 지연이 아니다.
async function savePinGuard(){const pinFails=num(state.pinFails),pinDelayUntil=num(state.pinDelayUntil);
state.data.meta.pinFails=pinFails;state.data.meta.pinDelayUntil=pinDelayUntil;
try{if(repo)await repo.apply({meta:{pinFails,pinDelayUntil}})}catch(e){console.error('pin guard save',e)}}
async function clearPinGuard(){state.pinFails=0;state.pinDelayUntil=0;await savePinGuard()}

// PIN 분실 복구 경로의 초기화도 설정 화면과 동일한 안내창 2회 확인으로 통일(스펙 §수정6)
// ⚠️ 이 경로는 서버의 우리 가게 등록을 **해제하지 않는다**(설정의 fullReset과 다른 점) — PIN 없이
//   손님도 누를 수 있는 화면이라 등록 해제까지 해주면 가게 가로채기·백업 소실 경로가 열린다.
//   이유 상세는 wipeDeregisterGate 주석 참조.
async function pinReset(){
// 잠금 화면에서 도달했다면 복구 화면의 60초 게이트를 반드시 통과했어야 한다(버튼 disabled와 별개인 2중 방어).

const ok=await confirmWipeWithBackup('PIN만 따로 초기화할 수는 없어요(보안).\n\n모든 장부·직원 기록이 지워집니다. 계속할까요?');
if(!ok)return;
setBusy('앱을 초기화하는 중입니다.');
try{await wipeLocalData();clearBusy();render();window.alert('✅ 초기화 완료\n\n모든 로컬 데이터가 삭제되었습니다. 새로 설정해 주세요.')}catch(err){console.error(err);clearBusy();toast('초기화 중 오류가 발생했습니다.')}}

// ══ 잠금 화면 = 손님 화면 ═════════════════════════════════════════════════
// 지도 원칙: "손님은 '요청'을 만들 수 있고 '기록'은 만들 수 없다."
//   이 화면의 어떤 경로도 makeTx/repo.apply에 닿지 않는다. 손님이 남길 수 있는 유일한 흔적은
//   휘발성 pendingCustomerId(사장님 인계 요청)뿐이며, 이는 저장소에 기록되지 않는다.
//   구조적 보장은 onClick/onInput의 LOCK_ALLOWED 게이트가 담당한다(핸들러 개별 검사에 의존하지 않는다).

// 인계 요청 폐기 — **한 자리**에서만 지운다.
//   B단계로 요청이 {대상, 금액, 서명} 3조각이 되면서, 어느 한 곳에서 대상만 지우고 금액·서명을 남기면
//   그 잔재가 다음 손님의 요청에 섞여 들어간다(엉뚱한 사람에게 앞 손님의 금액·서명이 붙는다 = 돈 사고).
//   그래서 요청을 버리는 모든 경로(유휴 복귀·[처음으로]·새 손님 입력·TTL 만료·잠금 해제 후 회수·lock-to-pin)는
//   반드시 이 함수 하나만 부른다. 필드를 늘릴 때도 여기만 고치면 모든 경로가 함께 따라온다.
function clearPendingRequest(){state.pendingCustomerId='';state.pendingCustomerAt=0;state.pendingAmount=0;state.pendingSign=''}
// 손님이 작성 중인 요청 내용(아직 사장님께 넘기지 않은 것) 폐기.
// 작성 중인 금액 폐기. 서명은 state가 아니라 캔버스에 있고, 화면이 바뀌는 순간 DOM과 함께 사라진다

function clearCustCompose(){state.custAmount=''}
// 손님 화면 상태 전부 폐기 — 자동 복귀·잠금 해제·[처음으로] 어디서든 같은 초기화를 쓴다.
function resetCustomerState(){state.custQuery='';state.custStage='search';state.custSelectedId='';state.custVerify=null;clearCustCompose();clearPendingRequest();state.pendingExpired=false}
// 사장님 인계 요청 회수(1회성). TTL(120초) 경과·직원 삭제/숨김이면 조용히 폐기하되, 폐기했다는 사실은 알려준다.
//   반환값 {id, expired, amount, sign} — id가 있으면 사용 모달을 열고(B단계면 금액·서명 프리필), expired면 한 줄 안내.
//   ⚠️ 금액·서명은 회수 즉시 state에서 사라진다. 여기서 돌려준 값의 수명은 "사용 모달이 열려 있는 동안"뿐이고,
//     기록이 되는 순간은 오직 사장님이 saveUse의 confirm을 눌렀을 때다(요청 ≠ 기록).
function takePendingCustomer(){const id=str(state.pendingCustomerId),at=num(state.pendingCustomerAt),preExpired=!!state.pendingExpired;
const amount=num(state.pendingAmount),sign=str(state.pendingSign);
clearPendingRequest();state.pendingExpired=false;
// 화면(handoffEmp)이 이미 만료를 판정해 요청을 버린 뒤일 수 있다 — 그 사실을 여기서 이어받는다.
if(!id)return{id:'',expired:preExpired,amount:0,sign:''};
if(!at||now()-at>TIMERS.pendingTtl)return{id:'',expired:true,amount:0,sign:''};
const emp=state.data.employees.find(v=>v.id===id&&!v.isDeleted);return emp?{id,expired:false,amount,sign}:{id:'',expired:true,amount:0,sign:''}}
// 잠금 해제 상태에서 손님 화면(잠금)으로 되돌리기 — 자동 잠금·[손님 셀프 조회] 공용.
//   pinFails/pinDelayUntil은 사장님이 인증을 마친 뒤에만 여기 오므로 함께 비운다(meta까지 영속).
function lockToCustomer(){state.pinLocked=true;state.lockView='customer';state.pinContext='';state.pinInput='';state.pinSetup1='';state.pinMsg='';leaveRecovery();stopPinDelayTick();state.modal=null;
clearTimeout(state.toastTimer);state.toast='';// 사장님용 토스트가 손님 화면으로 넘어가지 않게 한다
resetCustomerState();clearPinGuard();render()}
// 손님 화면을 띄울 수 있는 조건 — PIN이 없거나(최초 설정) 변경 중이면 절대 띄우지 않는다.
// 잠금 화면이 실제로 떠 있는 상태인가. ⚠️ pinLocked는 온보딩 중에도 true다(설정 화면이 먼저 렌더된다)

function lockScreenActive(){return !!(state.loaded&&state.data.meta.setupComplete&&state.pinLocked)}
function customerViewAllowed(){return !!state.data.meta.pinHash&&state.pinMode!=='change'&&!state.pinRecovery}

// 동명이인 병합 판정 — assignDuplicateSuffix()가 붙이는 구분 마커 '·2','·3'…을 떼어 기본 이름으로 묶는다.
// ⚠️ 옛 규칙(이름 끝 라틴 소문자 1글자)은 Alex/Alec 같은 서로 다른 사람을 "동명이인"으로 오병합해 둘 다 조회를 막았다.

function custDupBase(name){return str(name).replace(/·\d+$/,'')}
function custDupKey(e){const label=orgDeptLabel(e)||'부서 없음';const b=custDupBase(e&&e.name);return b?JSON.stringify([label,b]):''}
// 손님 검색 결과 행 만들기. 질의가 비면 아무도 내보내지 않는다(명단 0명 — 손님에게 전체 명단을 보여주지 않는다).
// ⚠️ 매칭은 **접두 일치**(nameStartsWith)다 — 사장님 홈 검색(부분 일치)과 규칙이 다르다. 위 매처 주석 참조.
function custRows(active,q){
if(!str(q))return[];
const groups=new Map();
active.forEach(e=>{const k=custDupKey(e);if(!k)return;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)});
const merged=new Map();groups.forEach((list,k)=>{if(list.length>=2)merged.set(k,list)});
const rows=[],seen=new Set();
active.forEach(e=>{const label=orgDeptLabel(e)||'부서 없음';const k=custDupKey(e);
if(k&&merged.has(k)){if(seen.has(k))return;const list=merged.get(k);if(!list.some(v=>nameStartsWith(v.name,q)))return;seen.add(k);rows.push({dup:true,label,name:JSON.parse(k)[1],count:list.length});return}
if(!nameStartsWith(e.name,q))return;
rows.push({dup:false,id:e.id,label,name:e.name})});
return rows}
function custRowHtml(r){
if(r.dup)return `<div class="cust-row dup" aria-disabled="true"><div class="cust-row-label">${esc(r.label)}</div><div class="cust-row-name">${esc(r.name)} (동명이인 ${r.count}명) — 사장님께 말씀해 주세요</div></div>`;
return `<button class="cust-row" data-a="cust-pick" data-id="${esc(r.id)}"><div class="cust-row-label">${esc(r.label)}</div><div class="cust-row-name">${esc(r.name)}</div></button>`}
// 최근 거래 슬림 행 — 손님 화면 전용. 서명 이미지는 띄우지 않고(옆 손님에게 남의 서명이 보이면 안 된다) 취소 버튼도 없다.
function custTxHtml(t,voided){
const lbl={open:'등록',topup:'충전',use:'사용',void:'취소',adjust:'조정'}[t.type]||t.type;
const isOut=t.type==='use',isAdj=t.type==='adjust',isV=voided.has(t.id);

// ══ B단계: 손님이 금액·서명까지 미리 작성하는 '요청' ══════════════════════════
// 원칙은 A단계와 조금도 다르지 않다 — 손님이 만드는 것은 끝까지 '요청'이고, 원장에 남는 '기록'은 사장님만 만든다.
//   이 화면들이 남기는 것은 휘발성 state(custAmount → pendingAmount·pendingSign)뿐이며
//   IndexedDB·서버·백업 어디에도 쓰이지 않는다. 저장은 오직 사장님 PIN 해제 → 사용 모달 → saveUse(confirm 포함)뿐이다.

//     실제 차감 방어선은 saveUse의 잔액 검사 그대로다 — 이 화면을 건너뛰어도 초과 차감은 뚫리지 않는다.
function custAmountCheck(bal){
const raw=str(state.custAmount);
if(!raw)return{amount:0,err:'',ok:false};
const n=parseWon(raw);
if(isNaN(n)||n<=0)return{amount:0,err:'1원 이상의 숫자만 넣을 수 있어요.',ok:false};
if(n>num(bal))return{amount:n,err:'잔액보다 많아요. 사장님께 말씀해 주세요.',ok:false};
return{amount:n,err:'',ok:true}}
// 금액 화면의 "말"만 만든다 — 이 두 조각(#custAmtBal·#custAmtErr)만 부분 갱신 대상이다.
// beta.44(사용자 지시): 손님 화면의 금액 안내는 **한 줄**이다 — "잔액 N원이 남아있어요".

//     (a) 포커스된 입력 노드가 DOM에서 제거되는 순간 소프트키보드의 입력 연결이 끊긴다 → 키보드가 닫힌다.
//     (b) 한글 IME는 음절이 확정될 때 compositionend → compositionstart → input 이 **한 키에서** 흐른다.
//         앱이 compositionend 안에서 노드를 갈아치우면 그 키의 나머지 이벤트는 이미 떨어져 나간 옛 노드로
//         들어간다 → 화면의 입력창에는 그 글자가 영영 안 찍힌다("스마트폰에서 입력이 안 된다"의 정체).
// 해결: 검색 단계에서는 결과 영역(#custResults)만 교체한다. 입력창 노드는 손님이 타이핑하는 내내 살아 있다.
//   화면 자체가 바뀌는 순간(결과 1명 → 확인 카드)에만 false를 돌려 호출자가 전체 render를 하게 한다.
//   ⚠️ 조합 중(composing)에는 절대 전체 render로 넘기지 않는다 — 조합 중 노드 교체가 곧 입력 유실이다.
//   다른 화면의 렌더 계약은 건드리지 않는다(이 함수는 잠금·손님·검색 단계에서만 동작한다).
function custSearchPatch(){
if(!(lockScreenActive()&&state.lockView==='customer'&&customerViewAllowed()))return false;
if(state.custSelectedId||state.custStage!=='search')return false;
const box=qs('custResults'),input=qs('custSearchInput');
if(!box||!input)return false;
const q=str(state.custQuery),rows=custRows(derive().active,q);
if(!composing&&rows.length===1&&!rows[0].dup)return false;
box.innerHTML=custResultsHtml(rows,q);
syncCustClear(q);
return true}

// ── 금액 입력 부분 갱신 (beta.21 → beta.22 통합 화면으로 확장) ──────────────
// 검색창과 똑같은 이유로 여기서도 전체 render를 부르지 않는다: 금액을 치는 동안 #custAmountInput 노드가
//   교체되면 폰의 숫자 키보드가 닫히고(이미 beta.20에서 한 번 겪은 사고) 손님은 "입력이 안 된다"고 느낀다.
//   → 큰 숫자·잔액 안내·오류 한 줄, 이 세 조각의 텍스트만 갈아끼운다. 입력 노드는 절대 만지지 않는다.
// beta.22에서 이 화면에는 **서명 캔버스가 함께 산다**. 그래서 이 함수의 임무가 하나 더 늘었다:
//   "금액 한 글자마다 캔버스를 살려 두는 것". 여기서 render로 빠지는 순간 그린 서명이 통째로 사라진다.
//   이 함수는 캔버스(#signCanvas)를 **읽지도 쓰지도 않는다** — 손대지 않는 것이 곧 보존이다.
// 빠른 금액 버튼도 이 경로를 쓴다(입력창의 value만 직접 대입 — 등록 모달의 fill-open과 같은 패턴).
function custComposeActive(){return !!(lockScreenActive()&&state.lockView==='customer'&&customerViewAllowed()&&state.custStage==='compose')}
// "손님이 지금 뭔가 적어 두었는가" — 금액(state)이든 서명 획(캔버스)이든 하나라도 있으면 참.
//   ⚠️ 서명은 state가 아니라 캔버스에만 산다(사본 없음 = '요청은 휘발성'). 그래서 여기서도 캔버스를
//     읽기만 한다(signPad.isEmpty). 이 함수는 어떤 것도 지우지 않는다 — 지울지 말지를 부르는 쪽이 정한다.
function custDraftDirty(){if(str(state.custAmount))return true;try{return !!(signPad&&typeof signPad.isEmpty==='function'&&!signPad.isEmpty())}catch(e){return false}}
function custAmountPatch(){
if(!custComposeActive())return false;
const sel=state.custSelectedId?derive().active.find(e=>e.id===state.custSelectedId):null;
if(!sel)return false;
// beta.44: 갈아끼울 조각은 둘이다 — 잔액 한 줄과 오류 한 줄. 잔액은 현재 잔액 고정이라 값이 바뀌지
//   않지만, **노드 존재 여부가 곧 "이 화면이 맞다"의 판정**이므로 그대로 요구하고 함께 갱신한다.
const err=qs('custAmtErr'),balEl=qs('custAmtBal');
if(!err||!balEl)return false;
const view=custAmountView(sel.balance);
balEl.textContent=view.bal;err.textContent=view.c.err;
return true}
// ── 최후의 방벽: 획이 그려진 통합 화면에서는 전체 render를 부분 갱신으로 강등한다 (beta.22) ──
// 왜 게이트(renderIsDisruptive)만으로 부족한가: 그 게이트는 **호출부가 스스로 지킬 때만** 동작한다.
//   비동기 경로 하나가 게이트를 빼먹으면(또는 새 경로가 생기면) 그 한 번의 render로 손님의 서명이 사라진다.
//   금액과 서명이 한 화면에 있는 지금은 그 사고 확률이 화면 체류시간 내내 열려 있다.
//   → render()의 입구에서 막는다. 화면이 실제로 바뀌는 경우(제출·[뒤로]·유휴 복귀·잠금 전환)는
//     이미 custStage/lockView가 바뀐 뒤에 render를 부르므로 custComposeActive()가 false라 여기 걸리지 않는다.
//   즉 걸리는 것은 오직 "같은 화면에 그대로 있으면서 전면 재렌더를 시도하는" 호출뿐이고, 그건 전부 사고다.
function custComposeGuard(){
if(!custComposeActive())return false;
if(!signInProgress())return false;// 획이 없으면 전체 render가 잃을 것이 없다(빈 캔버스는 다시 만들면 그만)
custAmountPatch();// 잔액·오류 두 조각만 최신으로
paintToast();// 토스트가 걸려 있으면 조각만 붙였다 뗀다(화면은 그대로)
return true}

const region=selectedRegion();const agency=selectedAgency();const agencyDeptSet=new Set((region&&agency)?resolveAgencyDepts(region.code,agency.id):[]);const usedAgency=state.setupDepts.some(v=>agencyDeptSet.has(v));

state.setupStep=1;state.setupGuide=true;

//   auth_required(예전 열쇠 등록 잔존)는 "홈의 안내를 눌러 마무리"가 같은 실패로 되돌아가는 오답이므로 따로 말한다.
render();toast(registered?'초기 설정 완료':(relayRegisterLastError==='auth_required'?'설정은 끝났어요. 가게 등록은 방금 안내한 방법으로 해결한 뒤 다시 해 주세요.':'설정은 끝났어요. 가게 등록은 아직 안 됐어요 — 홈의 안내를 눌러 마무리하세요.'))}

// 온보딩 1/3에서 검색으로 고른 가게를 서버에 등록. 실패(오프라인 등)하면 로컬 등록 상태를 되돌리고 홈 배너로 마무리를 유도한다.
async function finishStoreRegistration(){
const picked=state.setupPickedStore;
if(!picked||!str(picked.id)){await markStoreRegisterPending();return false}
const before=num(state.data.meta.relayRegisteredAt);
// 공식 주소(storeAddr)는 관할 지역(district) 산출의 1순위 근거다 — 반드시 함께 저장한다.
state.data.meta.restaurantId=str(picked.id);state.data.meta.relayStoreName=str(picked.name);state.data.meta.storeAddr=str(picked.addr);
try{await repo.apply({meta:{restaurantId:state.data.meta.restaurantId,relayStoreName:state.data.meta.relayStoreName,storeAddr:state.data.meta.storeAddr}})}catch(e){console.error('relay store meta save',e)}
try{await relayRegister(str(picked.addr))}catch(e){console.error('relay setup register',e)}
if(num(state.data.meta.relayRegisteredAt)>before)return true;// 성공(relayRegister가 pending 플래그도 해제)
state.data.meta.restaurantId='';state.data.meta.relayStoreName='';state.data.meta.storeAddr='';
try{await repo.apply({meta:{restaurantId:'',relayStoreName:'',storeAddr:''}})}catch(e){console.error('relay store meta rollback',e)}
await markStoreRegisterPending();return false}
async function markStoreRegisterPending(){state.data.meta.storeRegisterPending=true;try{await repo.apply({meta:{storeRegisterPending:true}})}catch(e){console.error('pending flag',e)}}

try{var rec=new SR();rec.lang='ko-KR';rec.interimResults=false;rec.maxAlternatives=1;toast('🎤 듣고 있어요… 이름을 말씀하세요');
rec.onresult=function(ev){var t=((ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript)||'').replace(/\s+/g,'').replace(/[.,!?]+$/,'');if(!t){toast('다시 말씀해 주세요.');return}
state.search=t;state.deptFilter='';state.screen='home';render();toast('"'+t+'" 음성 검색')};
rec.onerror=function(ev){toast('음성 인식 오류'+(ev&&ev.error?': '+ev.error:''))};
rec.start()}catch(e){console.error(e);toast('음성 인식을 시작할 수 없습니다.')}}

// ── 이름 검색 매칭 (초성 + 공백 무시) ──
// 검색어가 전부 한글 자음(ㄱ-ㅎ)이면 "초성 검색"으로 취급해 이름의 초성열과 비교한다("ㄱㅁ" → 김민수).

// ⚠️⚠️ 매처가 **둘**이다. 이름이 아니라 **어느 화면이 쓰는가**로 갈린다. 섞지 말 것:
//   · nameMatches(부분 일치)    = 사장님용 홈 검색(state.search) 전용.
//       사장님은 기억나는 조각(가운데 글자·성 없이 이름만)으로 찾는다 — 여기서 접두로 좁히면

//       손님은 **자기 이름**만 찾으면 된다. 부분 일치면 '영' 한 글자에 '영업맨'과 '홍룬영'이 함께 뜨고,

//       접두로 좁히면 '영' → 영업맨만, 'ㅇㅇ' → 영업맨만 나온다.
//   초성 변환 유틸(toChoseong·isChoseongQuery)은 둘이 공유한다 — 초성 규칙이 화면마다 달라지면 안 된다.
const CHOSEONG=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toChoseong(s){let out='';for(const ch of str(s)){const c=ch.charCodeAt(0);out+=(c>=0xAC00&&c<=0xD7A3)?CHOSEONG[Math.floor((c-0xAC00)/588)]:ch}return out}

// 사장님용 홈 검색 — 부분 일치(현행 유지).

function derive(){const balances=new Map(),voided=new Set();const asc=sortTxAsc(state.data.transactions);asc.forEach(t=>{const p=balances.get(t.employeeId)||0;balances.set(t.employeeId,applyTx(p,t));if(t.type==='void'&&t.targetTransactionId)voided.add(t.targetTransactionId)});const employees=state.data.employees.map(e=>({...e,balance:balances.get(e.id)||0,deptKey:orgDeptLabel(e)||'부서 없음'})).sort((a,b)=>a.deptKey.localeCompare(b.deptKey,'ko')||a.name.localeCompare(b.name,'ko'));const empMap=new Map(employees.map(e=>[e.id,e]));const active=employees.filter(e=>!e.isDeleted);

// 검색 중일 때만 "최근 사용 순"(마지막 거래 createdAt 내림차순, 동률은 기존 순서 유지 — sort는 안정 정렬).

// 빈 화면은 "안내"로 끝내지 않고 바로 누를 수 있는 다음 행동(CTA)을 준다.
function homeHtml(d){const pills=statusPillsHtml();if(!d.filtered.length)return `${pills}<div class="card empty">${(state.search.trim()||state.deptFilter)?'검색 결과가 없습니다.<br><button class="btn" data-a="reset-filter" style="margin-top:12px">초기화</button>':'아직 올린 직원이 없어요.<br>공공기관에서 받거나 직접 올릴 수 있어요.<br><button class="btn-primary" data-a="guide-add-employee" style="margin-top:14px;min-height:56px;padding:0 22px;font-size:16px;font-weight:700">＋ 한 명씩 올리기</button>'}</div>`;const todayUse=state.data.transactions.filter(t=>t.type==='use'&&sameDay(txDispTime(t),now())&&!d.voided.has(t.id)).reduce((s,t)=>s+num(t.amount),0);
// 그룹 헤더는 접힘/펼침 아코디언(설정의 toggle-dept와 같은 조작감, 상태는 홈 전용 키 state.homeExpanded).
// 자동 펼침: 그룹이 1개뿐 / 검색어·부서 필터가 켜져 있을 때(검색이 "안 되는 것처럼" 보이지 않게).
const forceOpen=!!(state.search.trim()||state.deptFilter)||d.homeGroups.length===1;
const groupsHtml=d.homeGroups.map(g=>{const open=forceOpen||!!state.homeExpanded[g.key];const balCls=g.totalBalance<0?'negative':g.totalBalance===0?'zero':'';
const body=!open?'':(g.subs?g.subs.map(s=>`${s.dept?`<div class="group-sub">${esc(s.dept)}</div>`:''}${s.items.map(empCard).join('')}`).join(''):g.items.map(empCard).join(''));
return `<div class="card group"><div class="group-head" data-a="toggle-home-group" data-g="${esc(g.key)}"${forceOpen?' data-forced="1"':''} role="button" tabindex="0" aria-expanded="${open?'true':'false'}"><div class="group-headline"><span class="group-toggle" aria-hidden="true">${open?'▼':'▶'}</span><div><div class="group-title">${esc(g.label)}</div><div class="group-meta">직원 ${g.count}명</div></div></div><div class="bal ${balCls}">${money(g.totalBalance)}</div></div>${body}</div>`}).join('');
const summary=`<div class="card summary"><div>오늘 사용 ${money(todayUse)}</div><div class="v">전체 잔액 ${money(d.total)}</div></div>`;

// 이 화면은 손님에게 그대로 보여주는 용도이므로 가게 매출이 드러나는 요약 카드(오늘 사용·전체 잔액)도 함께 감춘다.
if(state.search.trim()&&d.filtered.length===1)return `${pills}${quickActionsHtml()}${soloEmpCard(d.filtered[0])}`;
return `${pills}${summary}${quickActionsHtml()}${groupsHtml}`}

function soloEmpCard(e){const c=e.balance<0?'negative':e.balance===0?'zero':'';const initial=esc(Array.from(str(e.name))[0]||'?');return `<div class="card employee solo" style="display:flex;align-items:center;gap:12px"><div class="emp-avatar" aria-hidden="true">${initial}</div><div class="employee-main" data-a="history-for" data-id="${esc(e.id)}"><div class="name">${esc(e.name)}</div><div class="dept">${esc(orgDeptLabel(e)||'부서 없음')}${e.note?' · '+esc(e.note):''}</div></div><div class="bal ${c}" style="margin:0;white-space:nowrap">${money(e.balance)}</div><button class="small" data-a="receipt" data-id="${esc(e.id)}" aria-label="${esc(e.name)} 잔액증표 보기" title="잔액증표(명함)" style="flex:0 0 auto;min-width:48px;font-size:20px">🧾<span class="rcpt-label">증표</span></button><button class="btn-primary" data-a="use" data-id="${esc(e.id)}" style="flex:0 0 auto">사용</button></div>`}
function empCard(e){const c=e.balance<0?'negative':e.balance===0?'zero':'';const initial=esc(Array.from(str(e.name))[0]||'?');return `<div class="card employee" style="display:flex;align-items:center;gap:12px"><div class="emp-avatar" aria-hidden="true">${initial}</div><div class="employee-main" data-a="history-for" data-id="${esc(e.id)}"><div class="name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.name)}</div><div class="dept" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(orgDeptLabel(e)||'부서 없음')}${e.note?' · '+esc(e.note):''}</div></div><div class="bal ${c}" style="margin:0;white-space:nowrap;font-size:20px">${money(e.balance)}</div><button class="small" data-a="receipt" data-id="${esc(e.id)}" aria-label="${esc(e.name)} 잔액증표 보기" title="잔액증표(명함)" style="flex:0 0 auto;min-width:44px;font-size:18px">🧾<span class="rcpt-label">증표</span></button><button class="btn-primary" data-a="use" data-id="${esc(e.id)}" style="min-width:auto;padding:10px 16px;flex:0 0 auto">사용</button></div>`}
function historyHtml(d){if(state.historyTab==='employee')return historyByEmployee(d);return historyByDate(d)}
function historyByDate(d){if(!d.dateGroups.length)return '<div class="card empty">거래 이력이 없습니다.<br>홈 화면에서 직원을 골라 [사용]을 눌러 등록해 보세요.<br><button class="btn-primary" data-a="go-home" style="margin-top:14px;min-height:56px;padding:0 22px;font-size:16px;font-weight:700">홈으로 가기</button></div>';return d.dateGroups.map(g=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1.5px solid #eef1f4"><div class="name" style="font-size:16px">${esc(g.date)}</div><div style="font-size:12px;color:var(--muted)">${g.count}건${g.useTotal?` · 사용 ${money(g.useTotal)}`:''}</div></div><div class="list">${g.items.map(t=>txCardDate(t,d)).join('')}</div></div>`).join('')}
function txCardDate(t,d){const e=d.empMap.get(t.employeeId);const eName=e?e.name:'알 수 없음';const eDept=e?e.deptKey:'';const lbl={open:'등록',topup:'충전',use:'사용',void:'취소',adjust:'조정'}[t.type]||t.type;const isOut=t.type==='use';const isAdj=t.type==='adjust';const isV=d.voided.has(t.id);const adjNeg=isAdj&&num(t.amount)<0;const sign=isOut?'-':adjNeg?'':'+';const cls=isOut?'out':isAdj?'adjust':'in';const sigSrc=sigD(t.signatureData);const sig=sigSrc?`<img class="thumb" src="${esc(sigSrc)}" data-a="view-sign" data-id="${esc(t.id)}" alt="서명">`:'';const vb=t.type==='use'&&!isV?`<button class="small" data-a="void" data-id="${esc(t.id)}">이 사용 기록 취소</button>`:'';const vm=isV?'<span class="chip" style="background:var(--danger-soft);color:var(--danger)">취소됨</span>':'';const nt=t.note?`<span class="chip">${esc(t.note)}</span>`:'';const time=new Date(t.createdAt);const hm=String(time.getHours()).padStart(2,'0')+':'+String(time.getMinutes()).padStart(2,'0');return `<div class="txn" style="${isV?'opacity:.5':''}"><div class="txn-top"><div><div class="txn-title">${esc(eName)} <span style="font-weight:400;color:var(--muted);font-size:11px">${esc(eDept)} · ${esc(lbl)}</span></div></div><div class="amt ${cls}">${sign}${money(isAdj?t.amount:Math.abs(t.amount))}</div></div><div class="chips"><span>${hm}</span>${nt}${vm}${t.reason&&t.type!=='use'?`<span>${esc(t.reason)}</span>`:''}</div>${sig}${vb}</div>`}
function historyByEmployee(d){if(!d.historyGroups.length)return '<div class="card empty">거래 이력이 없습니다.<br>홈 화면에서 직원을 골라 [사용]을 눌러 등록해 보세요.<br><button class="btn-primary" data-a="go-home" style="margin-top:14px;min-height:56px;padding:0 22px;font-size:16px;font-weight:700">홈으로 가기</button></div>';return d.historyGroups.map(g=>{const emp=g.employee;const bal=emp?emp.balance:0;const canAdjust=emp&&!emp.isDeleted;return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="name">${esc(g.name)}<span class="dept" style="margin-left:8px">${esc(g.dept)}</span></div><div style="display:flex;align-items:center;gap:8px"><div style="font-size:22px;font-weight:800;color:var(--danger);white-space:nowrap">잔액 ${money(bal)}</div>${canAdjust?`<button class="small" data-a="adjust" data-id="${esc(g.employeeId)}">조정</button>`:''}</div></div><div class="list">${g.items.map(t=>txCard(t,d)).join('')}</div></div>`}).join('')}
function txCard(t,d){const lbl={open:'등록',topup:'충전',use:'사용',void:'취소',adjust:'조정'}[t.type]||t.type;const isOut=t.type==='use';const isAdj=t.type==='adjust';const isV=d.voided.has(t.id);const adjNeg=isAdj&&num(t.amount)<0;const sign=isOut?'-':adjNeg?'':'+';const cls=isOut?'out':isAdj?'adjust':'in';const displayAmt=isAdj?money(t.amount):money(Math.abs(t.amount));const sigSrc=sigD(t.signatureData);const sig=sigSrc?`<img class="thumb" src="${esc(sigSrc)}" data-a="view-sign" data-id="${esc(t.id)}" alt="서명">`:'';const vb=t.type==='use'&&!isV?`<button class="small" data-a="void" data-id="${esc(t.id)}">이 사용 기록 취소</button>`:'';const vm=isV?'<span class="chip" style="background:var(--danger-soft);color:var(--danger)">취소됨</span>':'';const nt=t.note?`<span class="chip">${esc(t.note)}</span>`:'';return `<div class="txn" style="${isV?'opacity:.5':''}"><div class="txn-top"><div class="txn-title">${esc(lbl)}</div><div class="amt ${cls}">${sign}${displayAmt}</div></div><div class="chips"><span style="font-size:14px;font-weight:600">${dtDisp(t)}</span>${nt}${vm}${t.reason&&t.type!=='use'?`<span>${esc(t.reason)}</span>`:''}</div>${sig}${vb}</div>`}

function phoneControlsHtml(e){const has=!!e.phone;return `<div class="phone-row"><button class="small" data-a="emp-phone-edit" data-id="${esc(e.id)}">${has?'번호 수정':'번호 등록'}</button>${has?`<button class="small" data-a="emp-phone-clear" data-id="${esc(e.id)}">번호 삭제</button>`:''}<label class="phone-consent${has?'':' disabled'}"><input type="checkbox" data-a="emp-phone-consent" data-id="${esc(e.id)}"${has?'':' disabled'}${e.phoneConsent?' checked':''}> 문자 안내 동의</label></div><div class="meta" style="font-size:10px">전화번호는 이 폰에만 저장되며 서버로 전송되지 않아요.</div>`}

if(state.modal.type==='store-search'){const results=state.modal.results||[];const emptyMsg=state.modal.regionFilteredOut?'이 지역에서는 찾지 못했습니다. 지역을 빼고 다시 검색해 보세요.':(state.modal.usedZip?'검색 결과가 없습니다. 가게 이름을 바꿔보세요.':emptySearchMsg('modal',state.modal.region));const list=results.length?results.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;gap:8px"><div style="min-width:0"><div style="font-weight:600">${esc(x.name)}</div><div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.address||'')}</div></div><button class="btn-primary small" data-a="relay-pick-store" data-id="${esc(x.restaurant_id)}" data-name="${esc(x.name)}" data-addr="${esc(x.address||'')}" style="flex-shrink:0">이 가게</button></div>`).join(''):(state.modal.searched&&emptyMsg?`<div class="empty">${esc(emptyMsg)}</div>`:'');return `<div class="modal-back"><div class="modal"><h2>우리 가게 찾기</h2><p class="help">가게 이름과 지역(구·군과 동)으로 검색해 우리 가게를 선택하세요. 한 번만 등록하면 됩니다.</p><div class="form"><div class="field"><label for="storeName">가게 이름</label><input id="storeName" placeholder="예: 정식김밥" value="${esc(state.modal.q||'')}"></div><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px"><div class="field"><label for="storeRegion">지역 (구·군과 동)</label><input id="storeRegion" placeholder="예: 광진구 구의동" value="${esc(state.modal.region||'')}"></div><div class="field"><label for="storeZip">우편번호(선택)</label><input id="storeZip" inputmode="numeric" maxlength="5" placeholder="아는 경우만" value="${esc(state.modal.zip||'')}"></div></div><div class="meta" style="line-height:1.5">이름으로 안 나오면 지역(구·군과 동)을 함께 적어 주세요 — 동네 전체에서 자동으로 찾아봐요. 우편번호는 아는 경우에만 넣으면 돼요.</div></div><div class="modal-actions"><button class="btn" data-a="close-modal">닫기</button><button class="btn-primary" data-a="relay-search-stores">${state.modal.searching?'검색 중…':'검색'}</button></div>${list?`<div style="margin-top:12px">${list}</div>`:''}$ if(state.modal.type==='csv'){const rows=state.modal.rows||[];const dupWarn=state.modal.dupWarn||0;const errs=rows.filter(r=>r.error).length;const newCount=rows.filter(r=>!r.error&&r.mode!=='topup').length;const topupCount=rows.filter(r=>!r.error&&r.mode==='topup').length;const sm=!rows.length?'':errs>0?`<div style="color:var(--danger);font-weight:700;margin:8px 0">❌ ${errs}건 오류 — 수정 후 다시 시도하세요</div>`:`<div style="color:var(--success);font-weight:700;margin:8px 0">✅ ${newCount?'신규 '+newCount+'명':''}${newCount&&topupCount?' + ':''}${topupCount?'기존 충전 '+topupCount+'명':''} — 등록 가능</div>`;const hasOrg=rows.some(r=>str(r.org));const tb=rows.length?`<div class="csv-preview"><table class="csv-table"><thead><tr><th>행</th>${hasOrg?'<th>소속</th>':''}<th>부서</th><th>이름</th><th>금액</th><th>상태</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.error?'err':''}" style="${r.mode==='topup'?'background:var(--warn-soft)':''}"><td>${r.line}</td>${hasOrg?`<td>${esc(r.org||'')}</td>`:''}<td>${esc(r.dept)}</td><td>${esc(r.name)}</td><td>${r.amount?money(r.amount):'-'}</td><td>${r.error?esc(r.error):(r.mode==='topup'?'🔄 추가 충전':'✅ 신규')}</td></tr>`).join('')}</tbody></table></div>`:'';return `<div class="modal-back"><div class="modal"><h2>엑셀 명단(CSV) 불러오기</h2><p class="help">엑셀에서 저장한 CSV 파일을 불러와요. 첫 줄(제목 줄)에 <b>소속·부서·이름·금액</b> 칸을 넣어 주세요.<br>· <b>소속</b> = 공공기관명·회사명, 개인 선금이면 <b>'개인'</b> (없으면 비워 두셔도 돼요)<br>· 이미 등록된 직원은 금액이 추가로 충전돼요.</p>${sm}${dupWarn?`<div style="color:var(--warn,#b7791f);font-weight:700;margin:8px 0">⚠️ 동명이인 ${dupWarn}건 감지 — 구분 마커(·2, ·3 …)를 자동 부여했습니다. 표에서 확인하세요.</div>`:''}${tb}<div class="modal-actions"><button class="btn" data-a="close-modal">취소</button>${rows.length&&!errs?'<button class="btn-primary" data-a="exec-csv">등록하기</button>':'<button class="btn-secondary" data-a="pick-csv">파일 선택</button>'}</div></div></div>`}

// 잔액증표(명함형) — 표시 전용. 잔액은 derive() 결과만 사용(별도 계산 금지).
function receiptCardHtml(d){const e=d.empMap.get(state.modal.id);if(!e)return '';const shop=state.data.meta.shopName||APP;const od=orgDeptLabel(e);const who=od?`${esc(od)} ${esc(e.name)}님`:`${esc(e.name)}님`;const x=new Date(now());const dateStr=`${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}`;const integrityBad=state.modal.integrityOk===false||state.modal.crossOk===false;let balBlock;if(integrityBad){balBlock=`<div class="receipt-warn">장부에 이상이 있어 잔액을 표시할 수 없습니다.<br>설정 → 장부 검사를 확인하세요.</div>`}else{const neg=e.balance<0;balBlock=`<div class="receipt-bal${neg?' neg':''}">${money(e.balance)}${neg?'<div class="receipt-negnote">확인 필요</div>':''}</div>`}return `<div class="modal-back"><div class="modal receipt-modal"><div class="namecard"><div class="namecard-shop">${esc(shop)}</div><div class="namecard-body"><div class="namecard-who">${who}</div>${balBlock}</div><div class="namecard-foot"><div class="namecard-date">${dateStr}</div><div class="namecard-note">${esc(shop)} 전용 · 잔액 확인용 · 양도 불가</div></div></div><div class="receipt-tip">이 화면을 사진으로 찍어 두시면 나중에 잔액을 확인하실 수 있어요.</div><div class="modal-actions"><button class="btn" data-a="close-modal">닫기</button></div></div></div>`}

// 증표 열기 — 3중 안전장치: ①derive balance만 사용 ②해시체인 재검증 ③시간순 applyTx 누적 교차검증
// 잔액 표시 전 안전장치 ②③ — 해시체인 재검증 + 시간순 applyTx 누적 교차검증.
//   증표(사장님)와 손님 화면이 반드시 같은 판정을 쓰도록 헬퍼로 뽑았다(한쪽만 완화되는 일이 없게).
async function verifyBalanceFor(id){let integrityOk=true,crossOk=true;
// ⚠️ 여기서는 tamperOk(변조 증거 없음)를 본다. 구 형식(hv≠2·txHash 없음) 장부는 '재검증 불가'이지
//   '변조됨'이 아니다 — 그것만으로 손님 화면의 잔액을 지우면 옛 백업을 되살린 사장님이 영영 못 쓴다.
//   변조를 실제로 가리키는 신호(해시 불일치·체인 단절·꼬리 앵커 불일치)는 그대로 잔액을 막는다.
try{const chain=await verifyChain();integrityOk=chain.tamperOk!==false}catch(err){console.error('balance verify',err);integrityOk=false}
// ③ 교차검증 — 예전에는 derive()의 잔액과 "같은 거래를 같은 규칙으로 다시 더한 값"을 비교했다.
//   두 값은 정의상 언제나 같다(항등식). 진짜 교차검증은 **거래가 적어 둔 전후 잔액**과 대조하는 것이다.
try{const d=derive();const e=d.empMap.get(id);if(e){const r=reconcileEmployee(id);crossOk=r.ok&&r.stored===num(e.balance)}}catch(err){console.error('balance cross-check',err);crossOk=false}
return{integrityOk,crossOk}}
async function openReceipt(id){const{integrityOk,crossOk}=await verifyBalanceFor(id);state.modal={type:'receipt',id,integrityOk,crossOk};render()}
// 사용 모달 열기 — 홈의 [사용] 버튼과 손님 인계(A·B)가 같은 경로를 쓴다.
//   pre = 손님이 넘긴 요청 {amount, sign}. 없으면(홈의 [사용]·A 인계) 예전 그대로 빈 칸으로 연다.
//   ⚠️ 프리필은 '초안'이다 — 금액은 그대로 수정할 수 있고, 저장은 기존 saveUse(confirm 포함)만 통과한다.
async function openUsageFor(id,pre){const emp=state.data.employees.find(v=>v.id===id&&!v.isDeleted);if(!emp){render();return}
let smsPhone='';if(emp.phoneConsent&&emp.phone){try{smsPhone=await getPhone(emp)}catch(err){console.error('phone decrypt',err)}}
const preAmount=num(pre&&pre.amount),preSign=str(pre&&pre.sign);
state.screen='home';state.modal={type:'usage',id,smsPhone,preAmount:preAmount>0?preAmount:0,preSign};render()}

// ── beta.23(MEDIUM-2): 유휴 만료는 "마지막 **사용자 조작** 시각"으로 판정한다 ──────────────
// 예전 구조: armIdle이 불릴 때마다 setTimeout을 처음부터 다시 걸었다. armIdle은 render()의 꼬리에서도

//   (a) custComposeGuard가 renderCore는 막아 화면은 그대로인데
//   (b) armIdle만 계속 불려 유휴 복귀가 무기한 밀린다 → 손님 이름·잔액이 뜬 채로 화면이 굳는다.
//   지금 프로덕션에 그런 경로는 없지만, "새 경로 하나가 생기면 개인정보가 영구 노출된다"는 성질 자체를 없앤다.
// 새 구조: lastInputAt(실제 조작 시각)에 ms를 더한 **절대 시각**에 만료를 건다. armIdle을 몇 번 부르든
//   만료 시각은 그대로다(그래서 굶어 죽지 않는다). 시계를 미는 것은 markInput뿐이고, markInput은
//   전역 캡처 리스너(click·input·change·keydown·touchstart)와 캔버스 그리기에서만 불린다.
function markInput(){lastInputAt=now();armIdle()}
// ms 뒤가 아니라 "lastInputAt+ms"에 fn을 실행한다. 중간에 조작이 있었으면 남은 시간만큼 더 기다린다.
function idleAt(ms,fn){
const fire=()=>{const left=ms-(now()-lastInputAt);
if(left>0){idleTimer=setTimeout(fire,Math.min(left,ms));return}
idleTimer=null;fn()};
idleTimer=setTimeout(fire,Math.max(0,ms-(now()-lastInputAt)))}
function armIdle(){
if(idleTimer){clearTimeout(idleTimer);idleTimer=null}
if(!state.loaded)return;
if(state.pinLocked){
// 손님 화면 자동 복귀 — 앞 손님의 검색어·선택·호출 요청이 다음 손님에게 남지 않게 한다.
//   PIN 최초 설정·변경 중에는 돌아갈 손님 화면 자체가 없으므로 시계를 걸지 않는다.
if(!lockScreenActive()||!state.data.meta.pinHash||state.pinMode==='change')return;
// 복구 화면은 60초 활성화 게이트가 끝나고도 30초를 더 준다 — 게이트를 기다리는 동안 화면이 사라지면 사장님이 복구를 못 한다.
if(state.pinRecovery){idleAt(recoveryLeft()*1000+TIMERS.custIdle,()=>{if(state.pinLocked&&state.pinRecovery)backToCustomerIdle()});return}
// ⚠️ PIN 화면(lockView==='pin')에는 **언제나** 시계를 건다. 길이만 두 가지다.
//   · 손님 흔적이 남아 있는 화면 — "사장님 확인"(handoff)이거나 인계 요청이 살아 있으면 30초(custIdle).
//     방치하면 앞 손님의 요청이 다음 손님에게 남는다(HIGH-3의 본체).
//   · 사장님이 [사장님용 잠금 해제]로 스스로 연 화면(owner) — 120초(ownerPinIdle).
//     예전에는 여기에 시계를 아예 걸지 않았다("4자리 고르는 도중 화면이 튀면 안 된다"). 그 대가가 컸다:
//       (a) 부분 입력된 PIN(예: 3자리)이 무기한 남아 다음 사람이 1자리만 맞히면 되는 상태가 된다(1/10),
//       (b) 손님이 [사장님용 잠금 해제]를 오탭하고 자리를 뜨면 태블릿이 PIN 패드에 영구 체류해
//           다음 손님의 셀프 조회가 막힌다(매뉴얼의 "늘 손님 화면" 약속 위반).
//     120초는 원래의 우려(입력 중 화면 튐)를 그대로 해소하면서 두 결함을 닫는다 — 4자리 입력에
//     2분이 걸리는 경우는 없고, 어떤 조작이든(키 입력 포함) 시계는 처음부터 다시 돈다.
//   만료 동작은 한 가지다: 손님 초기 화면 복귀 + 입력 중이던 PIN 폐기 + 손님 상태·인계 요청 폐기.
if(state.lockView==='pin'){
const pinIdleMs=(state.pinContext==='handoff'||state.pendingCustomerId)?TIMERS.custIdle:TIMERS.ownerPinIdle;
idleAt(pinIdleMs,()=>{if(state.pinLocked&&state.lockView==='pin')backToCustomerIdle()});
return}
if(!(state.custQuery||state.custStage!=='search'||state.custSelectedId||state.pendingCustomerId))return;
// 요청 작성 중(통합 화면 = 금액 입력 + 서명)에는 60초를 준다 — 조회만 하는 30초는 어르신이 금액을 고르고
//   손가락으로 이름을 쓰기에 너무 짧다(중간에 화면이 튀면 처음부터 다시 해야 한다).
//   beta.22에서 화면이 하나로 합쳐졌으므로 조건도 한 줄이다(예전에는 'amount'|'sign' 두 가지였다).
//   재무장은 두 갈래로 온다: 전역 캡처 리스너(click/input/…)와 캔버스의 그리기 이벤트(initSignPad의 armIfDrawing).
//   만료 동작은 같다: resetCustomerState가 작성 중이던 금액·서명까지 전부 버리고 손님 초기 화면으로.
//   ⚠️ beta.25: 기준은 화면(stage)이 아니라 **작성 중인 초안이 있는가**다.
//     beta.24까지는 stage==='compose'만 봤다 → 손님이 금액을 적어 둔 채 [최근 사용 내역 보기]로
//     넘어가면 조회용 30초가 걸렸다. 그런데 그 상세 화면은 손님에게 "금액은 그대로 있어요"라고
//     약속한다 — 어르신이 지난 내역을 30초 넘게 들여다보면 약속한 금액이 소리 없이 사라졌다.
//     초안(state.custAmount)을 들고 있는 한 어느 화면에 있든 작성 중으로 보고 60초를 준다.
const composing=state.custStage==='compose'||!!str(state.custAmount);
const custIdleMs=composing?TIMERS.custComposeIdle:TIMERS.custIdle;
idleAt(custIdleMs,()=>{resetCustomerState();render()});
return}
// 자동 잠금 — 모달(서명 캔버스 포함)·저장 중·설정/안내 화면에서는 걸지 않는다(작업 중에 잠기면 안 된다).
if(canAutoLock()){idleAt(TIMERS.autoLock,()=>{if(canAutoLock())lockToCustomer()});return}
if(canAutoLockBase()&&state.modal){idleAt(TIMERS.modalIdleCap,()=>{if(canAutoLockBase()&&state.modal)lockToCustomer()})}}
// PIN 화면 방치 → 손님 초기 화면으로. 잠금은 절대 풀리지 않고, 앞 손님의 흔적(인계 요청 포함)은 전부 사라진다.
function backToCustomerIdle(){state.lockView='customer';state.pinContext='';state.pinInput='';state.pinMsg='';leaveRecovery();stopPinDelayTick();stopHandoffTtl();resetCustomerState();render()}
// 조작이 있으면 시계를 다시 시작한다. 캡처 단계라 어떤 핸들러가 이벤트를 막아도 반드시 실행된다.
['click','input','change','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,markInput,true));

//   ⚠️ 금액을 넣을 수 없는 손님(잔액 검증 실패·잔액 0 이하)만 상세 화면(self)으로 보낸다 —

'cust-confirm':async(el)=>{const id=str(el.dataset.id);const emp=state.data.employees.find(v=>v.id===id&&!v.isDeleted);if(!emp){resetCustomerState();render();return}
clearCustCompose();clearPendingRequest();
state.custSelectedId=id;state.custVerify=await verifyBalanceFor(id);
const v=state.custVerify,bad=!!(v&&(v.integrityOk===false||v.crossOk===false));
const live=derive().active.find(e=>e.id===id);
state.custStage=(bad||!live||num(live.balance)<=0)?'self':'compose';render()},

'cust-back':()=>{resetCustomerState();render()},
// 사장님 인계 요청 — 기록이 아니라 "요청"이다(휘발성, 저장소에 남기지 않는다). 잠금은 유지된다.

//     빠져나갔다 돌아오는 왕복이 이 경로이기 때문이다. 여기서 clearCustCompose를 부르면 손님이 적어 둔
//     금액이 조용히 사라진다. 앞 손님의 잔재는 검색 입력·확인 카드(cust-confirm)·유휴 복귀가 이미 지운다.

'cust-request':()=>{const id=str(state.custSelectedId);const emp=state.data.employees.find(v=>v.id===id&&!v.isDeleted);if(!emp){resetCustomerState();render();return}

'cust-history':()=>{const id=str(state.custSelectedId);const emp=state.data.employees.find(v=>v.id===id&&!v.isDeleted);if(!emp){resetCustomerState();render();return}

'cust-amt-quick':(el)=>{const v=str(el.dataset.amount);state.custAmount=v;const i=qs('custAmountInput');if(i)i.value=v;

// [지우고 다시] — 캔버스만 비운다. 금액은 그대로 둔다(손님이 지우고 싶은 것은 서명이지 금액이 아니다).
//   render 금지: 다시 그리면 캔버스가 새로 만들어져 오히려 지워지고, 금액 입력 포커스도 함께 날아간다.
'cust-sign-clear':()=>{if(signPad)signPad.clear();const err=qs('custSignErr');if(err)err.textContent=''},
// [사장님 확인 받기] — 요청이 완성되는 유일한 지점. 여기서도 저장은 없다(휘발성 state에만 담는다).
//   TTL(pendingTtl 120초)의 기준 시각은 **바로 이 순간**이다(작성을 시작한 시각이 아니다).
// 검증 순서는 화면을 읽는 순서와 같다(위에서 아래로): 금액 → 서명. 둘 중 하나라도 비면 넘어가지 않고,
//   이유는 그 칸 바로 아래 한 줄로 말한다(손님 화면에서는 toast가 뜨지 않는다 — toast()가 스스로 조용해진다).
//   ⚠️ 오류를 띄울 때 render를 부르면 안 된다 — 이미 그려 둔 서명이 그 자리에서 사라진다.
//     (그래도 custComposeGuard가 한 겹 더 막지만, 애초에 부르지 않는 것이 옳다.)
'cust-sign-submit':()=>{const sel=state.custSelectedId?derive().active.find(e=>e.id===state.custSelectedId):null;
if(!sel){resetCustomerState();render();return}
const c=custAmountCheck(sel.balance);
if(!c.ok){const ae=qs('custAmtErr');const msg=c.err||'금액을 넣어 주세요.';
if(ae){ae.textContent=msg;const se=qs('custSignErr');if(se)se.textContent='';armIdle()}else render();return}
if(!signPad||signPad.isEmpty()){const err=qs('custSignErr');if(err){err.textContent='서명을 해주세요.';armIdle()}else render();return}
const sig=signPad.toDataUrl();
if(!sig){const err=qs('custSignErr');if(err){err.textContent='서명을 다시 해주세요.';armIdle()}else render();return}
handToOwner(sel.id,c.amount,sig)}
// [처음으로] — 요청 작성 화면에서 나가는 길은 이제 하나다(cust-back). 검색·선택·작성 상태를 전부 버린다.

};
// 손님 → 사장님 인계. A(금액·서명 없음)와 B(금액·서명 포함)가 **같은 한 곳**을 쓴다 —
//   요청을 세우는 자리가 둘로 갈라지면 한쪽만 앞 손님의 상태를 비우는 사고가 난다.
//   앞 손님의 검색·조회·작성 상태는 여기서 전부 버린다(PIN 화면 뒤에 숨겨두지 않는다). 남기는 것은 요청뿐이고
//   그 수명은 TTL 120초와 "사장님 확인" 화면의 30초 유휴 복귀가 함께 관리한다.
function handToOwner(id,amount,sign){

function initSignPad(){const canvas=qs('signCanvas');if(!canvas||canvas.dataset.ready==='1')return;const ctx=canvas.getContext('2d');

const applySize=()=>{canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0)};
applySize();canvas.dataset.ready='1';let drawing=false,empty=true,strokes=[],cur=null;

//   손님은 자기가 뭘 잘못했다고 믿고 [지우고 다시]를 눌러 처음부터 다시 쓴다(현장에서 실제로 벌어진다).

//   가로·세로 배율을 따로 쓰면 서명이 찌그러진다(그것이 곧 무음 왜곡이다) → 작은 쪽 배율 하나만 쓴다.

// ⚠️ 단, 움직임이면 무엇이든 시계를 다시 감으면 안 된다. 캔버스 위를 마우스가 지나가기만 해도(태블릿에서는
//   손바닥이 얹혀 있기만 해도) 자동 잠금·손님 화면 자동 복귀가 무한히 미뤄진다 — 이름·잔액이 뜬 화면이

signPad={clear(){empty=true;strokes=[];cur=null;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);paint();setHint(true)},isEmpty(){return empty},drawing(){return drawing},resize,strokeCount(){return strokes.filter(s=>s.length>1).length},toDataUrl(){return empty?'':canvas.toDataURL('image/jpeg',0.5)}}}

//   떨어져 나간 캔버스를 붙든 리스너가 쌓인다). 살아 있는 signPad에게만 전달한다.
