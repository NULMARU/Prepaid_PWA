name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 배포 게이트: 서버 계약 하니스(목)·정적 검사·링크 검사(test)와 앱 기동 스모크(smoke)가 모두 통과해야 배포한다.
  # phase2.e2e.mjs는 server/src/worker.js를 직접 import하는 순수 Node 하니스라 설치할 의존성이 없다.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 서버 계약 하니스 (phase2 목)
        run: node harness/phase2.e2e.mjs

      # 의존성 없는 정적 검사: META_KEYS·APP_VERSION=CACHE_NAME·NUL 바이트·기관 수 / 문서 상대 링크
      - name: 정적 계약 검사
        run: node harness/check-static.mjs

      - name: 문서·홈페이지 링크 검사
        run: node harness/check-links.mjs

  # 앱 기동 스모크: 빈 브라우저로 index.html?e2e=1을 열어 첫 화면이 뜨고 콘솔 오류가 0건인지만 본다(약 1~2분, 대부분 브라우저 설치).
  # 전체 시나리오(prepaid e2e·반응형·동 검색)는 글꼴·로케일에 민감해 CI에 넣지 않는다 — 로컬 verify-all의 몫.
  # Playwright는 package.json의 devDependencies 버전으로 설치하고, 브라우저도 **그 Playwright의 install 명령**으로 받는다 —
  # 미리 깔린 브라우저를 쓰지 않으므로 빌드 번호가 어긋날 일이 없다(CLAUDE.md 리눅스 주의 ②의 원인 차단).
  smoke:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright + Chromium 설치
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 음식점 앱 기동 스모크
        run: node harness/app-smoke.mjs

  deploy:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 소스를 'GitHub Actions'로 자동 설정/전환
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
