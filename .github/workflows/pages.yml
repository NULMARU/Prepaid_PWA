name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 배포 게이트: 서버 계약 하니스(목)가 통과해야 배포한다.
  # phase2.e2e.mjs는 server/src/worker.js를 직접 import하는 순수 Node 하니스라 설치할 의존성이 없다.
  # Playwright 계열(prepaid e2e·responsive·dongsearch)은 브라우저 다운로드가 필요해 넣지 않는다 —
  # 그쪽은 로컬 `bash harness/verify-all.sh`의 몫이다.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 서버 계약 하니스 (phase2 목)
        run: node harness/phase2.e2e.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 소스를 'GitHub Actions'로 자동 설정/전환
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
